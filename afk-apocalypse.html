    // What only looks: doors swinging, roofs fading, particles, floaters... (online guests run just this)
    updateLooks() {
      for (const d of this.room.hdoors || []) { // doors swinging open
        if (!d.open || d.anim >= 1) continue;
        d.anim = Math.min(1, d.anim + 0.12);
        for (const [x, y] of d.cells) G.rebuildUpright(this.room, x, y);
      }
      // walk into a house and its roof fades away (and back when you leave); online, only your own player counts
      if (this.room.roofs && this.room.roofs.length) {
        const who = this.online ? [this.me].filter((p) => p && !p.dead) : this.players.filter((p) => !p.dead);
        const inside = new Set(who.map((p) => G.regionAt(this.room, p.x, p.y - 4)));
        this.room.roofs.forEach((rf, i) => { rf.alpha += ((inside.has(i) ? 0 : 1) - rf.alpha) * 0.15; });
      }
      if (this.t % 4 === 0) this.fireFx();
      for (const b of this.beams) b.t++;
      G.compact(this.beams, (b) => b.t < BEAM_T);
      if (this.tallyFlash > 0) this.tallyFlash--;

      for (const q of this.parts) {
        q.x += q.vx; q.y += q.vy; q.z += q.vz; q.vz -= q.g; q.life--;
        if (q.z < 0) { q.z = 0; q.vz *= -0.4; q.vx *= 0.6; q.vy *= 0.6; }
      }
      G.compact(this.parts, (q) => q.life > 0); // in place: no new arrays every frame
      for (const o of this.props) {
        o.life--;
        if (o.z > 0 || o.vz > 0) {
          o.x += o.vx; o.y += o.vy; o.z += o.vz; o.vz -= 0.15; o.spin++;
          if (o.z <= 0) { // hit the ground: bounce once, crack
            o.z = 0; o.vz = o.cracked ? 0 : 1; o.vx *= 0.4; o.vy *= 0.4;
            if (!o.cracked) { o.cracked = true; if (this.onScreen(o.x, o.y)) G.sfx.play('crack'); }
          }
        }
      }
      G.compact(this.props, (o) => o.life > 0);
      for (const f of this.floaters) { f.y -= 0.4; f.life--; }
      G.compact(this.floaters, (f) => f.life > 0);
      for (const g of this.ghosts) g.life--;
      G.compact(this.ghosts, (g) => g.life > 0);
      for (const r of this.rings) r.life--;
      G.compact(this.rings, (r) => r.life > 0);
      if (this.shakeT > 0 && --this.shakeT === 0) this.shakeA = 0;
      this.updateCam(false);
    }

    // ---- Drawing ----
    draw(ctx) {
      if (this.edit) return G.EditMode.draw(this, ctx);
      let cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
      if (this.shakeT > 0) { cx += G.fx.randi(-this.shakeA, this.shakeA); cy += G.fx.randi(-this.shakeA, this.shakeA); }
      const v = { x: cx, y: cy };
      ctx.fillStyle = '#0b0614'; ctx.fillRect(0, 0, G.W, G.H);
      ctx.drawImage(this.room.canvas, -cx, -cy);

      G.drawWet(ctx, this, cx, cy); // a mop bot's trail
      for (const r of this.rings) { // blast rings on the ground (flattened circles)
        const rad = r.max * (1 - r.life / 14) + 2, n = Math.max(16, Math.round(rad * 2));
        ctx.fillStyle = r.col;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          ctx.fillRect(Math.round(r.x - cx + Math.cos(a) * rad), Math.round(r.y - cy + Math.sin(a) * rad * 0.6), 1, 1);
        }
      }
      for (const g of this.ghosts) { // frame-skip afterimages: RGB-split ghosts
        const sx = Math.round(g.x - cx) - 8, sy = Math.round(g.y - cy) - 22;
        ctx.globalAlpha = (g.life / 14) * 0.55;
        ctx.drawImage(G.tinted(g.spr, '#ff3ab0'), sx - 2, sy);
        ctx.drawImage(G.tinted(g.spr, '#3ad0ff'), sx + 2, sy);
        ctx.globalAlpha = 1;
      }
      // characters and upright objects back-to-front (tall things in front of you get a peek window)
      if (this.exit) this.exit.drawFloor(ctx, v);
      for (const b of this.buttons) b.drawFloor(ctx, v);
      G.drawSorted(ctx, this.room, v, [...this.chests, ...this.pickups, ...this.mowers, ...this.dummies, ...this.neighbors, ...this.enemies, ...this.players]);
      for (const b of this.beams) this.drawBeam(ctx, b, cx, cy);
      // shots and sparks under the roofs; roofs on top of everything in the world; then x-ray and hints
      for (const o of this.props) this.drawPhone(ctx, o, cx, cy);
      G.drawEnemyFx(ctx, this, v); // swing arcs, chat bubbles, !/? on top of the world
      for (const s of this.shots) G.SHOTS[s.kind].draw(ctx, s, v);
      for (const q of this.parts) {
        ctx.fillStyle = q.col;
        ctx.fillRect(Math.round(q.x - cx), Math.round(q.y - cy - q.z), q.size, q.size);
      }
      // roofs (with a peek window around anyone walking behind a house)
      const peeks = this.players.filter((p) => !p.dead && G.roofCover(this.room, p).covered > 0).map((p) => ({ x: p.x - cx, y: p.y - 11 - cy }));
      G.drawRoofs(ctx, this.room, v, 1, peeks);
      if (this.pda || this.players.some((p) => p.revealT > 0)) this.drawShimmer(ctx, v); // the PDA, or Ted's I Knew It!
      for (const f of this.floaters) {
        if (f.life < 12 && f.life % 2) continue;
        G.text(f.text, f.x - cx, f.y - cy, f.col, { align: 'center', shadow: '#140c1c' });
      }
      for (const p of this.players) {
        if (this.coop && p.dead) { // down: HELP! and how far along the revive is
          if ((this.t >> 4) & 1) G.text('HELP!', p.x - cx, p.y - cy - 32, '#ff3a5a', { align: 'center', shadow: '#140c1c' });
          if (p.reviveT > 0) { ctx.fillStyle = '#140c1c'; ctx.fillRect(Math.round(p.x - cx) - 11, Math.round(p.y - cy) + 3, 22, 4); ctx.fillStyle = '#38f0a0'; ctx.fillRect(Math.round(p.x - cx) - 10, Math.round(p.y - cy) + 4, Math.round(20 * Math.min(1, p.reviveT / REVIVE_T)), 2); }
          continue;
        }
        if (this.coop && !p.label && !p.dead && p.num) G.text(String(p.num), p.x - cx, p.y - cy - 31, G.PCOLS[p.num - 1], { align: 'center', shadow: '#140c1c' }); // which one's you
        if (!p.label || p.dead) continue;
        const hw = G.textWidth(p.label.text) / 2;
        G.text(p.label.text, G.clamp(p.x - cx, hw + 2, G.W - hw - 2), p.y - cy - 34, p.label.col, { align: 'center', shadow: '#140c1c' });
      }
      drawHud(ctx, this);
      G.Debug.draw(this, ctx, v);
      this.drawNeighborMarkers(ctx, cx, cy);
      this.drawCrosshair(ctx);
      this.drawNeighborCount(ctx);
      if (this.overT > 0) this.drawGameOver(ctx);
      ctx.fillStyle = 'rgba(11,6,20,.82)'; ctx.fillRect(0, G.H - 11, G.W, 11);
      G.text(hintLine(this.t, this.shared), G.W / 2, G.H - 9, '#9a8ec0', { align: 'center' });
      if (this.remote && (this.hostPaused || !this.gotSnap || this.snapT > 90) && (this.t >> 4) & 1) { // online guest: waiting on the host
        const msg = this.hostPaused ? 'HOST PAUSED' : !this.gotSnap ? 'JOINING...' : 'WAITING FOR THE HOST...';
        G.box(G.W / 2 - G.textWidth(msg) / 2 - 7, 100, G.textWidth(msg) + 14, 14); G.text(msg, G.W / 2, 104, '#ffd23a', { align: 'center' });
      }
    }
    // Mouse aiming: a small crosshair where the cursor is (the system cursor is hidden over the game while it shows)
    drawCrosshair(ctx) {
      const M = I.mouse, on = M.active && I.mouseAllowed() && this.players.some((p) => p.aimingWithMouse);
      document.body.classList.toggle('mouseaim', on);
      if (!on) return;
      const x = Math.round(M.gx), y = Math.round(M.gy);
      ctx.fillStyle = '#140c1c';
      ctx.fillRect(x - 4, y - 1, 3, 3); ctx.fillRect(x + 2, y - 1, 3, 3); ctx.fillRect(x - 1, y - 4, 3, 3); ctx.fillRect(x - 1, y + 2, 3, 3);
      ctx.fillStyle = M.left ? '#ff8a2a' : '#ffffff';
      ctx.fillRect(x - 3, y, 2, 1); ctx.fillRect(x + 2, y, 2, 1); ctx.fillRect(x, y - 3, 1, 2); ctx.fillRect(x, y + 2, 1, 2);
    }
    // Search a trash can or mailbox: usually loot pops out, sometimes a phone teen jumps out, sometimes it's empty
    // `by`: who's searching (loot pops out on their side, never behind the can)
    search(tx, ty, by) {
      const R = this.room, i = ty * R.w + tx;
      if (R.searched.has(i)) return;
      R.searched.add(i); G.rebuildUpright(R, tx, ty); // the lid comes off / the flap drops
      const x = tx * 16 + 8, y = ty * 16 + 14, roll = G.rng.next(), T = (R.theme.searchLoot || {})[R.at(tx, ty)], S = T || G.SEARCH;
      this.burst(x, y - 10, 8, ['#6a7a6a', '#a89878', '#ffffff'], 1.2, 10, 18, true);
      G.sfx.play('open');
      if (roll < S.teen) { // surprise!
        const e = new G.Enemy('phoneTeen', x, y + 6); e.rise = 0; e.aggro = true; e.alert = 30;
        this.enemies.push(e);
        this.floater(x, y - 26, '!?', '#ff3a5a');
      } else if (roll < S.teen + S.empty) this.floater(x, y - 26, 'EMPTY', '#9a8ec0');
      else if (T && T.plates && roll < S.teen + S.empty + T.plates) { // a kitchen: a stack of dinner plates
        const dx = by ? by.x - x : 0, dy = by ? by.y - y : 1, d = Math.hypot(dx, dy) || 1;
        this.pickups.push(new G.Pickup('w:plates', x + (dx / d) * 12, y + (dy / d) * 10, { pop: true }));
      } else {
        const dx = by ? by.x - x : 0, dy = by ? by.y - y : 1, d = Math.hypot(dx, dy) || 1;
        this.dropLoot(x + (dx / d) * 12, y + (dy / d) * 10, by);
      }
    }
    // ---- Neighbors ----
    neighborsLeft() { return this.neighbors.length; }
    // A player touched a neighbor: the visitor beams them to safety
    rescue(n) {
      if (n.gone) return;
      n.gone = true; this.saved++; this.tallyFlash = 60;
      this.beams.push({ x: n.x, y: n.y, spr: n.frame(), t: 0 });
      if (this.out) this.out.push(['m', Math.round(n.x), Math.round(n.y), n.nid || 0]);
      if (n.kind === 'mower' && !this.remote) { this.mowers.push(new G.Mower(n.x + 10, n.y)); this.floater(n.x, n.y - 50, 'HE LEFT HIS MOWER!', '#38f0a0'); } // push it: it mows teens
      this.addScore(n.score); // each kind is worth its own points (neighbors.js)
      this.floater(n.x, n.y - 30, 'SAVED!', '#7ff0ff');
      this.floater(n.x, n.y - 40, '+' + n.score, '#ffd23a');
      G.sfx.play('beam');
      this.checkAllAccounted();
    }
    // An enemy got to a neighbor first: they turn into a phone teen on the spot
    convert(n) {
      if (n.gone || n.safeT > 0) return; // just unplugged: a moment's grace
      n.gone = true; this.lost++; this.tallyFlash = 60;
      for (let i = 0; i < (n.kd.people || 1); i++) { // tourists: both of them turn
        const e = new G.Enemy('phoneTeen', n.x + i * 10, n.y);
        e.rise = 0; e.flash = 10;
        if (i === 0) e.wasNeighbor = n.kind; // June can unplug them back
        this.enemies.push(e);
      }
      this.burst(n.x, n.y - 10, 14, ['#7ff0ff', '#1a1a28', '#ff3a5a', '#ffffff'], 1.6, 10, 26, true);
      this.floater(n.x, n.y - 30, 'LOST!', '#ff3a5a');
      G.sfx.play('lost');
      this.checkAllAccounted();
    }
    // June's Unplug: a teen turns back into a neighbor where it stands. One that was a neighbor before comes back
    // as who they were (and isn't lost any more); any other teen becomes a bonus neighbor of the kind that fits there.
    unplug(e) {
      e.dead = true;
      const R = this.room, tx = G.clamp(Math.floor(e.x / 16), 0, R.w - 1), ty = G.clamp(Math.floor((e.y - 2) / 16), 0, R.h - 1);
      const n = new G.Neighbor(e.x, e.y, e.wasNeighbor || G.neighborKind(R, tx, ty, this.def.kinds));
      n.safeT = 120; // teens can't grab them straight back (2 s)
      if (e.wasNeighbor && this.lost > 0) this.lost--;
      this.neighbors.push(n); this.tallyFlash = 60;
      if (G.LOOKS[e.look] && G.LOOKS[e.look].holdPhone) this.tossPhone(e.x, e.y, 1);
      this.burst(e.x, e.y - 10, 16, ['#7ff0ff', '#ffffff', '#38f0a0'], 1.4, 10, 24, true);
      this.floater(e.x, e.y - 30, 'UNPLUGGED!', '#7ff0ff');
    }
    checkAllAccounted() {
      if (this.neighbors.some((n) => !n.gone)) return;
      G.toast(this.lost ? 'EVERYONE ACCOUNTED FOR - ' + this.saved + ' SAVED' : 'EVERY NEIGHBOR SAVED!', 180);
      if (this.exit && !this.exit.open) { this.exit.open = true; this.floater(this.exit.x, this.exit.y - 30, 'THE TIME DOOR IS OPEN', '#ff5ab0'); G.sfx.play('unlock'); }
    }
    // The beam: a column of light from the sky; the neighbor lifts and fades up into it
    drawBeam(ctx, b, cx, cy) {
      const k = b.t / BEAM_T, x = Math.round(b.x - cx), y = Math.round(b.y - cy);
      const sw = b.spr ? b.spr.width : 16, w = Math.round(Math.max(14, sw - 2) * Math.sin(Math.PI * Math.min(1, k * 1.3))); // opens, then closes
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#7ff0ff'; ctx.fillRect(x - w / 2, 0, w, y + 2);
      ctx.globalAlpha = 0.7; ctx.fillStyle = '#ffffff'; ctx.fillRect(x - Math.max(1, w / 4), 0, Math.max(2, w / 2), y + 2);
      ctx.globalAlpha = Math.max(0, 1 - k * 1.2);
      if (b.spr) ctx.drawImage(G.tinted(b.spr, '#c8f8ff'), x - Math.floor(b.spr.width / 2), y - b.spr.height + 2 - Math.round(k * k * 40));
      ctx.globalAlpha = 1;
      if ((b.t >> 1) & 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 6 + ((b.t * 7) % 12), y - 4 - ((b.t * 5) % 30), 1, 1); }
    }
    // Arrows at the screen edge pointing to the nearest neighbors you can't see (only the closest few, so it's a
    // nudge, not a radar). Yellow and blinking when that neighbor is panicking (a teen is near them).
    drawNeighborMarkers(ctx, cx, cy) {
      const p = this.players.find((q) => !q.dead);
      if (!p) return;
      const L = 6, R = G.W - 6, T = 34, B = G.H - 16; // inside the HUD and the hint bar
      const off = this.neighbors.filter((n) => { const x = n.x - cx, y = n.y - 12 - cy; return x < 0 || x > G.W || y < 21 || y > G.H - 11; });
      off.sort((a, b) => Math.hypot(a.x - p.x, a.y - p.y) - Math.hypot(b.x - p.x, b.y - p.y));
      const ox = p.x - cx, oy = p.y - 12 - cy; // from the player on screen
      off.slice(0, NEIGHBOR_MARKERS).forEach((n, i) => {
        const dx = n.x - cx - ox, dy = n.y - 12 - cy - oy;
        const k = Math.min(dx > 0 ? (R - ox) / dx : dx < 0 ? (L - ox) / dx : Infinity, dy > 0 ? (B - oy) / dy : dy < 0 ? (T - oy) / dy : Infinity);
        const x = Math.round(ox + dx * k), y = Math.round(oy + dy * k), a = Math.atan2(dy, dx);
        if (n.panic && (this.t >> 3) & 1) return; // blink
        ctx.globalAlpha = 1 - i * 0.22;
        // a little arrowhead pointing at them: each pixel outlined dark first, then filled in
        const pts = ARROW.map(([px, py]) => [Math.round(x + Math.cos(a) * px - Math.sin(a) * py), Math.round(y + Math.sin(a) * px + Math.cos(a) * py)]);
        ctx.fillStyle = '#140c1c'; for (const [rx, ry] of pts) ctx.fillRect(rx - 1, ry - 1, 3, 3);
        ctx.fillStyle = n.panic ? '#ffd23a' : '#7ff0ff'; for (const [rx, ry] of pts) ctx.fillRect(rx, ry, 1, 1);
        ctx.globalAlpha = 1;
      });
    }
    // Saved / lost / left, just under the HUD (flashes when it changes)
    drawNeighborCount(ctx) {
      const total = this.saved + this.lost + this.neighbors.length;
      if (!total) return;
      const hot = this.tallyFlash > 0 && (this.tallyFlash >> 2) & 1, gap = 6;
      const parts = [['SAVED ' + this.saved, '#7ff0ff'], ['LOST ' + this.lost, '#ff5a6a'], ['LEFT ' + this.neighbors.length, '#ffffff']];
      if (this.coop) parts.push(['SCORE ' + this.score, '#ffd23a']); // no room for it in the co-op HUD
      const w = parts.reduce((a, [t]) => a + G.textWidth(t), 0) + gap * (parts.length - 1) + 6; // sized to the text
      ctx.fillStyle = hot ? 'rgba(58,42,16,.9)' : 'rgba(11,6,20,.75)'; ctx.fillRect(G.W - w, 21, w, 10);
      let x = G.W - w + 3;
      for (const [t, col] of parts) { G.text(t, x, 23, col); x += G.textWidth(t) + gap; }
    }
    // A dropped phone: 3x5 px, tumbling (alternates upright and sideways) until it lands; cracked screen after
    drawPhone(ctx, o, cx, cy) {
      if (o.life < 30 && (o.life >> 1) & 1) return; // blink out
      const side = o.z > 0 && (o.spin >> 2) & 1, w = side ? 5 : 3, h = side ? 3 : 5;
      const x = Math.round(o.x - cx - w / 2), y = Math.round(o.y - cy - o.z - h);
      ctx.fillStyle = 'rgba(10,4,24,.35)'; ctx.fillRect(Math.round(o.x - cx) - 2, Math.round(o.y - cy), 4, 1); // shadow
      ctx.fillStyle = '#1a1a28'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = o.cracked ? '#3a4a58' : '#7ff0ff'; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
      if (o.cracked) { ctx.fillStyle = '#e8f8ff'; ctx.fillRect(x + 1, y + 1, 1, 1); if (!side) ctx.fillRect(x + 1, y + 3, 1, 1); }
    }
    // Everyone is out of lives: count the attempt, a moment to take it in, then the game-over screen (screens.js)
    gameOver() {
      if (++this.overT === 1) { G.save.data.attempt++; G.save.write(); G.sfx.play('gameover'); }
      if (this.overT > 90) G.setState(new G.states.GameOver(this));
    }
    drawGameOver(ctx) {
      ctx.fillStyle = 'rgba(11,6,20,.6)'; ctx.fillRect(0, 84, G.W, 40);
      G.text('GAME OVER', G.W / 2, 92, '#ff3a5a', { align: 'center', shadow: '#140c1c' });
      G.text('ATTEMPT #' + (G.save.data.attempt - 1) + ' FAILED', G.W / 2, 108, '#ffd23a', { align: 'center', shadow: '#140c1c' });
    }
    // PDA: secret tiles sparkle on screen
    drawShimmer(ctx, v) {
      const th = this.room.theme, x0 = Math.floor(v.x / 16), y0 = Math.floor(v.y / 16);
      for (let ty = Math.max(0, y0); ty <= Math.min(this.room.h - 1, y0 + 15); ty++) {
        for (let tx = Math.max(0, x0); tx <= Math.min(this.room.w - 1, x0 + 17); tx++) {
          if (!th.secret.has(this.room.at(tx, ty))) continue;
          // marching dotted outline around the secret tile
          const bx = tx * 16 - v.x, by = ty * 16 - v.y, off = (this.t >> 2) % 4;
          ctx.globalAlpha = 0.75 + 0.25 * Math.sin(this.t / 8);
          ctx.fillStyle = '#7ff0ff';
          for (let i = off; i < 16; i += 4) {
            ctx.fillRect(bx + i, by, 2, 1); ctx.fillRect(bx + 15 - i, by + 15, 2, 1);
            ctx.fillRect(bx, by + 15 - i, 1, 2); ctx.fillRect(bx + 15, by + i, 1, 2);
          }
          ctx.globalAlpha = 1;
          for (let k = 0; k < 3; k++) {
            const ph = ((this.t >> 2) + tx * 5 + ty * 3 + k * 4) % 12;
            if (ph > 2) continue;
            const seed = (this.t >> 5) + k * 17;
            const px = tx * 16 + 2 + Math.floor(G.hash(tx * 31 + seed, ty) * 12) - v.x, py = ty * 16 + 2 + Math.floor(G.hash(ty * 7, seed + tx) * 12) - v.y;
            ctx.fillStyle = ph === 1 ? '#ffffff' : '#7ff0ff';
            ctx.fillRect(px, py, 1, 1);
            if (ph === 1) { ctx.fillRect(px - 1, py, 3, 1); ctx.fillRect(px, py - 1, 1, 3); }
          }
        }
      }
    }
    // PDA map: the whole level at `s` pixels per tile. `t` drives the blinking (the stage is paused while it's open).
    drawRadar(ctx, x0, y0, s, t) {
      const m = this.room.mini, W = m.width * s, H = m.height * s, blink = (t >> 4) & 1;
      ctx.fillStyle = '#0b0614'; ctx.fillRect(x0 - 2, y0 - 2, W + 4, H + 4);
      ctx.fillStyle = '#7ff0a0';
      ctx.fillRect(x0 - 2, y0 - 2, W + 4, 1); ctx.fillRect(x0 - 2, y0 + H + 1, W + 4, 1);
      ctx.fillRect(x0 - 2, y0 - 2, 1, H + 4); ctx.fillRect(x0 + W + 1, y0 - 2, 1, H + 4);
      ctx.globalAlpha = 0.85; ctx.drawImage(m, x0, y0, W, H); ctx.globalAlpha = 1;
      const dot = (px, py, col, n = 1) => {
        const sz = n * s;
        ctx.fillStyle = col;
        ctx.fillRect(x0 + Math.floor((px / 16) * s) - (sz >> 1), y0 + Math.floor((py / 16) * s) - (sz >> 1), sz, sz);
      };
      const th = this.room.theme;
      if (blink) for (let ty = 0; ty < this.room.h; ty++) for (let tx = 0; tx < this.room.w; tx++) {
        if (th.secret.has(this.room.at(tx, ty))) { ctx.fillStyle = '#7ff0ff'; ctx.fillRect(x0 + tx * s, y0 + ty * s, s, s); }
      }
      for (const c of this.chests) if (!c.open) dot(c.x, c.y, '#ffd23a', 2);
      for (const z of this.enemies) dot(z.x, z.y, '#ff3a5a');
      for (const n of this.neighbors) dot(n.x, n.y, '#ffffff', 2);
      if (this.exit && this.exit.open) dot(this.exit.x, this.exit.y, '#38f0a0', 3);
      for (const p of this.players) if (!p.dead && blink) dot(p.x, p.y, '#ff5ab0', 2);
    }
  }
  G.Stage = Stage;

  // ===== Full-screen PDA map: toggled with the Use Item button while the PDA is selected (game is paused) =====
  class MapView {
    constructor(st) { this.st = st; this.menu = true; this.noToast = true; this.t = 0; G.sfx.play('pda'); }
    update() {
      this.t++;
      const m = I.menu;
      if (I.solo.s.itemP || m.confirmP || m.backP || m.startP || I.taps.length) { G.sfx.play('blip'); G.setState(this.st); }
    }
    draw(ctx) {
      const st = this.st;
      st.draw(ctx);
      ctx.fillStyle = 'rgba(8,4,20,.85)'; ctx.fillRect(0, 0, G.W, G.H);
      G.text('PDA MAP - ' + st.def.name, 128, 4, '#7ff0a0', { align: 'center', shadow: '#0a2a1a' });
      const sc = Math.max(1, Math.floor(Math.min(240 / st.room.w, 160 / st.room.h))); // fit any map size
      st.drawRadar(ctx, Math.round(128 - (st.room.w * sc) / 2), 18, sc, this.t);
      let x = 12;
      const key = (col, label) => { ctx.fillStyle = col; ctx.fillRect(x, 186, 4, 4); G.text(label, x + 7, 184, '#c8c0e0'); x += G.textWidth(label) + 16; };
      key('#ff5ab0', 'YOU'); key('#7ff0ff', 'SECRET'); key('#ffd23a', 'PACKAGE'); key('#ffffff', 'NEIGHBOR');
      if ((this.t >> 5) % 2 === 0) G.text('USE ITEM AGAIN TO CLOSE', 128, 200, '#8a7aa8', { align: 'center' });
    }
  }

  // ===== HUD (ZAMN-style: portrait + lives, hearts, weapon slot, item slot, keycards and keys, score) =====
  function slot(ctx, x, icon, lit) {
    ctx.fillStyle = lit ? '#ffd23a' : '#3a2f58'; ctx.fillRect(x, 2, 16, 16);
    ctx.fillStyle = '#1a1230'; ctx.fillRect(x + 1, 3, 14, 14);
    if (icon) ctx.drawImage(icon, x + 1, 3);
  }
  // The portrait doubles as the skill meter: it fills from the bottom while recharging. Lives on top of it.
  function portrait(ctx, p, x, blink) {
    const frac = p.skillCd <= 0 ? 1 : 1 - p.skillCd / p.skillMax, fh = Math.round(16 * frac);
    ctx.fillStyle = '#2a1f44'; ctx.fillRect(x, 2, 16, 16);
    ctx.fillStyle = frac >= 1 ? (blink ? '#2a8ab0' : '#3aa8d0') : '#1e5a78'; ctx.fillRect(x, 18 - fh, 16, fh);
    ctx.drawImage(p.dead ? G.tinted(p.sprites.down[0], '#5a5a7a') : p.sprites.down[0], 0, 2, 16, 16, x, 2, 16, 16);
    G.text(String(p.lives), x + 11, 11, '#ffffff', { shadow: '#140c1c' });
  }
  function hearts(ctx, p, x, y, gap) {
    if (p.healFlash > 0) { // just ate: glow behind the hearts
      ctx.fillStyle = (p.healFlash >> 2) & 1 ? '#ff9ad0' : '#ff3a5a';
      ctx.globalAlpha = Math.min(1, p.healFlash / 20); ctx.fillRect(x - 2, y - 2, (p.maxHp / 2) * gap + 2, 10); ctx.globalAlpha = 1;
    }
    for (let i = 0; i < p.maxHp / 2; i++) {
      const v = p.hp - i * 2, h = G.art.heart, img = v >= 2 ? h.full : v === 1 ? h.half : h.empty;
      ctx.drawImage(p.healFlash > 0 && (p.healFlash >> 2) & 1 && v > 0 ? G.tinted(img, '#ffffff') : img, x + i * gap, y);
    }
  }
  // Inventory strip: pops up under the HUD whenever you swap or pick something up (under slot x)
  function invStrip(ctx, p, x, blink) {
    const isW = p.invKind === 'w';
    const list = isW ? p.weapons.map((q) => G.WEAPONS[q.id].icon) : p.items.map((q) => G.ITEMS[q.id].icon);
    if (!list.length) return;
    const sel = isW ? p.wsel : p.isel, bw = list.length * 18 + 6, bx = G.clamp(x - 3, 2, G.W - bw - 2);
    G.box(bx, 22, bw, 22);
    list.forEach((icon, i) => {
      const ix = bx + 3 + i * 18;
      if (i === sel) { ctx.fillStyle = blink ? '#ffd23a' : '#fff0a0'; ctx.fillRect(ix, 24, 18, 18); ctx.fillStyle = '#1a1230'; ctx.fillRect(ix + 1, 25, 16, 16); }
      ctx.drawImage(G.art.icons[icon], ix + 2, 26);
    });
  }
  // Online: everyone else, small, at the bottom left (number, name, hearts; DOWN when they're down)
  function partners(ctx, st, me) {
    let y = G.H - 21;
    for (const q of st.players) {
      if (q === me) continue;
      ctx.fillStyle = 'rgba(11,6,20,.75)'; ctx.fillRect(2, y - 1, 78, 9);
      G.text(q.num + ' ' + (q.def.short || q.def.name), 4, y, G.PCOLS[(q.num || 1) - 1]);
      if (q.dead) G.text('DOWN', 78, y, '#ff3a5a', { align: 'right' });
      else for (let i = 0; i < q.maxHp / 2; i++) { ctx.fillStyle = q.hp - i * 2 >= 1 ? '#ff3a5a' : '#3a2238'; ctx.fillRect(52 + i * 4, y + 1, 3, 3); }
      y -= 10;
    }
  }
  // Co-op: each player gets half the bar: portrait, name and ammo, hearts, weapon and item slots, keycards and keys
  function hudHalf(ctx, st, p, x0, blink) {
    const col = p.num === 1 ? '#ff5ab0' : '#3ad0ff';
    portrait(ctx, p, x0 + 2, blink);
    G.text(p.def.short || p.def.name, x0 + 21, 2, col);
    hearts(ctx, p, x0 + 21, 11, 7);
    const w = p.weapon, wd = G.WEAPONS[w.id], WX = x0 + 72;
    slot(ctx, WX, G.art.icons[wd.icon], p.invShow > 0 && p.invKind === 'w');
    if (wd.signature) for (let i = 0; i < 3; i++) { ctx.fillStyle = i < w.lv ? '#ffd23a' : '#3a2f58'; ctx.fillRect(WX + 2 + i * 4, 16, 3, 1); } // level pips
    const ammo = wd.returns ? '' : w.ammo <= 0 ? 'MELEE' : String(w.ammo);
    G.text(ammo, WX - 2, 2, w.ammo <= wd.ammo * 0.2 && blink ? '#ff3a5a' : '#ff8a2a', { align: 'right' });
    const it = p.item, IX = x0 + 90;
    slot(ctx, IX, it && G.art.icons[G.ITEMS[it.id].icon], p.invShow > 0 && p.invKind === 'i');
    if (it && !G.ITEMS[it.id].keep && it.n > 1) G.text(String(it.n), IX + 15, 11, '#ffffff', { align: 'right', shadow: '#140c1c' });
    let hx = x0 + 109; // keycards (a small card each), then a key and how many
    for (const c of G.CARDS) {
      if (!p.cards[c]) continue;
      const [cc, l] = G.CARD_COLORS[c];
      ctx.fillStyle = '#140c1c'; ctx.fillRect(hx - 1, 2, 6, 8); ctx.fillStyle = cc; ctx.fillRect(hx, 3, 4, 6); ctx.fillStyle = l; ctx.fillRect(hx, 3, 4, 1);
      hx += 6;
    }
    if (p.keys) G.text('K' + p.keys, x0 + 109, 11, '#e0c060');
    if (p.invShow > 0) invStrip(ctx, p, p.invKind === 'w' ? WX : IX, blink);
  }
  function drawHud(ctx, st) {
    const p = st.me, blink = (st.t >> 3) & 1;
    if (st.online && p) partners(ctx, st, p);
    ctx.fillStyle = '#0b0614'; ctx.fillRect(0, 0, G.W, 20);
    ctx.fillStyle = '#3a1a4a'; ctx.fillRect(0, 19, G.W, 1);
    ctx.fillStyle = '#ff5ab0'; ctx.fillRect(0, 20, G.W, 1);
    st.hudTap = null;
    if (!p) return; // an online guest before the first snapshot
    if (st.shared) {
      st.players.slice(0, 2).forEach((q, i) => hudHalf(ctx, st, q, i * 128, blink));
      ctx.fillStyle = '#3a1a4a'; ctx.fillRect(127, 2, 1, 16); // the split
      return;
    }
    portrait(ctx, p, 2, blink);
    G.text(p.def.short || p.def.name, 21, 2, '#ffffff');
    hearts(ctx, p, 20, 11, 8);
    // Full-health perk: a thin bar under the hearts while it's on (bright when the charged dart or the guard is ready)
    const perk = G.perkOf(p);
    if (perk !== 'off') {
      const ready = perk === 'charged' ? p.perkReady() : perk === 'guard' ? !(p.guardCd > 0) : true;
      ctx.fillStyle = !ready ? '#5a4a20' : perk === 'guard' ? '#7ff0ff' : blink && perk === 'charged' ? '#ffffff' : '#ffd23a';
      ctx.fillRect(20, 18, p.maxHp * 4 - 2, 1);
    }
    // Weapon slot (everything from here on slides right a heart's width for each heart over 4: Lou has 6)
    const sh = Math.max(0, p.maxHp / 2 - 4) * 8, WX = 56 + sh, IX = 120 + sh;
    st.hudTap = { wpn: [WX - 2, IX - 2], itm: [IX - 2, IX + 56] }; // touch: tap the weapon or the item up here to swap it (input.js)
    const w = p.weapon, wd = G.WEAPONS[w.id];
    slot(ctx, WX, G.art.icons[wd.icon], p.invShow > 0 && p.invKind === 'w');
    G.text(wd.name, WX + 19, 2, '#ff8a2a');
    if (wd.signature) {
      for (let i = 0; i < 3; i++) { ctx.fillStyle = i < w.lv ? '#ffd23a' : '#3a2f58'; ctx.fillRect(WX + 19 + i * 5, 13, 4, 3); }
      if (wd.returns) { // the skillet: how many are in hand (the rest are flying)
        const out = st.shots.filter((s) => s.kind === 'skillet' && (s.owner === p || (s.ow && s.ow === p.num))).length;
        G.text(out >= w.lv ? 'OUT' : String(w.lv - out), WX + 36, 11, out >= w.lv ? '#8a7aa8' : '#ffffff');
      }
      else if (w.ammo <= 0) G.text('MELEE', WX + 36, 11, blink ? '#ff3a5a' : '#ff8a8a'); // out: you're bonking
      else G.text('X' + w.ammo, WX + 36, 11, w.ammo <= wd.ammo * 0.2 && blink ? '#ff3a5a' : '#ffffff');
    } else {
      G.text('X' + w.ammo, WX + 19, 11, w.ammo <= Math.max(1, wd.ammo * 0.25) && blink ? '#ff3a5a' : '#ffffff');
    }
    // Item slot
    const it = p.item;
    slot(ctx, IX, it && G.art.icons[G.ITEMS[it.id].icon], p.invShow > 0 && p.invKind === 'i');
    if (it) { G.text(G.ITEMS[it.id].name, IX + 19, 2, '#38f0a0'); G.text(G.ITEMS[it.id].keep ? 'MAP' : 'X' + it.n, IX + 19, 11, G.ITEMS[it.id].keep ? '#7ff0a0' : '#ffffff'); }
    else G.text('NONE', IX + 19, 6, '#4a3e6a');
    // what you hold to open things: keycards by color (a small card each, with a count if you have more than one),
    // then plain house keys
    let hx = IX + 57; // clear of the item name (6 letters at most)
    for (const col of G.CARDS) {
      const n = p.cards[col];
      if (!n) continue;
      const [c, l] = G.CARD_COLORS[col];
      ctx.fillStyle = '#140c1c'; ctx.fillRect(hx - 1, 3, 7, 10); ctx.fillStyle = c; ctx.fillRect(hx, 4, 5, 8); ctx.fillStyle = l; ctx.fillRect(hx, 4, 5, 1);
      ctx.fillStyle = '#140c1c'; ctx.fillRect(hx, 6, 5, 1); ctx.fillStyle = '#ffffff'; ctx.fillRect(hx + 1, 9, 3, 1);
      if (n > 1) G.text(String(n), hx + 7, 9, c);
      hx += n > 1 ? 14 : 8;
    }
    if (p.keys) {
      ctx.drawImage(G.art.icons.hkey, hx - 2, 3);
      if (p.keys > 1) G.text(String(p.keys), hx + 11, 9, '#e0c060');
    }
    G.text('SCORE', 254, 2, '#8a7aa8', { align: 'right' });
    G.text(String(st.score).padStart(6, '0'), 254, 11, '#ffffff', { align: 'right' });

    if (p.invShow > 0) invStrip(ctx, p, p.invKind === 'w' ? WX : IX, blink);
  }

  // ===== Generic vertical menu helper (keyboard/gamepad/touch) =====
  G.runMenu = (...a) => runMenu(...a); // for the screens in screens.js
  function runMenu(m, items, rowY, rowH, x0, x1) {
    const n = items.length;
    if (I.menu.upP) { m.sel = (m.sel + n - 1) % n; G.sfx.play('blip'); }
    if (I.menu.downP) { m.sel = (m.sel + 1) % n; G.sfx.play('blip'); }
    const it = items[m.sel];
    if ((I.menu.leftP || I.menu.rightP) && it.val) { it.act(I.menu.leftP ? -1 : 1); G.sfx.play('blip'); }
    if (I.menu.confirmP) { G.sfx.play('confirm'); it.act(1); return true; }
    for (const tp of I.taps) {
      const i = Math.floor((tp.y - rowY + 3) / rowH);
      if (tp.x >= x0 && tp.x < x1 && i >= 0 && i < n) { m.sel = i; G.sfx.play('confirm'); items[i].act(1); return true; }
    }
    return false;
  }

  // ===== The time door (exit) =====
  // A ring on the ground that stays dark until every neighbor is saved or lost, then opens as a glowing portal.
  // Walk into it open and the level is clear.
  class ExitDoor {
    constructor(x, y) { Object.assign(this, { x, y, open: false, t: 0 }); }
    update(st) {
      this.t++;
      if (!this.open) return;
      const p = st.players.find((q) => !q.dead && Math.abs(q.x - this.x) < 10 && Math.abs(q.y - this.y) < 8);
      if (p) { G.sfx.play('confirm'); G.setState(new LevelClear(st)); }
    }
    drawFloor(ctx, v) {
      const sx = Math.round(this.x - v.x), sy = Math.round(this.y - v.y);
      if (sx < -24 || sy < -40 || sx > G.W + 24 || sy > G.H + 24) return;
      const n = 20, rx = 11, ry = 5;
      for (let i = 0; i < n; i++) { // the ring: dim and dotted while shut, bright and spinning once open
        const a = (i / n) * Math.PI * 2 + (this.open ? this.t / 20 : 0);
        ctx.fillStyle = this.open ? (i % 2 ? '#ff5ab0' : '#ffffff') : i % 3 ? '#4a3a5a' : '#7a5a8a';
        ctx.fillRect(Math.round(sx + Math.cos(a) * rx), Math.round(sy + Math.sin(a) * ry), 2, 1);
      }
      if (!this.open) return;
      const h = 26 + Math.sin(this.t / 10) * 2; // a column of light
      ctx.globalAlpha = 0.25; ctx.fillStyle = '#ff5ab0'; ctx.fillRect(sx - 9, Math.round(sy - h), 18, Math.round(h));
      ctx.globalAlpha = 0.5; ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 3, Math.round(sy - h), 6, Math.round(h));
      ctx.globalAlpha = 1;
    }
  }

  // ===== Level clear: the tally, then back to the title (the next level comes later) =====
  // After the tally: on to the next level's briefing (your crew carries over: lives, weapons, items, score), or, after
  // the last level there is so far, back to the title
  class LevelClear {
    constructor(st) {
      this.st = st; this.t = 0; this.menu = true; this.noToast = true;
      const i = G.LEVELS.indexOf(st.def);
      this.next = !st.test && i >= 0 ? G.LEVELS[i + 1] || null : null;
      if (st.score > (G.save.data.best || 0)) G.save.data.best = st.score;
      G.save.write();
    }
    update() {
      this.t++;
      if (!(this.t > 60 && (I.menu.confirmP || I.menu.startP || I.taps.length))) return;
      if (!this.next) { G.setState(new Boot()); return; }
      const carry = this.st.carryOut();
      G.setState(this.next.briefing ? new G.states.Briefing(this.next, this.st.crewId, carry) : new Stage(this.next, this.st.crewId).carryIn(carry));
    }
    draw(ctx) {
      const st = this.st;
      st.draw(ctx);
      ctx.fillStyle = 'rgba(8,4,20,.75)'; ctx.fillRect(0, 0, G.W, G.H);
      G.box(40, 50, 176, 118);
      G.text('LEVEL CLEAR!', G.W / 2, 60, '#ffd23a', { align: 'center', shadow: '#0e124a' });
      G.text(st.def.name, G.W / 2, 74, '#ff9ad0', { align: 'center', shadow: '#0e124a' });
      const rows = [['NEIGHBORS SAVED', st.saved, '#7ff0ff'], ['NEIGHBORS LOST', st.lost, '#ff5a6a'], ['SCORE', st.score, '#ffffff']];
      rows.forEach(([k, val, col], i) => {
        if (this.t < 20 + i * 20) return; // one line at a time
        G.text(k, 56, 96 + i * 14, col, { shadow: '#0e124a' });
        G.text(String(val), 200, 96 + i * 14, col, { align: 'right', shadow: '#0e124a' });
      });
      if (this.t > 60 && (this.t >> 4) % 2 === 0) G.text(this.next ? 'PRESS START: ON TO ' + this.next.name : 'PRESS START', G.W / 2, 150, '#ffd23a', { align: 'center', shadow: '#0e124a' });
    }
  }

  // ===== Pause / options =====
  // The FULL SCREEN menu row (title and pause, on touch screens): toggles it where the browser allows; on an iPhone
  // (no full screen for web pages) it explains Add to Home Screen.
  const fullItem = () => ({
    label: 'FULL SCREEN',
    val: () => (G.fs.standalone() || G.fs.on() ? 'ON' : G.fs.can() ? 'OFF' : 'HOW?'),
    act: () => {
      if (G.fs.on()) G.fs.toggle(); // leave it
      else if (G.fs.standalone()) G.toast('ALREADY FULL SCREEN', 90);
      else if (G.fs.can()) G.fs.toggle();
      else G.toast('SHARE, THEN ADD TO HOME SCREEN', 240);
    },
    help: () => (G.fs.can() || G.fs.standalone() ? 'HIDES THE BROWSER BARS' : 'IPHONE: SHARE > ADD TO HOME SCREEN'),
  });
  const labEnemy = () => (G.ENEMY_TYPES[G.labEnemy] ? G.labEnemy : 'drone'); // the test room's pick (pause menu)
  // ===== TOUCH LAYOUT (pause menu, touch screens): move, resize or hide the touch buttons (input.js does the work) =====
  class TouchLayout {
    constructor(back) {
      Object.assign(this, { back, menu: false, noToast: false, t: 0 });
      I.editLayout(true);
      I.onLayoutDone = () => { I.onLayoutDone = null; G.sfx.play('confirm'); G.setState(this.back); };
    }
    update() {
      this.t++;
      if (I.hits.Escape && I.layoutEdit) { I.editLayout(false); I.onLayoutDone(); }
    }
    draw(ctx) {
      this.back.game.draw(ctx);
      ctx.fillStyle = 'rgba(8,4,20,.55)'; ctx.fillRect(0, 0, G.W, G.H);
      G.text('TOUCH LAYOUT', G.W / 2, 70, '#ffd23a', { align: 'center', shadow: '#0e124a' });
      G.text('DRAG ANY BUTTON WHERE YOU LIKE IT', G.W / 2, 90, '#ffffff', { align: 'center', shadow: '#0e124a' });
      G.text('TAP ONE, THEN - / + TO RESIZE, HIDE', G.W / 2, 102, '#ffffff', { align: 'center', shadow: '#0e124a' });
      G.text('PORTRAIT AND LANDSCAPE ARE SAVED APART', G.W / 2, 118, '#8ae8ff', { align: 'center', shadow: '#0e124a' });
      G.text('TAP YOUR WEAPON OR ITEM UP TOP TO SWAP IT', G.W / 2, 134, '#8ae8ff', { align: 'center', shadow: '#0e124a' });
    }
  }
  class Pause {
    constructor(game) {
      this.game = game; this.menu = true; this.sel = 0; this.t = 0;
      const o = G.opts();
      this.items = [
        { label: 'RESUME', act: () => this.resume() },
        ...(game.practice ? [{ label: 'CHANGE CREW', act: () => practiceRecruit(() => G.setState(this)), help: () => 'TRY ANOTHER CREW MEMBER' }] : []),
        ...(game.test && !game.practice && !game.remote ? [ // the test room: try any enemy (pick one, then spawn it near you)
          { label: 'ENEMY', val: () => G.ENEMY_TYPES[labEnemy()].name, act: (d = 1) => { const L = Object.keys(G.ENEMY_TYPES); G.labEnemy = L[(L.indexOf(labEnemy()) + d + L.length) % L.length]; }, help: () => 'PICK ONE, THEN SPAWN IT' },
          { label: 'SPAWN IT NEAR ME', act: () => { this.resume(); if (!G.spawnEnemyNear(game, labEnemy())) G.toast('NO ROOM NEAR YOU', 60); } },
        ] : []),
        ...(I.touchUI ? [fullItem()] : []),
        ...(I.touchUI ? [{ label: 'CASE', val: () => (G.CASES[o.case] || G.CASES.grape).name, act: (d = 1) => { // the console's color
          const L = G.CASE_ORDER; o.case = L[(Math.max(0, L.indexOf(o.case)) + d + L.length) % L.length]; G.applyCase();
        }, help: () => ((G.CASES[o.case] || G.CASES.grape).clear ? 'SEE-THROUGH: YOU CAN SEE INSIDE' : 'THE COLOR OF THE CONSOLE') }] : []),
        ...(I.touchUI ? [{ label: 'TOUCH LAYOUT', act: () => G.setState(new TouchLayout(this)), help: () => 'MOVE, RESIZE OR HIDE THE BUTTONS' }] : []),
        { label: 'SCANLINES', val: () => (o.scanlines ? 'ON' : 'OFF'), act: () => { o.scanlines = !o.scanlines; G.applyOpts(); } },
        { label: 'AIM ASSIST', val: () => G.AIM_LABELS[o.aimAssist], act: (d = 1) => { o.aimAssist = (o.aimAssist + d + 3) % 3; } },
        { label: 'SOUND', val: () => (o.sound ? 'ON' : 'OFF'), act: () => { o.sound = !o.sound; G.sfx.unlock(); G.sfx.play('pickup'); }, // a test beep
          help: () => 'AUDIO ' + (G.sfx.ctx ? G.sfx.ctx.state.toUpperCase() : 'NOT STARTED') + (G.sfx.mediaOn() ? ' + MEDIA' : '') }, // what's going on, when it's quiet
        ...(game.remote ? [] : [{ label: 'DIFFICULTY', val: () => G.diff().name, act: (d = 1) => { const L = G.DIFF_ORDER; o.diff = L[(L.indexOf(o.diff) + d + L.length) % L.length]; }, help: () => G.diff().desc }]), // online: the host's counts
        { label: 'FULL HP PERK', val: () => (G.PERKS[o.perk] || G.PERKS.off).name, act: (d = 1) => { // a prototype: try each
          const L = G.PERK_ORDER, i = L.indexOf(o.perk);
          o.perk = L[((i < 0 ? L.length - 1 : i) + d + L.length) % L.length];
        }, help: () => (G.PERKS[o.perk] || G.PERKS.off).desc || 'NO PERK' },
        ...(game.remote ? [] : [{ label: game.test ? 'RESTART ROOM' : 'RESTART LEVEL', act: () => { G.save.write(); G.setState(new Stage(game.def, game.crewId)); } }]), // online, only the host restarts
        { label: game.remote ? 'LEAVE THE GAME' : game.online ? 'END THE GAME' : 'QUIT TO TITLE', act: () => { G.save.write(); if (game.remote) G.net.leave(); G.setState(new Boot()); } },
      ];
      this.bx = 34; this.bw = 188; this.bh = 26 + this.items.length * 13 + 16; this.by = Math.round((G.H - this.bh) / 2);
    }
    resume() { G.save.write(); G.setState(this.game); }
    update() {
      this.t++;
      if (I.menu.startP || I.menu.backP) { G.sfx.play('pause'); this.resume(); return; }
      runMenu(this, this.items, this.by + 26, 13, this.bx, this.bx + this.bw);
    }
    draw(ctx) {
      this.game.draw(ctx);
      ctx.fillStyle = 'rgba(8,4,20,.6)'; ctx.fillRect(0, 0, G.W, G.H);
      const { bx, by, bw, bh } = this;
      G.box(bx, by, bw, bh);
      G.text('PAUSED', G.W / 2, by + 8, '#ffd23a', { align: 'center', shadow: '#0e124a' });
      this.items.forEach((it, i) => {
        const y = by + 26 + i * 13, on = i === this.sel;
        if (on) { ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(bx + 4, y - 3, bw - 8, 12); }
        if (on && (this.t >> 4) % 2 === 0) G.text('>', bx + 8, y, '#ffd23a');
        G.text(it.label, bx + 16, y, on ? '#ffd23a' : '#ffffff', { shadow: '#0e124a' });
        if (it.val) G.text(it.val(), bx + bw - 10, y, on ? '#ffd23a' : '#8ae8ff', { align: 'right', shadow: '#0e124a' });
      });
      const help = this.items[this.sel].help; // a line about the selected option, if it has one (else the best score)
      G.text(help ? help() : 'BEST ' + G.save.data.best, G.W / 2, by + bh - 12, help ? '#ffd23a' : '#8a7aa8', { align: 'center' });
    }
  }

  // ===== Title screen (placeholder art until step 7) =====
  // The secret way into the Tuning Lab: the Konami code on the keyboard, or 7 taps on the logo
  const KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'KeyB', 'KeyA'];
  // The weapon practice range: pick a crew member (back: onBack), then in you go
  function practiceRecruit(onBack) {
    G.coop = null; I.controllers.length = 0;
    G.setState(new G.Recruit(1, { onPick: (crew) => G.setState(new Stage(G.PRACTICE, crew)), onBack }));
  }
  class Boot {
    constructor() { this.menu = true; this.t = 0; this.sel = 0; this.code = 0; this.logoTaps = 0; }
    secret() {
      for (const k of Object.keys(I.hits)) {
        if (!I.hits[k]) continue;
        this.code = k === KONAMI[this.code] ? this.code + 1 : k === KONAMI[0] ? 1 : 0;
        if (this.code === KONAMI.length) return true;
      }
      for (const tp of I.taps) if (tp.y < 76) { if (++this.logoTaps >= 7) return true; G.sfx.play('blip'); }
      return false;
    }
    items() {
      return [
        { label: '1 PLAYER', act: () => { G.coop = null; I.controllers.length = 0; G.setState(new G.Recruit()); } },
        { label: '2 PLAYERS (ONE SCREEN)', act: () => G.setState(new G.states.Join()) },
        { label: 'DIFFICULTY', val: () => G.diff().name, act: (d = 1) => { const o = G.opts(), L = G.DIFF_ORDER; o.diff = L[(L.indexOf(o.diff) + d + L.length) % L.length]; G.save.write(); } },
        { label: 'ONLINE (UP TO 4)', act: () => { G.coop = null; I.controllers.length = 0; G.setState(new G.states.OnlineMenu()); } },
        { label: 'WEAPON PRACTICE', act: () => practiceRecruit(() => G.setState(new Boot())) },
        { label: 'TEST ROOM', act: () => G.setState(new Stage(G.TEST_ROOM)) },
        // on a phone or tablet: full screen instead of the map editor (which wants a mouse and keyboard)
        I.touchUI ? fullItem() : { label: 'MAP EDITOR', act: () => { const st = new Stage(G.LEVELS[0]); G.setState(st); G.EditMode.enter(st); } },
      ];
    }
    update() {
      this.t++;
      if (this.secret()) { G.sfx.play('secret'); G.setState(new G.states.TuningLab()); return; }
      runMenu(this, this.items(), 116, 13, 40, 216);
    }
    draw(ctx) {
      const t = this.t, HZ = 128;
      const sky = ['#0b0614', '#100822', '#160b30', '#1e0e3c', '#281246', '#34164e', '#421a54'];
      sky.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * 19, G.W, 19); });
      for (let i = 0; i < 40; i++) {
        const x = Math.floor(G.hash(i, 7) * 256), y = Math.floor(G.hash(i, 3) * 100);
        ctx.fillStyle = (t + i * 13) % 90 < 6 ? '#ffffff' : '#6a5a9a';
        ctx.fillRect(x, y, 1, 1);
      }
      for (let y = -34; y <= 0; y++) { // striped synth sun
        if (y > -16 && (y + 40) % 5 < Math.floor((y + 16) / 4) + 1) continue;
        const hw = Math.floor(Math.sqrt(34 * 34 - y * y));
        ctx.fillStyle = G.mix('#ffd23a', '#ff3a8a', (y + 34) / 34);
        ctx.fillRect(128 - hw, HZ + y, hw * 2, 1);
      }
      ctx.fillStyle = '#12061e'; ctx.fillRect(0, HZ, G.W, G.H - HZ);
      ctx.fillStyle = '#ff2a8a';
      for (let i = -14; i <= 14; i++) for (let y = HZ; y < G.H; y++) {
        const k = (y - HZ) / (G.H - HZ);
        ctx.fillRect(Math.round(128 + i * (6 + k * 46)), y, 1, 1);
      }
      for (let k = 0; k < 9; k++) {
        const z = ((k + (t % 40) / 40) / 9) ** 2;
        ctx.globalAlpha = 0.3 + z * 0.7;
        ctx.fillRect(0, Math.round(HZ + z * (G.H - HZ)), G.W, 1);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff9ad0'; ctx.fillRect(0, HZ, G.W, 1);
      G.text('AFK', 128, 22, '#ff5ab0', { align: 'center', scale: 4, shadow: '#5a0a3a' });
      G.text('APOCALYPSE', 128, 58, '#3ad0ff', { align: 'center', scale: 2, shadow: '#0a2a5a' });
      G.text('ATTEMPT #' + G.save.data.attempt, 128, 82, '#ffd23a', { align: 'center', shadow: '#140c1c' });
      const items = this.items();
      ctx.fillStyle = 'rgba(11,6,20,.75)'; ctx.fillRect(40, 110, 176, items.length * 13 + 6);
      items.forEach((it, i) => {
        const y = 116 + i * 13, on = i === this.sel, label = it.val ? it.label + ': ' + it.val() : it.label;
        if (on && (t >> 4) % 2 === 0) G.text(it.val ? '<' : '>', 46, y, '#ffd23a');
        if (on && it.val && (t >> 4) % 2 === 0) G.text('>', 210, y, '#ffd23a', { align: 'right' });
        G.text(label, 128, y, on ? '#ffd23a' : '#ffffff', { align: 'center', shadow: '#140c1c' });
      });
      G.text('BUILD STEP 4 - CO-OP, ONLINE', 128, 214, '#6a5a9a', { align: 'center' });
      G.text(window.AFK_BUILD || 'DEV', 254, 2, '#4a3e6a', { align: 'right' }); // which copy this is (tools/build.js)
    }
  }
  G.states = { Boot, Stage, Pause, MapView, LevelClear, TouchLayout };

  // Auto-pause when the tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.state && G.state.pausable) G.setState(new Pause(G.state));
  });

  // ===== Main loop: fixed 60Hz simulation, render every animation frame =====
  function drawToast(ctx) {
    if (G.toastT <= 0 || G.state.noToast || G.state.edit) return;
    const w = G.textWidth(G.toastMsg) + 14;
    G.box(G.W / 2 - w / 2, 48, w, 14);
    G.text(G.toastMsg, G.W / 2, 52, '#ffd23a', { align: 'center' });
  }
  function tick() {
    I.update();
    if (G.net) G.net.tick();
    G.state.update();
    G.tick++;
    if (G.toastT > 0) G.toastT--;
    I.endTick();
  }
  let acc = 0, last = performance.now();
  function frame(now) {
    let dt = now - last;
    last = now;
    if (dt > 250) dt = 250;
    acc += dt;
    let n = 0;
    while (acc >= G.STEP && n < 5) { tick(); acc -= G.STEP; n++; }
    if (n === 5) acc = 0;
    G.state.draw(G.ctx);
    drawToast(G.ctx);
    requestAnimationFrame(frame);
  }
  // Debug/test hook: advance n fixed ticks synchronously and render (works even when rAF is paused)
  G.step = (n = 1) => { for (let i = 0; i < n; i++) tick(); G.state.draw(G.ctx); drawToast(G.ctx); };

  G.buildArt();
  G.applyOpts();
  G.layout();
  // Shortcuts for testing: ?level=1 jumps straight into a level, ?test opens the test room
  const qs = new URLSearchParams(location.search), lv = G.LEVELS[(+qs.get('level') || 0) - 1];
  if (qs.has('debug')) G.Debug.on = true; // ?debug: start with the enemy debug overlay on (\ toggles it)
  if (qs.has('seed')) G.urlSeed = +qs.get('seed') | 0; // ?seed=123: replay the same random game every time
  G.setState(lv ? new Stage(lv) : qs.has('test') ? new Stage(G.TEST_ROOM) : qs.has('practice') ? new Stage(G.PRACTICE, qs.get('practice') || 'pixel') : qs.has('recruit') ? new G.Recruit() : new Boot()); // (?join=CODE, an online join link: lobby.js)
  requestAnimationFrame(frame);
  // ?tests: run the in-browser test suite (tools/tests.js; needs the dev server or a local copy of the repo)
  if (qs.has('tests')) {
    const sc = document.createElement('script');
    sc.src = 'tools/tests.js';
    sc.onload = () => G.runTests();
    document.body.appendChild(sc);
  }
})();
</script>
<script>
/* AFK APOCALYPSE — screens around a level: the visitor's briefing before it, the game-over screen (the attempt
   counter), and the secret Tuning Lab (Konami code or tap the logo 7 times on the title screen). */
(function () {
  'use strict';
  const G = window.G, I = G.input;
  const S = G.states;

  // A night sky with stars, shared by these screens
  const sky = (ctx, t) => {
    ['#0b0614', '#100822', '#160b30', '#1e0e3c', '#281246'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * 45, G.W, 45); });
    for (let i = 0; i < 40; i++) {
      ctx.fillStyle = (t + i * 13) % 90 < 6 ? '#ffffff' : '#5a4a8a';
      ctx.fillRect(Math.floor(G.hash(i, 7) * 256), Math.floor(G.hash(i, 3) * 140), 1, 1);
    }
  };
  // Typewriter text: the first `n` characters of `lines` (an array of strings), drawn line by line
  const typed = (lines, n, x, y, col) => {
    let left = Math.floor(n);
    lines.forEach((line, i) => {
      if (left <= 0) return;
      G.text(line.slice(0, left), x, y + i * 10, col, { shadow: '#0e124a' });
      left -= line.length + 1;
    });
  };

  // ===== The briefing: the visitor from the future explains the level, page by page =====
  // Fire / tap: finish the page, then the next page. Start / back: skip to the level.
  class Briefing {
    // carry: what the crew brings from the last level (Stage.carryOut), if any
    // remote: an online guest reading along (the host's briefing starts the level for everyone)
    constructor(def, crewId, carry, remote) {
      Object.assign(this, { def, crewId, carry, remote, menu: true, noToast: true, page: 0, chars: 0, t: 0 });
      this.pages = def.briefing || [];
    }
    get total() { const p = this.pages[this.page] || []; return p.join(' ').length; }
    update() {
      this.t++;
      if (this.chars < this.total) { this.chars = Math.min(this.total, this.chars + 0.9); if (this.t % 3 === 0) G.sfx.play('type'); }
      const m = I.menu;
      if (this.remote) { if (m.backP) { G.net.leave(); G.setState(new S.OnlineMenu()); return; } }
      else if (m.startP || m.backP) return this.go();
      if (m.confirmP || I.taps.length) {
        if (this.chars < this.total) this.chars = this.total;
        else if (++this.page >= this.pages.length) { if (this.remote) this.page = this.pages.length - 1; else this.go(); }
        else { this.chars = 0; G.sfx.play('blip'); }
      }
    }
    go() { G.sfx.play('portal'); G.setState(new G.Stage(this.def, this.crewId).carryIn(this.carry)); }
    draw(ctx) {
      const t = this.t;
      sky(ctx, t);
      ctx.fillStyle = '#12061e'; ctx.fillRect(0, 118, G.W, G.H - 118); ctx.fillStyle = '#3a1a4a'; ctx.fillRect(0, 118, G.W, 1); // the street
      const [h, mm] = this.def.time || [23, 58]; // the clock: two minutes to go
      G.text((h % 12 || 12) + ':' + String(mm).padStart(2, '0') + (h >= 12 ? ' PM' : ' AM'), G.W / 2, 10, '#ff3a5a', { align: 'center', scale: 2, shadow: '#3a0a1a' });
      G.text('LEVEL ' + this.def.num + ' - ' + this.def.name, G.W / 2, 30, '#ffd23a', { align: 'center', shadow: '#140c1c' });
      // the visitor, stepping out of a time portal, and your crew member listening
      const vx = 74, vy = 112;
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2 + t / 25;
        ctx.fillStyle = ['#ff5ab0', '#3ad0ff', '#ffd23a', '#38f0a0'][i % 4];
        ctx.fillRect(Math.round(vx + Math.cos(a) * 20), Math.round(vy - 34 + Math.sin(a) * 34), 2, 2);
      }
      const vis = G.art.people.visitor.down[(t >> 5) & 1 ? 0 : 1], team = [].concat(this.crewId);
      ctx.drawImage(vis, vx - 24, vy - 66, 48, 72);
      team.forEach((id, i) => ctx.drawImage((G.art.crew[id] || G.art.crew.pixel).left[0], 170 + i * 34 - (team.length - 1) * 14, vy - 66 + i * 4, 48, 72)); // your crew, listening
      // the dialog box
      G.box(6, 140, 244, 78);
      G.text('THE VISITOR', 14, 146, '#ff9ad0', { shadow: '#0e124a' });
      typed(this.pages[this.page] || [], this.chars, 14, 160, '#ffffff');
      if (this.chars >= this.total && (t >> 4) & 1) G.text(this.page < this.pages.length - 1 ? 'V' : 'GO!', 240, 206, '#ffd23a', { align: 'right' });
      G.text(this.remote ? 'THE HOST STARTS THE LEVEL' : 'START: SKIP', 14, 206, '#6a6aa8');
    }
  }
  S.Briefing = Briefing;

  // ===== Game over: the attempt counter, what you managed, try again or quit =====
  const QUIPS = [
    ['THE FEED WENT LIVE.', "I'LL REWIND TWO MINUTES. AGAIN."],
    ['EVERY ATTEMPT TEACHES US', 'SOMETHING. MOSTLY ABOUT TEENS.'],
    ['THAT TIMELINE IS GONE.', "THERE'S ALWAYS ANOTHER."],
    ["DON'T WORRY. I'VE SEEN", 'ATTEMPT #1. THIS WAS BETTER.'],
  ];
  class GameOver {
    constructor(st) {
      Object.assign(this, { st, menu: true, noToast: true, t: 0, sel: 0 });
      this.failed = G.save.data.attempt - 1; // the attempt that just ended (the counter already moved on)
      this.items = [
        { label: 'TRY AGAIN', act: () => G.setState(new G.Stage(st.def, st.crewId)) },
        { label: 'QUIT TO TITLE', act: () => G.setState(new S.Boot()) },
      ];
      G.save.write();
    }
    update() {
      this.t++;
      if (this.t < 40) return; // a beat before you can skip it
      G.runMenu(this, this.items, 168, 13, 70, 186);
    }
    draw(ctx) {
      const st = this.st, t = this.t;
      st.draw(ctx);
      ctx.fillStyle = 'rgba(8,4,20,.8)'; ctx.fillRect(0, 0, G.W, G.H);
      ctx.fillStyle = '#0b0614'; ctx.fillRect(0, 0, G.W, 32); // over the HUD
      G.text('GAME OVER', G.W / 2, 8, '#ff3a5a', { align: 'center', scale: 3, shadow: '#3a0a1a' });
      G.text('ATTEMPT #' + this.failed + ' FAILED', G.W / 2, 44, '#ffd23a', { align: 'center', shadow: '#140c1c' });
      G.box(40, 60, 176, 52);
      const rows = [['NEIGHBORS SAVED', st.saved, '#7ff0ff'], ['NEIGHBORS LOST', st.lost, '#ff5a6a'], ['SCORE', st.score, '#ffffff']];
      rows.forEach(([k, v, col], i) => { G.text(k, 52, 68 + i * 12, col, { shadow: '#0e124a' }); G.text(String(v), 204, 68 + i * 12, col, { align: 'right', shadow: '#0e124a' }); });
      const q = QUIPS[this.failed % QUIPS.length];
      ctx.drawImage(G.art.people.visitor.down[0], 22, 124, 24, 36);
      G.text(q[0], 52, 130, '#ff9ad0', { shadow: '#140c1c' }); G.text(q[1], 52, 140, '#ff9ad0', { shadow: '#140c1c' });
      this.items.forEach((it, i) => {
        const y = 168 + i * 13, on = i === this.sel && t >= 40;
        if (on && (t >> 4) % 2 === 0) G.text('>', 78, y, '#ffd23a');
        G.text(it.label, G.W / 2, y, on ? '#ffd23a' : '#ffffff', { align: 'center', shadow: '#140c1c' });
      });
      G.text('NEXT: ATTEMPT #' + G.save.data.attempt, G.W / 2, 204, '#6a6aa8', { align: 'center' });
    }
  }
  S.GameOver = GameOver;

  // ===== Co-op join screen: each player presses fire on their own device to claim a slot =====
  // Devices (G.input.DEVICES): the WASD half of the keyboard (+ mouse), the arrow half, each gamepad, touch. Once both
  // slots are filled it moves on to the recruit screen, where player 1 then player 2 picks a crew member.
  // G.coop = { devices: [id, id], ctrls: [Controller, Controller] } for the rest of the session (null = one player).
  class Join {
    constructor() { Object.assign(this, { menu: true, noToast: true, t: 0, slots: [], doneT: 0 }); }
    update() {
      this.t++;
      if (this.slots.length >= 2) { if (++this.doneT > 40) this.go(); return; }
      if (I.menu.backP || I.hits.Backspace) { // back: free the last slot, or leave
        G.sfx.play('pause');
        if (this.slots.length) this.slots.pop(); else { G.coop = null; G.setState(new S.Boot()); }
        return;
      }
      for (const id of I.joinPresses()) {
        if (this.slots.includes(id) || this.slots.length >= 2) continue;
        this.slots.push(id);
        G.sfx.play(this.slots.length === 2 ? 'confirm' : 'pickup');
      }
    }
    go() {
      const ctrls = this.slots.map((id) => new I.Controller(I.DEVICES[id].src));
      I.controllers.length = 0; I.controllers.push(...ctrls); // polled every tick
      G.coop = { devices: this.slots.slice(), ctrls };
      G.setState(new G.Recruit(2));
    }
    draw(ctx) {
      const t = this.t;
      sky(ctx, t);
      G.text('2 PLAYERS', G.W / 2, 14, '#ff5ab0', { align: 'center', scale: 2, shadow: '#5a0a3a' });
      G.text('EACH PLAYER: PRESS FIRE ON YOUR OWN', G.W / 2, 40, '#ffffff', { align: 'center', shadow: '#140c1c' });
      G.text('KEYBOARD HALF, GAMEPAD OR SCREEN', G.W / 2, 50, '#ffffff', { align: 'center', shadow: '#140c1c' });
      for (let i = 0; i < 2; i++) {
        const x = 12 + i * 124, y = 70, id = this.slots[i], col = i ? '#3ad0ff' : '#ff5ab0';
        G.box(x, y, 108, 70);
        G.text('PLAYER ' + (i + 1), x + 54, y + 8, col, { align: 'center', shadow: '#0e124a' });
        if (id) {
          G.text(I.DEVICES[id].name, x + 54, y + 30, '#ffffff', { align: 'center', shadow: '#0e124a' });
          G.text('READY!', x + 54, y + 48, '#38f0a0', { align: 'center', shadow: '#0e124a' });
        } else if (i === this.slots.length && (t >> 4) & 1) G.text('PRESS FIRE', x + 54, y + 34, '#ffd23a', { align: 'center', shadow: '#0e124a' });
      }
      const help = [['WASD', 'SPACE FIRE  SHIFT SKILL  F ITEM'], ['ARROWS', '/ FIRE  . SKILL  , ITEM'], ['GAMEPAD', 'A FIRE  B SKILL  X ITEM']];
      help.forEach(([k, v], i) => { G.text(k, 12, 152 + i * 11, '#ffd23a'); G.text(v, 58, 152 + i * 11, '#c8c0e0'); });
      G.text('ESC / BACKSPACE: BACK', G.W / 2, 208, '#6a6aa8', { align: 'center' });
    }
  }
  S.Join = Join;

  // ===== The secret Tuning Lab: every weapon and item number (G.TUNABLES), saved =====
  // Up/down: pick a row. Left/right (or tap the left/right half of a row): change it. Back / start: leave.
  class TuningLab {
    constructor() {
      Object.assign(this, { menu: true, noToast: true, t: 0, sel: 0, top: 0 });
      this.rows = [];
      let group = null;
      for (const tu of G.TUNABLES) { if (tu.group !== group) { group = tu.group; this.rows.push({ head: group }); } this.rows.push({ tu }); }
      this.rows.push({ reset: true }, { back: true });
      this.sel = 1;
    }
    move(d) {
      do { this.sel = (this.sel + d + this.rows.length) % this.rows.length; } while (this.rows[this.sel].head);
      G.sfx.play('blip');
    }
    act(d) {
      const r = this.rows[this.sel];
      if (r.tu) { G.setTune(r.tu, r.tu.o[r.tu.k] + d * r.tu.step); G.sfx.play('blip'); }
      else if (r.reset && d > 0) { G.resetTuning(); G.toast('ALL BACK TO NORMAL', 90); G.sfx.play('confirm'); }
      else if (r.back && d > 0) this.leave();
    }
    leave() { G.sfx.play('pause'); G.setState(new S.Boot()); }
    update() {
      this.t++;
      const m = I.menu;
      if (m.backP || m.startP) return this.leave();
      if (m.upP) this.move(-1);
      if (m.downP) this.move(1);
      if (m.leftP) this.act(-1);
      if (m.rightP || m.confirmP) this.act(1);
      for (const tp of I.taps) { // tap a row: left half lowers it, right half raises it
        const i = this.top + Math.floor((tp.y - 33) / 10);
        if (tp.y < 33 || i < 0 || i >= this.rows.length || this.rows[i].head) continue;
        this.sel = i; this.act(tp.x < G.W / 2 ? -1 : 1);
      }
      const VIS = 17; // keep the selected row in view
      if (this.sel < this.top + 1) this.top = Math.max(0, this.sel - 1);
      if (this.sel > this.top + VIS - 2) this.top = Math.min(this.rows.length - VIS, this.sel - VIS + 2);
    }
    draw(ctx) {
      ctx.fillStyle = '#0b0614'; ctx.fillRect(0, 0, G.W, G.H);
      G.text('TUNING LAB', G.W / 2, 6, '#38f0a0', { align: 'center', scale: 2, shadow: '#0a3a20' });
      G.text('SECRET SETTINGS - SAVED ON THIS DEVICE', G.W / 2, 23, '#4a8a6a', { align: 'center' });
      for (let k = 0; k < 17; k++) {
        const i = this.top + k, r = this.rows[i];
        if (!r) break;
        const y = 35 + k * 10, on = i === this.sel;
        if (on) { ctx.fillStyle = 'rgba(56,240,160,.15)'; ctx.fillRect(4, y - 2, G.W - 8, 10); }
        if (r.head) { G.text(r.head, 8, y, '#ffd23a'); continue; }
        if (r.reset) { G.text('RESET EVERYTHING', 16, y, on ? '#ff3a5a' : '#c86a7a'); continue; }
        if (r.back) { G.text('BACK', 16, y, on ? '#ffffff' : '#9a8ec0'); continue; }
        const tu = r.tu, v = tu.o[tu.k], changed = v !== tu.def;
        G.text(tu.label, 16, y, on ? '#ffffff' : '#9a8ec0');
        const shown = (Math.round(v * 100) / 100) + (tu.note ? ' ' + tu.note(v) : '');
        G.text((on ? '< ' : '') + shown + (on ? ' >' : ''), G.W - 10, y, changed ? '#38f0a0' : on ? '#ffffff' : '#c8c0e0', { align: 'right' });
      }
      G.text('ARROWS CHANGE - ESC LEAVES', G.W / 2, G.H - 10, '#4a4a7a', { align: 'center' });
    }
  }
  S.TuningLab = TuningLab;
})();

<script>
/* AFK APOCALYPSE — online co-op, up to 4 players (docs/engine/netplay.md).
   One player HOSTS: their browser runs the real game. Up to 3 GUESTS send their controller input every tick and
   draw what the host sends back (netsync.js: delta snapshots against what each guest last confirmed).

   Getting connected:
   - Signaling (how two browsers find each other), by where the page runs:
       claude.ai artifact  -> the page's `room` capability (a named room per game code)
       anywhere else       -> the free PeerJS cloud server (a websocket; we speak its small protocol ourselves)
       ?net=local          -> a BroadcastChannel between tabs of one browser (tests)
   - Then a WebRTC data channel per guest (direct, low latency). If that can't connect in time and we're in a
     claude.ai room, game messages go through the room instead (slower, chunked, rate-limited: "relay").

   Messages (JSON, field t):
     guest -> host  hello · pick {crew} · in {a: snapshot ack, q: inputs} · bye
     host -> guest  welcome {num, taken, phase} · picked {ok, crew} · lobby {slots, phase} · state {s, ...} ·
                    snap {id, base, d, ev, ack} · bye */
(function () {
  'use strict';
  const G = window.G, I = G.input;
  const MAX_PLAYERS = 4;
  const ICE = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  const RTC_WAIT = 9000; // ms to wait for the direct connection before falling back to the relay
  const qs = new URLSearchParams(location.search);
  const HAS_RTC = !!window.RTCPeerConnection && qs.get('rtc') !== 'off'; // some in-app browsers (the Claude iOS app) have none
  G.PCOLS = ['#ff5ab0', '#3ad0ff', '#ffd23a', '#38f0a0']; // player 1-4 colors (tags over heads, lobby, HUD)

  const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I or O (they look like 1 and 0)
  const rnd = (n, set = LETTERS) => { const a = new Uint32Array(n); crypto.getRandomValues(a); return [...a].map((v) => set[v % set.length]).join(''); };

  // ===== Signaling: { ready: Promise, send(to, msg), on(from, msg), close(), room? } =====
  // ?net=local-relay also fakes the claude.ai room's relay (tests the slow path)
  function localSignal(code, me) {
    const bc = new BroadcastChannel('afk-sig-' + code), s = { on: null, kind: 'local' };
    bc.onmessage = (e) => { const d = e.data; if (d && d.to === me && s.on) s.on(d.from, d.m); };
    s.send = (to, m) => bc.postMessage({ to, from: me, m });
    const rc = new BroadcastChannel('afk-relay-' + code);
    s.relayOn = null; s.forceRelay = qs.get('net') === 'local-relay';
    rc.onmessage = (e) => { const d = e.data; if (d && d.to === me && s.relayOn) s.relayOn(d.from, d); };
    s.relay = (to, d) => rc.postMessage({ ...d, to, from: me });
    s.close = () => { bc.close(); rc.close(); };

    return s;
  }
  // PeerJS cloud server protocol: connect with an id, then OFFER / ANSWER / CANDIDATE messages are relayed to `dst`
  // with our payload untouched; HEARTBEAT every 5 s keeps the socket alive.
  function peerjsSignal(code, me) {
    const pre = 'afkapoc-' + code.toLowerCase() + '-', s = { on: null, kind: 'peerjs' };
    const ws = new WebSocket('wss://0.peerjs.com/peerjs?key=peerjs&id=' + pre + me + '&token=' + rnd(10, 'abcdefghijkmnpqrstuvwxyz23456789') + '&version=1.5.4');
    let hb = 0;
    s.ready = new Promise((ok, fail) => {
      const t = setTimeout(() => fail(new Error('NO ANSWER FROM THE SERVER')), 12000);
      ws.onmessage = (e) => {
        let d; try { d = JSON.parse(e.data); } catch (_) { return; }
        if (d.type === 'OPEN') { clearTimeout(t); ok(); }
        else if (d.type === 'ID-TAKEN') fail(new Error('GAME CODE IN USE'));
        else if (d.type === 'ERROR') fail(new Error('SERVER ERROR'));
        else if (d.src && d.src.startsWith(pre) && d.payload && d.payload.k === 'g') { if (s.relayOn) s.relayOn(d.src.slice(pre.length), d.payload.d); } // relayed game message
        else if (d.src && d.src.startsWith(pre) && s.on) s.on(d.src.slice(pre.length), d.type === 'LEAVE' || d.type === 'EXPIRE' ? { k: 'gone' } : d.payload);
      };
      ws.onerror = () => fail(new Error('NO CONNECTION'));
      ws.onclose = () => { clearInterval(hb); fail(new Error('CONNECTION CLOSED')); };
    });

    s.send = (to, m) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: TYPE[m.k] || 'OFFER', payload: m, dst: pre + to })); };
    s.relayOn = null;
    s.relay = (to, d) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'OFFER', payload: { k: 'g', d }, dst: pre + to })); }; // game messages through the server

  }
  // claude.ai's room capability: everyone in the named room "afk-<code>" hears every emit; messages say who they're for
  async function roomSignal(room, code, me) {
    const r = await room.join('afk-' + code.toLowerCase());
    const s = { on: null, kind: 'room', room: r, relayOn: null };
    r.on('sig', (msg) => { const d = msg.data; if (d && d.to === me && s.on) s.on(d.from, d.m); });
    r.on('g', (msg) => { const d = msg.data; if (d && d.to === me && s.relayOn) s.relayOn(d.from, d); });

  const roomP = /^local/.test(qs.get('net') || '') || !(window.claude && window.claude.use) ? Promise.resolve(null)
    : Promise.race([window.claude.use('room').catch(() => null), new Promise((ok) => setTimeout(() => ok(null), 4000))]);

  // ===== Links: one connection to one other player. send(obj), close(); calls onMsg(link, obj), onClose(link) =====
  function rtcLink(sig, peer, initiator, H) {
    const pc = new RTCPeerConnection({ iceServers: ICE }), pend = [];
    const L = { peer, pc, ch: null, open: false, relay: false, closed: false };
    L.send = (o) => { if (L.ch && L.ch.readyState === 'open') try { L.ch.send(JSON.stringify(o)); } catch (_) { /* full */ } };

    const wire = (ch) => {
      L.ch = ch;
      ch.onopen = () => { L.open = true; H.open(L); };
      ch.onmessage = (e) => { let o; try { o = JSON.parse(e.data); } catch (_) { return; } H.msg(L, o); };
      ch.onclose = () => { if (L.open) H.close(L); };

    pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed' && L.open) H.close(L); };
    const flush = () => { while (pend.length) pc.addIceCandidate(pend.shift()).catch(() => {}); };
    L.signal = async (m) => {
      try {
        if (m.k === 'offer') {
          await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
          await pc.setLocalDescription(await pc.createAnswer());
          sig.send(peer, { k: 'answer', sdp: pc.localDescription.sdp }); flush();
        } else if (m.k === 'answer') { await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }); flush(); }
        else if (m.k === 'cand') { if (pc.remoteDescription) pc.addIceCandidate(m.c).catch(() => {}); else pend.push(m.c); }
      } catch (_) { /* a bad offer: the guest times out and tries the relay */ }
    };

      wire(pc.createDataChannel('game'));
      pc.createOffer().then((o) => pc.setLocalDescription(o)).then(() => sig.send(peer, { k: 'offer', sdp: pc.localDescription.sdp })).catch(() => {});
    } else pc.ondatachannel = (e) => wire(e.channel);

  }
  // Through the signaling route itself (the claude.ai room's topic 'g', or the PeerJS server), for when there's no
  // direct link: messages over ~3.4 KB are cut into chunks; at most ~25 sends a second
  function relayLink(sig, me, peer, H) {
    const L = { peer, open: true, relay: true, closed: false, q: [], parts: new Map(), seq: 0 };
    let budget = 25, last = performance.now();
    L.send = (o) => {
      const s = JSON.stringify(o), id = ++L.seq, n = Math.ceil(s.length / 3400) || 1;
      if (L.q.length > 60) L.q.splice(0, L.q.length - 40); // falling behind: drop the oldest (snapshots are acked)
      for (let i = 0; i < n; i++) L.q.push({ i: id, c: i, n, s: s.slice(i * 3400, (i + 1) * 3400) });
    };

      const now = performance.now();
      budget = Math.min(25, budget + ((now - last) / 1000) * 25); last = now;
      while (L.q.length && budget >= 1) { budget--; sig.relay(peer, L.q.shift()); }
    };
    L.flush = () => { while (L.q.length) sig.relay(peer, L.q.shift()); }; // last words (bye) go now
    L.recv = (d) => {
      if (d.n === 1) { try { H.msg(L, JSON.parse(d.s)); } catch (_) { /* torn */ } return; }
      const p = L.parts.get(d.i) || []; p[d.c] = d.s; L.parts.set(d.i, p);
      if (p.filter((x) => x !== undefined).length === d.n) { L.parts.delete(d.i); try { H.msg(L, JSON.parse(p.join(''))); } catch (_) { /* torn */ } }
      if (L.parts.size > 20) L.parts.delete(L.parts.keys().next().value);

  }

  // ===== Remote controller: a guest's input, fed by 'in' packets, read by their Player like any other controller =====
  const BITS = ['fire', 'skill', 'item', 'wnext', 'wprev', 'inext'];
  const blank = () => ({ mx: 0, my: 0, ax: 0, ay: 0, fire: false, skill: false, item: false, start: false, wnext: false, wprev: false, inext: false, mouseAim: false });
  class RemoteController {
    // seq: the newest input received; done: the newest one played (what the host's snapshots confirm)
    constructor() { this.s = blank(); this.q = []; this.held = null; this.seq = 0; this.done = 0; this.src = {}; }
    feed(list) { for (const x of list) if (x[0] > this.seq) { this.seq = x[0]; this.q.push(x); } }
    poll() {
      let edges = 0, x = this.q.shift();
      while (x && this.q.length > 8) { edges |= x[6]; x = this.q.shift(); } // far behind: catch up, keep the presses
      if (x) { edges |= x[6]; this.held = x; this.done = x[0]; }
      const h = this.held, n = blank();
      if (h) {
        n.mx = h[1]; n.my = h[2]; n.ax = h[3]; n.ay = h[4]; n.mouseAim = !!h[7];

      }
      n.startP = false;
      this.s = n;
    }
  }

  // ===== The session =====
  const N = (G.net = {
    role: null,   // 'host' | 'guest' | null
    code: '', sigKind: '', err: '', status: '',
    slots: [],    // host: index = num - 1: { num, crew, peer, link, ctrl, local } (null = free)
    kept: {},     // host: crew id -> what they had when they dropped out (lives, weapons, items)
    games: [],    // open games seen in the claude.ai room's lobby (presence)
    get active() { return !!N.role; },
    taken() { return N.slots.filter((s) => s && s.crew).map((s) => s.crew); },
    lobbyView() { return N.slots.map((s) => (s ? { num: s.num, crew: s.crew || null } : null)); },
  });

  // Signaling for a game code (the kind depends on where this page runs)
  // Both routes at once where both work: a signed-in claude.ai viewer (room) and someone on a public link or a
  // copy of the file (PeerJS) can still find each other. Each message goes back the way its sender came.
  async function openSignal(code, me) {
    if (/^local/.test(qs.get('net') || '')) return localSignal(code, me);
    const list = [], room = await roomP;
    if (room) { try { list.push(await roomSignal(room, code, me)); N.room = room; } catch (_) { /* not let into the room (a public link) */ } }
    if (window.WebSocket) {
      let p = null;
      try { p = peerjsSignal(code, me); await p.ready; list.push(p); } // (a page that may not open sockets throws right away)
      catch (e) { if (p) p.close(); if (e.message === 'GAME CODE IN USE' || !list.length) { list.forEach((x) => x.close()); throw e.message ? e : new Error('NO CONNECTION'); } }
    }
    if (!list.length) throw new Error("THIS BROWSER CAN'T PLAY ONLINE");
    if (list.length === 1) return list[0];
    const via = new Map(), s = { on: null, relayOn: null, kind: list.map((x) => x.kind).join('+'), room: list.find((x) => x.room).room, ready: Promise.resolve() };
    for (const x of list) {
      x.on = (from, m) => { via.set(from, x); if (s.on) s.on(from, m); };
      x.relayOn = (from, d) => { via.set(from, x); if (s.relayOn) s.relayOn(from, d); };
    }
    s.send = (to, m) => { const x = via.get(to); if (x) x.send(to, m); else list.forEach((y) => y.send(to, m)); }; // not heard from yet: try both
    s.relay = (to, d) => { const x = via.get(to); if (x) x.relay(to, d); else list.forEach((y) => y.relay(to, d)); };
    s.close = () => list.forEach((x) => x.close());
    return s;
  }

  // ---- Hosting ----
  N.host = async (crew) => {
    N.leave(true);
    N.role = 'host'; N.status = 'STARTING...'; N.err = '';
    N.slots = [{ num: 1, crew, local: true, ctrl: I.solo }, null, null, null];
    for (let tries = 0; tries < 4; tries++) {
      N.code = qs.get('code') || rnd(4);
      try {
        N.sig = await openSignal(N.code, 'host');
        await N.sig.ready;
        break;
      } catch (e) { N.err = e.message; if (N.sig) N.sig.close(); N.sig = null; if (e.message !== 'GAME CODE IN USE') break; }
    }
    if (!N.sig) { N.role = null; G.toast(N.err || 'COULD NOT HOST', 180); return false; }
    N.sigKind = N.sig.kind; N.status = '';
    N.links = new Map(); // peer -> link
    N.sig.on = (from, m) => {
      if (N.role !== 'host') return;
      if (m.k === 'gone') { const L = N.links.get(from); if (L) hostClose(L); return; }
      let L = N.links.get(from);
      if (m.k === 'offer' && !HAS_RTC) { N.sig.send(from, { k: 'relay' }); return; } // no direct links here: tell them to relay
      if (m.k === 'offer' && (!L || L.relay)) { L = rtcLink(N.sig, from, false, HOST); N.links.set(from, L); }
      if (L && L.signal) L.signal(m);
    };
    N.sig.relayOn = (from, d) => {
      if (N.role !== 'host') return;
      let L = N.links.get(from);

  };

    N.room.presence({ afk: { code: N.code, n, max: MAX_PLAYERS, phase: N.phase || 'lobby' } }).catch(() => {});
  }
  const slotOf = (L) => N.slots.find((s) => s && s.link === L);
  const HOST = {
    open() { /* wait for hello */ },
    msg(L, o) {
      if (N.role !== 'host') return;
      const heard = slotOf(L); if (heard) heard.heard = performance.now();
      if (o.t === 'hello') {
        let s = slotOf(L);
        if (!s) {
          const i = N.slots.findIndex((x) => !x);
          if (i < 0) { L.send({ t: 'bye', why: 'GAME IS FULL' }); return; }
          s = N.slots[i] = { num: i + 1, crew: null, peer: L.peer, link: L, ctrl: new RemoteController(), ack: 0, ev: [], heard: performance.now() };

    if (!s) return;
    N.slots[s.num - 1] = null;

    for (let k = 0; k < offs.length; k++) {
      const [dx, dy] = offs[(k + i - 1) % offs.length];
      if (!st.room.boxHits(x + dx, y + dy, p.hw, p.hh, p)) { p.x = x + dx; p.y = y + dy; return; }
    }
  }
  function joinMidGame(s) {
    const st = N.stage, near = st.players.find((q) => q.local && !q.dead) || st.players.find((q) => !q.dead) || st.players[0];
    if (st.players.some((q) => q.num === s.num)) return;
    const p = new G.Player(G.CREW[s.crew], s.ctrl, near ? near.x : st.room.pw / 2, near ? near.y : st.room.ph / 2);
    p.num = s.num; p.coop = true; p.inv = 120;
    const k = N.kept[s.crew];
    if (k) { p.lives = k.lives; p.weapons = k.weapons; p.items = k.items; p.hp = Math.max(2, k.hp); delete N.kept[s.crew]; }
    if (near) placeNear(st, p, near.x, near.y, st.players.length);
    st.players.push(p);
    if (!I.controllers.includes(s.ctrl)) I.controllers.push(s.ctrl);
    s.ack = 0; s.ackMin = N.snapId || 0; s.ev = [];
    s.link.send(playMsg(st));
    G.toast(G.CREW[s.crew].name + ' JOINED', 150);
  }
  const playMsg = (st) => ({ t: 'state', s: 'play', level: G.LEVELS.indexOf(st.def), seed: st.seed });

  // The host follows its own screens and tells the guests (wrapped G.setState)
  const setState0 = G.setState;
  G.setState = (s) => {
    const prev = G.state;
    setState0(s);
    if (N.role !== 'host') return;
    const S = G.states;
    if (s instanceof G.Stage && !s.test) {
