    const c = I.solo.s, me = st.me;
    let ax = c.ax, ay = c.ay, mouse = 0;
    if (me && Math.hypot(ax, ay) <= 0.3) { const m = me.mouseAim(st); if (m) { ax = m.x; ay = m.y; mouse = 1; } }
    let held = 0, edges = 0;
    ['fire', 'skill', 'item', 'wnext', 'wprev', 'inext'].forEach((b, i) => { if (c[b]) held |= 1 << i; if (c[b + 'P']) edges |= 1 << i; });
    const seq = (N.inSeq = (N.inSeq || 0) + 1);
    N.inQ = N.inQ || [];
    N.inQ.push([seq, r2(c.mx), r2(c.my), r2(ax), r2(ay), held, edges, mouse]);
    N.inQ = N.inQ.filter((x) => x[0] > (st.ackSeq || 0)).slice(-10); // resend what the host hasn't confirmed
    if (N.link && N.link.relay && st.t % 4) return; // the room relay: four ticks at a time
    N.send({ t: 'in', a: N.lastSnap || 0, q: N.inQ });
  }
})();
</script>
<script>
/* AFK APOCALYPSE — the online screens (net.js connects, netsync.js replicates):
   OnlineMenu (host or join) -> host: pick a crew member, then the Lobby (game code, who's in, START)
                             -> join: JoinCode (type the code, or pick an open game in this claude.ai room), pick a
                                crew member nobody has, then the Lobby until the host starts (or straight into the
                                level if it's already going)
   NetWait: a guest's screen while the host is on a level-clear, game-over or other screen. */
(function () {
  'use strict';
  const G = window.G, I = G.input, N = G.net, S = G.states;
  const sky = (ctx, t) => {
    ['#0b0614', '#100822', '#160b30', '#1e0e3c', '#281246'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * 45, G.W, 45); });
    for (let i = 0; i < 40; i++) { ctx.fillStyle = (t + i * 13) % 90 < 6 ? '#ffffff' : '#5a4a8a'; ctx.fillRect(Math.floor(G.hash(i, 7) * 256), Math.floor(G.hash(i, 3) * 140), 1, 1); }
  };
  const center = (s, y, col, o = {}) => G.text(s, G.W / 2, y, col, { align: 'center', shadow: '#140c1c', ...o });

  // ===== Host or join =====
  class OnlineMenu {
    constructor() {
      Object.assign(this, { menu: true, noToast: false, t: 0, sel: 0 });
      this.items = [
        { label: 'HOST A GAME', act: () => G.setState(new G.Recruit(1, { online: true, taken: [], onPick: (crew) => hostWith(crew), onBack: () => G.setState(new OnlineMenu()) })) },
        { label: 'JOIN A GAME', act: () => G.setState(new JoinCode()) },
        { label: 'BACK', act: () => G.setState(new S.Boot()) },
      ];
      N.hasRoom().then((r) => { this.room = r; });
      N.routes().then((r) => { this.routes = r; });
    }
    update() { this.t++; if (I.menu.backP) { G.setState(new S.Boot()); return; } G.runMenu(this, this.items, 104, 14, 50, 206); }
    draw(ctx) {
      sky(ctx, this.t);
      center('ONLINE', 14, '#3ad0ff', { scale: 2, shadow: '#0a2a5a' });
      center('UP TO 4 PLAYERS, EACH ON THEIR OWN SCREEN', 40, '#ffffff');
      center('ONE OF YOU HOSTS: THEIR GAME RUNS IT ALL', 52, '#c8c0e0');
      center(this.room ? 'FRIENDS NEED THIS PAGE OPEN, SHARED WITH' : 'FRIENDS NEED THIS GAME OPEN AND YOUR CODE', 70, '#9a8ec0');
      center(this.room ? 'THEM AS CONTRIBUTOR OR EDITOR' : '(OR THE JOIN LINK)', 80, '#9a8ec0');
      if (this.routes) { const R = this.routes, yn = (v) => (v ? 'YES' : 'NO'); center('THIS DEVICE: DIRECT ' + yn(R.direct) + '  SERVER ' + yn(R.server) + '  ROOM ' + yn(R.room), 160, '#4a4a7a'); }
      G.box(50, 96, 156, this.items.length * 14 + 12);
      this.items.forEach((it, i) => {
        const y = 104 + i * 14, on = i === this.sel;
        if (on && (this.t >> 4) % 2 === 0) G.text('>', 60, y, '#ffd23a');
        center(it.label, y, on ? '#ffd23a' : '#ffffff', { shadow: '#0e124a' });
      });
    }
  }
  S.OnlineMenu = OnlineMenu;

  async function hostWith(crew) {
    const lobby = new Lobby();
    G.setState(lobby);
    if (!(await N.host(crew))) G.setState(new OnlineMenu());
  }

  // ===== Join: type the 4-letter code (keyboard, or the letter grid by stick / tap), or pick a game in this room =====
  const LET = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  class JoinCode {
    constructor(code = '') {
      Object.assign(this, { menu: true, t: 0, code: code.toUpperCase().slice(0, 4), sel: 0, busy: false, err: '' });
      this.keys = [...LET, 'DEL', 'GO'];
      N.watchGames().then((r) => { this.room = r; });
      if (this.code.length === 4) this.go();
    }
    async go() {
      if (this.code.length < 4 || this.busy) { G.sfx.play('deny'); return; }
      this.busy = true; this.err = ''; G.sfx.play('confirm');
      N.onWelcome = (o) => pickCrew(o.taken);
      if (!(await N.join(this.code))) { this.busy = false; this.err = N.err || 'COULD NOT CONNECT'; G.sfx.play('deny'); }
    }
    press(k) {
      if (k === 'DEL') { this.code = this.code.slice(0, -1); G.sfx.play('blip'); }
      else if (k === 'GO') this.go();
      else if (this.code.length < 4) { this.code += k; G.sfx.play('blip'); }
    }
    update() {
      this.t++;
      if (this.busy) { if (!N.role && N.err) { this.busy = false; this.err = N.err; } if (I.menu.backP) { N.leave(); this.busy = false; } return; }
      if (I.menu.backP || I.hits.Escape) { G.setState(new OnlineMenu()); return; }
      for (const k in I.hits) { // typing
        if (!I.hits[k]) continue;
        if (/^Key[A-Z]$/.test(k) && LET.includes(k[3]) && this.code.length < 4) this.press(k[3]);
        else if (k === 'Backspace') this.press('DEL');
        else if (k === 'Enter') this.press('GO');
      }
      const m = I.menu, n = this.keys.length, cols = 7;
      if (m.leftP) this.sel = (this.sel + n - 1) % n;
      if (m.rightP) this.sel = (this.sel + 1) % n;
      if (m.upP) this.sel = (this.sel + n - cols) % n;
      if (m.downP) this.sel = (this.sel + cols) % n;
      if ((m.confirmP && !I.hits.Enter) || (I.pads.some((p) => p && p.confirm) && m.confirmP)) this.press(this.keys[this.sel]);
      for (const tp of I.taps) {
        const games = this.games();
        const gi = Math.floor((tp.y - 150) / 12);
        if (tp.y >= 150 && gi < games.length) { this.code = games[gi].code; this.go(); return; }
        const cx = Math.floor((tp.x - 30) / 28), cy = Math.floor((tp.y - 70) / 16), i = cy * cols + cx;
        if (tp.x >= 30 && cx < cols && cy >= 0 && i < n) { this.sel = i; this.press(this.keys[i]); }
      }
      if (this.room) { const g = this.games(); for (let i = 0; i < g.length; i++) if (I.hits['Digit' + (i + 1)]) { this.code = g[i].code; this.go(); } }
    }
    games() { return (N.games || []).slice(0, 5); }
    draw(ctx) {
      const t = this.t;
      sky(ctx, t);
      center('JOIN A GAME', 6, '#3ad0ff', { scale: 2, shadow: '#0a2a5a' });
      center("THE HOST'S GAME CODE:", 28, '#c8c0e0');
      for (let i = 0; i < 4; i++) {
        const x = 96 + i * 18;
        G.box(x, 38, 16, 22);
        if (this.code[i]) G.text(this.code[i], x + 8, 43, '#ffd23a', { align: 'center', scale: 2 });
        else if (i === this.code.length && (t >> 4) & 1) { ctx.fillStyle = '#ffd23a'; ctx.fillRect(x + 4, 54, 8, 2); }
      }
      if (this.busy) {
        center(N.status || 'CONNECTING...', 90, '#ffd23a');
        center(/peerjs/.test(N.sigKind) && /room/.test(N.sigKind) ? 'THROUGH CLAUDE AND THE PEERJS SERVER' : N.sigKind === 'room' ? 'THROUGH CLAUDE' : N.sigKind === 'peerjs' ? 'THROUGH THE PEERJS SERVER' : '', 104, '#6a6aa8');
        center('ESC: CANCEL', 206, '#6a6aa8');
        return;
      }
      this.keys.forEach((k, i) => {
        const x = 30 + (i % 7) * 28, y = 70 + Math.floor(i / 7) * 16, on = i === this.sel;
        ctx.fillStyle = on ? '#ffd23a' : '#2a2048'; ctx.fillRect(x, y, 26, 14);
        ctx.fillStyle = on ? '#3a2a10' : '#140c28'; ctx.fillRect(x + 1, y + 1, 24, 12);
        G.text(k, x + 13, y + 4, on ? '#ffd23a' : '#ffffff', { align: 'center' });
      });
      const games = this.games();
      if (games.length) {
        G.text('OPEN GAMES HERE (TAP, OR PRESS 1-' + games.length + '):', 12, 140, '#38f0a0');
        games.forEach((g, i) => G.text((i + 1) + '  ' + g.code + '  ' + g.n + '/' + (g.max || 4) + ' PLAYERS' + (g.phase === 'play' ? ' - PLAYING' : ''), 20, 152 + i * 12, '#ffffff'));
      } else if (this.room) center('NO OPEN GAMES ON THIS PAGE YET', 150, '#6a6aa8');
      if (this.err) center(this.err, 196, '#ff3a5a');
      center('TYPE IT OR PICK LETTERS - ESC: BACK', 210, '#6a6aa8');
    }
  }
  S.JoinCode = JoinCode;

  // Connected: pick a crew member nobody else has, then wait in the lobby (or jump into the level in progress)
  function pickCrew(taken) {
    G.setState(new G.Recruit(1, {
      online: true, taken,
      onPick: (crew) => {
        N.onPicked = (o) => {
          if (!o.ok) { G.toast('SOMEONE JUST PICKED THEM', 120); pickCrew(o.taken); return; }
          if (!(G.state instanceof S.Stage)) G.setState(new Lobby());
        };
        N.send({ t: 'pick', crew });
        G.setState(new Lobby());
      },
      onBack: () => { N.leave(); G.setState(new OnlineMenu()); },
    }));
  }

  // ===== The lobby: the code, who's in, and (host) START =====
  class Lobby {
    constructor() { Object.assign(this, { menu: true, noToast: true, t: 0, copied: 0 }); }
    update() {
      this.t++;
      if (this.copied > 0) this.copied--;
      if (I.menu.backP) { G.sfx.play('pause'); N.leave(); G.setState(new OnlineMenu()); return; }
      if (N.role === 'host' && N.code && (I.menu.confirmP || I.menu.startP || I.taps.some((tp) => tp.y > 176))) { // START
        const L = G.LEVELS[0];
        G.sfx.play('confirm');
        G.setState(L.briefing ? new S.Briefing(L, N.taken()) : new S.Stage(L, N.taken()));
        return;
      }
      if (N.role === 'host' && N.code && (I.hits.KeyC || I.taps.some((tp) => tp.y > 40 && tp.y < 80))) this.copy();
      if (!N.role && N.err) G.setState(new OnlineMenu());
    }
    copy() {
      const text = N.sigKind === 'peerjs' ? N.joinLink() : N.code; // (on claude.ai the page's own address isn't a join link)
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { this.copied = 90; }).catch(() => {});
    }
    draw(ctx) {
      const t = this.t, host = N.role === 'host';
      sky(ctx, t);
      center(host ? 'YOUR GAME' : 'JOINED', 6, '#3ad0ff', { scale: 2, shadow: '#0a2a5a' });
      if (!N.code || (host && N.status)) { center(N.status || 'STARTING...', 60, '#ffd23a'); return; }
      center('GAME CODE', 30, '#c8c0e0');
      G.text(N.code, G.W / 2, 42, '#ffd23a', { align: 'center', scale: 3, shadow: '#3a2a10' });
      if (host) {
        const how = N.sigKind === 'room' ? 'FRIENDS: OPEN THIS PAGE, ONLINE > JOIN' : /peerjs/.test(N.sigKind) ? 'FRIENDS: ONLINE > JOIN, TYPE THE CODE' : 'TEST MODE (THIS BROWSER ONLY)';
        center(how, 68, '#9a8ec0');
        if (N.sigKind === 'peerjs') center(this.copied ? 'JOIN LINK COPIED!' : 'C / TAP THE CODE: COPY A JOIN LINK', 78, this.copied ? '#38f0a0' : '#6a6aa8');
      }
      const slots = host ? N.lobbyView() : (N.lobby && N.lobby.slots) || [];
      for (let i = 0; i < 4; i++) {
        const s = slots[i], x = 8 + i * 61, y = 92;
        G.box(x, y, 58, 74);
        G.text('P' + (i + 1), x + 29, y + 5, G.PCOLS[i], { align: 'center', shadow: '#0e124a' });
        if (s && s.crew) {
          ctx.drawImage(G.art.crew[s.crew].down[(t >> 4) & 1 ? 0 : 1], x + 13, y + 14, 32, 48);
          G.text(G.CREW[s.crew].short || G.CREW[s.crew].name, x + 29, y + 63, '#ffffff', { align: 'center', shadow: '#0e124a' });
        } else G.text(s ? 'PICKING' : 'OPEN', x + 29, y + 36, s ? '#ffd23a' : '#4a4a7a', { align: 'center', shadow: '#0e124a' });
        if (!host && i + 1 === N.myNum) G.text('YOU', x + 29, y + 50, '#38f0a0', { align: 'center', shadow: '#0e124a' });
      }
      if (host) {
        if ((t >> 4) & 1) center('FIRE / TAP HERE: START', 182, '#ffd23a');
        center('PLAYERS CAN ALSO JOIN AFTER YOU START', 196, '#6a6aa8');
      } else center(N.phase && N.phase !== 'lobby' ? 'THE GAME IS ON: JOINING...' : 'WAITING FOR THE HOST TO START', 186, '#ffd23a');
      center('ESC: LEAVE', 210, '#6a6aa8');
    }
  }
  S.Lobby = Lobby;

  // ===== A guest waiting on the host's screen (level clear, game over, picking...) =====
  class NetWait {
    constructor(o) { Object.assign(this, { o, menu: true, noToast: false, t: 0 }); }
    update() { this.t++; if (I.menu.backP) { N.leave(); G.setState(new OnlineMenu()); } }
    draw(ctx) {
      const o = this.o, t = this.t;
      sky(ctx, t);
      const title = o.s === 'clear' ? 'LEVEL CLEAR!' : o.s === 'over' ? 'GAME OVER' : 'HANG ON';
      center(title, 30, o.s === 'over' ? '#ff3a5a' : '#ffd23a', { scale: 2 });
      if (o.s === 'clear' || o.s === 'over') {
        G.box(40, 60, 176, 52);
        [['NEIGHBORS SAVED', o.saved, '#7ff0ff'], ['NEIGHBORS LOST', o.lost, '#ff5a6a'], ['SCORE', o.score, '#ffffff']].forEach(([k, v, col], i) => {
          G.text(k, 52, 68 + i * 12, col, { shadow: '#0e124a' }); G.text(String(v), 204, 68 + i * 12, col, { align: 'right', shadow: '#0e124a' });
        });
        if (o.s === 'clear' && o.next) center('NEXT: ' + o.next, 124, '#ff9ad0');
      }
      if ((t >> 4) & 1) center('WAITING FOR THE HOST...', 150, '#ffd23a');
      center('ESC: LEAVE THE GAME', 206, '#6a6aa8');
    }
  }
  S.NetWait = NetWait;

  // ?join=CODE (the host's join link): straight to joining that game
  const join = new URLSearchParams(location.search).get('join');
  if (join && G.state instanceof S.Boot) G.setState(new JoinCode(join));
})();
</script>
