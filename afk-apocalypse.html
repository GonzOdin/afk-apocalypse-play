<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>AFK Apocalypse</title>
<style>
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0b0614;
  overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: absolute; left: 0; top: 0; width: 256px; height: 224px; }
#screen {
  display: block; width: 100%; height: 100%;
  image-rendering: crisp-edges; image-rendering: pixelated;
}
#scan {
  position: absolute; inset: 0; pointer-events: none; display: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,.24) 50%);
  background-size: 100% var(--px, 3px);
}
body.scan #scan { display: block; }

/* ---- touch controls: a handheld, in the spirit of an old color handheld (our own design, no one's logo) ---- */
#touch { position: fixed; inset: 0; display: none; z-index: 10; touch-action: none; }
body.touch #touch { display: block; }
#stage { z-index: 1; }
/* the plastic shell behind everything, the dark bezel round the screen with its power light, the wordmark, a speaker */
/* The case color comes from G.CASES (gfx.js, CASE in the pause menu) as CSS variables. A see-through case
   (body.clearcase) has see-through colors and a circuit board (--shell-pcb) showing under them. */
:root { --shell-hi: #8d62d8; --shell-mid: #6d43b6; --shell-lo: #522d93; --shell-ink: #2b1460; --shell-ink-shadow: rgba(255,255,255,.28); --shell-pcb: none; --shell-base: #522d93; }
#shell { display: none; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(140% 60% at 20% 0%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%),
    radial-gradient(90% 50% at 100% 100%, rgba(20,0,40,.35), rgba(20,0,40,0) 70%),
    linear-gradient(170deg, var(--shell-hi) 0%, var(--shell-mid) 48%, var(--shell-lo) 100%),
    var(--shell-pcb) 0 0 / 180px 180px repeat;
  background-color: var(--shell-base); }
body.touch #shell { display: block; }
body.touch { background: var(--shell-base); }
#bezel { position: absolute; box-sizing: border-box; border-radius: 10px 10px 36px 10px;
  background: linear-gradient(#4b4a60, #343348); box-shadow: inset 0 2px 5px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.28), 0 -1px 0 rgba(0,0,0,.25); }
#led { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #ff3a5a; box-shadow: 0 0 6px 1px rgba(255,58,90,.8); }
#brand { position: absolute; transform: translateX(-50%); white-space: nowrap; letter-spacing: 1px;
  font: italic 900 15px/1 'Arial Black', 'Helvetica Neue', Arial, sans-serif; color: var(--shell-ink); text-shadow: 0 1px 0 var(--shell-ink-shadow); }
#brand b { font-weight: 900; }
#brand b:nth-of-type(5n+1) { color: #ff3a5a; } #brand b:nth-of-type(5n+2) { color: #ffd23a; } #brand b:nth-of-type(5n+3) { color: #38f0a0; }
#brand b:nth-of-type(5n+4) { color: #3ad0ff; } #brand b:nth-of-type(5n+5) { color: #ff5ab0; }
#grille { position: absolute; width: 58px; height: 36px; transform: rotate(-30deg);
  background: repeating-linear-gradient(90deg, var(--shell-ink) 0 4px, transparent 4px 10px); border-radius: 4px; opacity: .55; }
/* round buttons: berry-colored, domed, pressed in when held. Captions (data-cap: A, B, SELECT, START) printed under them */
.tbtn {
  position: absolute; box-sizing: border-box; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font: bold 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 1px; color: #ffe2f0;
  background: radial-gradient(circle at 35% 30%, #e0609a 0%, #a8306c 55%, #6e1a48 100%);
  border: 2px solid #3a0f2c; box-shadow: 0 3px 0 #2a0a22, 0 5px 10px rgba(0,0,0,.35);
  text-shadow: 0 1px 0 rgba(0,0,0,.4);
}
.tbtn.on { transform: translateY(2px); box-shadow: 0 1px 0 #2a0a22, 0 2px 4px rgba(0,0,0,.35); filter: brightness(1.15); }
.tbtn[data-cap]::after { content: attr(data-cap); position: absolute; top: 100%; margin-top: 6px; left: 50%; transform: translateX(-50%);
  font: italic 900 11px/1 'Arial Black', Arial, sans-serif; letter-spacing: 1px; color: var(--shell-ink); text-shadow: 0 1px 0 var(--shell-ink-shadow); }
#btnSkill { font-size: 11px; }
/* each one its own color: A red, B blue, ITEM yellow, ITM green */
#btnFire { background: radial-gradient(circle at 35% 30%, #ff7a7a 0%, #d8303e 55%, #8a1424 100%); border-color: #4a0a14; box-shadow: 0 3px 0 #3a0810, 0 5px 10px rgba(0,0,0,.35); }
#btnSkill { background: radial-gradient(circle at 35% 30%, #7ab0ff 0%, #2f64d0 55%, #18347a 100%); border-color: #0c1a44; box-shadow: 0 3px 0 #0a1436, 0 5px 10px rgba(0,0,0,.35); color: #e2eeff; }
/* USE (use your item, open, search): the third big button, yellow */
#btnItem { background: radial-gradient(circle at 35% 30%, #ffe680 0%, #e8b818 55%, #9a7408 100%); border-color: #4a3404; box-shadow: 0 3px 0 #3a2804, 0 5px 10px rgba(0,0,0,.35); color: #3a2400; text-shadow: 0 1px 0 rgba(255,255,255,.4); font-size: 11px; }
/* WEAPON and ITEM (swap): flat colored pills over FIRE and USE */
.tbtn.pill.flat { transform: none; font-size: 9px; letter-spacing: 1px; }
.tbtn.pill.flat.on { transform: translateY(1px); }
#btnWpn { background: linear-gradient(#ffb070, #e0701c); border-color: #4a2004; box-shadow: 0 2px 0 #3a1804; color: #2a1200; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
#btnItm { background: linear-gradient(#7af0a8, #1e9a56); border-color: #063018; box-shadow: 0 2px 0 #04240e; color: #04240e; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
#btnFire.on, #btnSkill.on, #btnItem.on { box-shadow: 0 1px 0 rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.35); }
/* hidden by you (TOUCH LAYOUT) */
.tbtn.hid { display: none; }
/* the layout editor: everything shows (hidden ones faint), the picked one outlined, a toolbar at the top */
body.layoutedit #dpad { display: block; pointer-events: auto; }
body.layoutedit #stickBase { display: none; }
body.layoutedit .tbtn, body.layoutedit #btnItem, body.layoutedit #btnItm, body.layoutedit #btnWpn { display: flex; }
body.layoutedit .tbtn.hid { opacity: .3; outline: 2px dashed rgba(255,255,255,.6); }
body.layoutedit .picked { outline: 3px dashed #ffd23a; outline-offset: 4px; }
#layoutbar { display: none; position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 2; padding: 6px 8px; border-radius: 10px;
  background: rgba(16, 8, 34, .92); border: 2px solid #ffd23a; color: #ffd23a; font: bold 11px/1.2 ui-monospace, Menlo, Consolas, monospace;
  text-align: center; white-space: nowrap; }
body.layoutedit #layoutbar { display: block; }
#layoutbar button { font: bold 12px/1 ui-monospace, Menlo, Consolas, monospace; color: #fff; background: #2a1f48; border: 1px solid #5a4a8a;
  border-radius: 6px; padding: 7px 10px; margin: 5px 2px 0; }
#layoutbar button.primary { background: #3a2a10; border-color: #ffd23a; color: #ffd23a; }
.tbtn.small { font-size: 10px; border-width: 2px; }
/* SELECT and START: slanted grey pills */
.tbtn.pill { border-radius: 999px; transform: rotate(-25deg); background: linear-gradient(#7a7a8c, #55556a); border: 2px solid #2a2a3a;
  box-shadow: 0 2px 0 #1e1e2a; }
.tbtn.pill.on { transform: rotate(-25deg) translateY(1px); box-shadow: 0 0 0 #1e1e2a; }
.tbtn.pill::after { font-size: 9px; margin-top: 5px; }
/* the joystick (in the game): a dark rubber pad */
#stickBase {
  position: absolute; border-radius: 50%; box-sizing: border-box;
  border: 3px solid rgba(25, 12, 45, .55); background: rgba(25, 12, 45, .22);
  transform: translate(-50%, -50%); opacity: .55; pointer-events: none;
}
#stickBase.active { opacity: .95; }
#stickKnob {
  position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #4a4a5c, #1e1e28); border: 2px solid #121218; box-sizing: border-box;
  transform: translate(-50%, -50%); box-shadow: 0 3px 6px rgba(0,0,0,.4);
}
/* the menus' D-pad: a black cross where the joystick rests */
#dpad { position: absolute; display: none; pointer-events: none; filter: drop-shadow(0 3px 0 #120a1e) drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
body.menumode #dpad { display: block; }
body.menumode #stickBase, body.menumode #btnItem, body.menumode #btnItm, body.menumode #btnWpn { display: none; }
.dbtn, #dMid { position: absolute; width: 34%; height: 34%; box-sizing: border-box; background: #22222c; }
.dbtn { pointer-events: auto; display: flex; align-items: center; justify-content: center; border-radius: 4px;
  color: #4c4c5e; font: bold 14px/1 ui-monospace, Menlo, Consolas, monospace; }
.dbtn.on { background: #34344a; color: #9a9ab0; }
#dUp { left: 33%; top: 0; border-radius: 4px 4px 0 0; } #dDown { left: 33%; bottom: 0; border-radius: 0 0 4px 4px; }
#dLeft { left: 0; top: 33%; border-radius: 4px 0 0 4px; } #dRight { right: 0; top: 33%; border-radius: 0 4px 4px 0; }
#dMid { left: 33%; top: 33%; background: radial-gradient(circle, #18181f 30%, #22222c 32%); }
body.editing #touch, body.editing #shell { display: none; }

/* ---- in-game edit mode panel (toggle with ` while playing) ---- */
#editpanel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 260px; box-sizing: border-box; overflow-y: auto; z-index: 20;
  padding: 10px; background: #160c26; border-left: 2px solid #ff5ab0; color: #e8e0ff; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; }
body.editing #editpanel { display: block; }
#editpanel h1 { font-size: 13px; margin: 0 0 4px; color: #ff5ab0; letter-spacing: 1px; }
#editpanel h2 { font-size: 10px; margin: 12px 0 5px; color: #ffd23a; letter-spacing: 1px; }
#editpanel .row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
#editpanel button { font: inherit; color: #e8e0ff; background: #221636; border: 1px solid #3a2f58; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
#editpanel button:hover { border-color: #3ad0ff; }
#editpanel button.primary { background: #3a1a4a; border-color: #ff5ab0; }
#editpanel .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
#editpanel .pal { display: flex; justify-content: center; padding: 2px; border: 2px solid transparent; border-radius: 4px; background: #1a1230; cursor: pointer; }
#editpanel .pal canvas { width: 28px; height: 28px; image-rendering: pixelated; }
#editpanel .pal.on { border-color: #ffd23a; background: #2a2040; }
#editpanel .pal:hover { border-color: #5a4a88; }
#editpanel .help { color: #8a7aa8; }
#editpanel a { color: #3ad0ff; }
/* fixed 2-line boxes, so text coming and going never pushes the palette around */
/* what you're placing and what's under the mouse: pinned to the top of the panel, always in view while it scrolls */
#ep-info { position: sticky; top: -10px; margin: -10px -10px 8px; padding: 8px 10px 6px; background: #120a20; border-bottom: 1px solid #3a2f58; z-index: 1; }
#ep-picked, #ep-hover { line-height: 14px; height: 28px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#ep-picked { color: #ffd23a; }
#ep-hover { color: #3ad0ff; }
#ep-msg { margin-top: 6px; min-height: 14px; color: #3ad0ff; }
#ep-dirty { color: #ffd23a; }
#editpanel summary { cursor: pointer; font-weight: bold; margin: 4px 0 2px; }
#editpanel .ok { color: #38f0a0; } #editpanel .warn { color: #ffd23a; } #editpanel .bad { color: #ff3a5a; }

/* Debug panel (enemy tuning), shown while the debug overlay is on */
#debugpanel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 250px; box-sizing: border-box; overflow-y: auto; z-index: 20;
  padding: 10px; background: #160c26; border-left: 2px solid #ffd23a; color: #e8e0ff; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; }
body.debugging:not(.editing) #debugpanel { display: block; }
#debugpanel h1 { font-size: 13px; margin: 0 0 4px; color: #ffd23a; letter-spacing: 1px; }
#debugpanel h2 { font-size: 10px; margin: 0 0 4px; color: #ffd23a; letter-spacing: 1px; }
#debugpanel .help { color: #8a7aa8; margin: 6px 0; }
#debugpanel .dp-kind { margin-top: 10px; padding: 6px; border: 1px solid #2a1f44; border-radius: 4px; }
#debugpanel .dp-kind.on { border-color: #ffd23a; background: #22183a; }
#debugpanel .dp-row { display: flex; align-items: center; gap: 4px; margin: 3px 0; }
#debugpanel .dp-row span { width: 92px; color: #9a8ec0; white-space: nowrap; }
#debugpanel .dp-row b { flex: 1; text-align: center; font-weight: normal; }
#debugpanel button { font: inherit; color: #e8e0ff; background: #221636; border: 1px solid #3a2f58; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
#debugpanel button:hover { border-color: #3ad0ff; }
#debugpanel button.primary { background: #3a2a10; border-color: #ffd23a; padding: 4px 14px; }
#debugpanel .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
#dp-dirty { color: #ffd23a; } #dp-msg { min-height: 14px; margin-top: 6px; }
#dp-tabs { display: flex; gap: 3px; margin: 8px 0 2px; }
#dp-tabs button { flex: 1; padding: 4px 0; font-size: 10px; letter-spacing: 0; }
#debugpanel .dp-spawn { display: flex; flex-wrap: wrap; gap: 4px; }
#debugpanel .dp-spawn button { font-size: 10px; padding: 3px 6px; }
#dp-tabs button.on { background: #3a2a10; border-color: #ffd23a; color: #ffd23a; }
#debugpanel .ok { color: #38f0a0; } #debugpanel .bad { color: #ff3a5a; }

/* Aiming with the mouse: the game draws its own crosshair, so hide the system cursor over the game */
body.mouseaim #screen { cursor: none; }
</style>

<div id="shell"><div id="bezel"><span id="led"></span></div><div id="brand">AFK <b>A</b><b>P</b><b>O</b><b>C</b><b>A</b><b>L</b><b>Y</b><b>P</b><b>S</b><b>E</b></div><div id="grille"></div></div>

</div>
<div id="touch">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="dpad"><div class="dbtn" id="dUp" data-b="dup">&#9650;</div><div class="dbtn" id="dDown" data-b="ddown">&#9660;</div><div class="dbtn" id="dLeft" data-b="dleft">&#9664;</div><div class="dbtn" id="dRight" data-b="dright">&#9654;</div><div id="dMid"></div></div>
  <div class="tbtn" id="btnFire" data-b="fire">FIRE</div>
  <div class="tbtn" id="btnSkill" data-b="skill">SKILL</div>
  <div class="tbtn" id="btnItem" data-b="item">USE</div>
  <div class="tbtn pill" id="btnPause" data-b="pause" data-cap="START"></div>
  <div class="tbtn pill" id="btnSelect" data-b="select" data-cap="SELECT"></div>
  <div class="tbtn pill flat" id="btnWpn" data-b="wpn">WEAPON</div>
  <div class="tbtn pill flat" id="btnItm" data-b="itm">ITEM</div>
  <div id="layoutbar"><span id="lbName">TAP A BUTTON, DRAG IT</span><div><button data-act="smaller">&minus;</button><button data-act="bigger">+</button><button data-act="hide">HIDE</button><button data-act="reset">RESET</button><button data-act="done" class="primary">DONE</button></div></div>
</div>
<script>window.AFK_BUILD = 'BUILD 10-07 04:30';</script>
<script>
/* AFK APOCALYPSE — core: global namespace, math helpers, save data, state machine */
(function () {
  'use strict';
  const G = (window.G = {
    W: 256, H: 224, TILE: 16, STEP: 1000 / 60,
    tick: 0, state: null,
  });

  G.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  G.lerp = (a, b, t) => a + (b - a) * t;

  // ---- Randomness: two sources, kept apart on purpose ----
  // G.rng drives the simulation (enemy decisions, spawns, loot, spread). It's seeded per stage, so the same seed and
  // the same inputs replay the same game: what replays, tests and online co-op (docs/engine/netplay.md) build on.
  // G.fx is for looks only (particles, screen shake, idle animations) and must never change what happens in the game.
  // Mulberry32: tiny, fast, good enough for games.
  const makeRng = (next) => ({
    next,
    rand: (a, b) => a + next() * (b - a),
    randi: (a, b) => Math.floor(a + next() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    chance: (p) => next() < p, // true with probability p (0..1)
  });
  let seedState = 1;
  G.rng = makeRng(() => {
    let t = (seedState = (seedState + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  });
  G.rng.seed = (n) => { seedState = n | 0 || 1; };
  G.fx = makeRng(Math.random);
  // Shorthands for the simulation source
  G.rand = G.rng.rand; G.randi = G.rng.randi; G.pick = G.rng.pick; G.chance = G.rng.chance;
  // Pick a key from { key: weight, ... } in proportion to its weight (simulation source)
  G.weightedPick = (weights) => {
    let total = 0;
    for (const k in weights) total += weights[k];
    let r = G.rng.next() * total;
    for (const k in weights) if ((r -= weights[k]) < 0) return k;
    return Object.keys(weights)[0];
  };
  // Remove items failing keep(item) in place (no new array each frame, so no garbage for the collector)
  // Collision helper (used by the game, the enemy flow field and the editors' checks).
  // Can you step around what's solid in this cell? Only if all of it together is small (a lamp pole, a tree trunk, a
  // mailbox): its overall bounding box fits in 8x8 px. Judged as a whole, because a thin wall is drawn as several
  // small pieces (a center plus arms) that together span the cell.
  G.smallObstacle = (rects) => {
    if (!rects || !rects.length) return true;
    const x0 = Math.min(...rects.map((q) => q[0])), y0 = Math.min(...rects.map((q) => q[1]));
    const x1 = Math.max(...rects.map((q) => q[0] + q[2])), y1 = Math.max(...rects.map((q) => q[1] + q[3]));
    return x1 - x0 <= 8 && y1 - y0 <= 8;
  };
  // Why a save to the project (maps.js, tuning.js) failed, in words: saving needs the dev server, so a copy opened
  // anywhere else (the shared single-file link, a file on disk) can never save; on the dev server's own address it
  // means the server isn't answering (stopped, or this tab outlived it).
  G.saveHelp = () => (location.port === '8117'
    ? 'Could not save: the dev server is not answering. Start it (node tools/devserver.js), reload this page, then save again.'
    : 'Could not save: this copy of the game (' + (location.protocol === 'file:' ? 'a file on disk' : location.host || 'shared link') + ') has no dev server behind it. Open http://localhost:8117 on your computer to save.');
  G.compact = (arr, keep) => {
    let n = 0;
    for (let i = 0; i < arr.length; i++) if (keep(arr[i])) arr[n++] = arr[i];
    arr.length = n;
    return arr;
  };
  // Deterministic 0..1 hash of two ints (for tile variation)
  G.hash = (x, y) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };

  // ---- Save data (attempt count, best score, options) ----
  const DEFAULT_OPTS = { scanlines: true, aimAssist: 1, sound: true, perk: 'charged', diff: 'normal', touchLayout: {}, case: 'grape' }; // case: the touch screen's console color (G.CASES) // touchLayout: your own placement of the touch buttons (input.js) // diff: G.DIFFICULTY // perk: the full-health perk (G.PERKS)
  G.AIM_LABELS = ['OFF', 'LOW', 'HIGH'];
  G.AIM_CONES = [0, 14, 30]; // degrees
  const KEY = 'afk-apocalypse/save/v1';
  G.save = {
    data: { attempt: 117, best: 0, opts: { ...DEFAULT_OPTS } },
    load() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (s && typeof s === 'object') {
          this.data = { ...this.data, ...s, opts: { ...DEFAULT_OPTS, ...(s.opts || {}) } };
        }
      } catch (e) { /* storage blocked: run with defaults */ }
    },
    write() {
      try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ }
    },
  };
  G.save.load();
  G.opts = () => G.save.data.opts;

  // ---- State machine ----
  G.setState = (s) => { G.state = s; if (s.enter) s.enter(); };
  // Menus accept taps/clicks on the game screen; gameplay uses the touch zones instead
  G.wantsTaps = () => !!(G.state && G.state.menu);

  // ---- Toast (small banner message drawn over any state) ----
  G.toastMsg = ''; G.toastT = 0;
  G.toast = (msg, t = 150) => { G.toastMsg = msg; G.toastT = t; };
})();
</script>
<script>
/* AFK APOCALYPSE — gfx: screen scaling/layout, sprite tools, bitmap font, SNES dialog boxes */
(function () {
  'use strict';
  const G = window.G;
  const canvas = document.getElementById('screen');
  const stage = document.getElementById('stage');
  canvas.width = G.W; canvas.height = G.H;

    }

    const swap = (b) => [b[0], b[1] - B / 2 - 15, B * 0.86, 20];

      itm, weapon: wpn, select: [sel[0], sel[1], ...pill], pause: [start[0], start[1], ...pill], pad: [idle[0], idle[1], stickR, stickR] };
    lay = { vw, vh, orient: portrait ? 'portrait' : 'landscape' };
    const mine = myLayout();
    for (const k in at) {
      const o = mine[k], a = at[k];
      if (o) { if (o.x !== undefined) { a[0] = o.x * vw; a[1] = o.y * vh; } if (o.s) { a[2] *= o.s; a[3] *= o.s; } }
      if (k === 'pad') continue;
      const el = els[KEYS[k]];
      place(el, a[0], a[1], a[2], a[3]);
      el.classList.toggle('hid', !!(o && o.hide)); el.classList.toggle('picked', I.layoutEdit && pick === k);

    if (T.stick.id === null) setStickEl(idle[0], idle[1], false);
  };
  // ---- TOUCH LAYOUT (pause menu): drag the buttons where you like them, resize or hide them; saved per orientation ----
  const KEYS = { fire: 'fire', skill: 'skill', item: 'item', itm: 'itm', weapon: 'wpn', select: 'select', pause: 'pause' }; // layout key -> els entry
  const NAMES = { fire: 'FIRE / OK', skill: 'SKILL / BACK', item: 'USE: USE ITEM, OPEN', itm: 'ITEM: SWAP ITEM', weapon: 'WEAPON: SWAP WEAPON', select: 'SELECT (NOTHING YET)', pause: 'START: PAUSE', pad: 'D-PAD / JOYSTICK' };
  let lay = { vw: 1, vh: 1, orient: 'portrait' }, pick = null, drag = null;
  const myLayout = () => {
    const o = G.opts(); o.touchLayout = o.touchLayout || {};
    const L = (o.touchLayout[lay.orient] = o.touchLayout[lay.orient] || {});
    if (L.wpn && !L.select) { L.select = L.wpn; delete L.wpn; } // (layouts saved when the SELECT pill was called 'wpn')
    return L;
  };
  const keyOf = (el) => (!el ? null : el.id === 'dpad' ? 'pad' : Object.keys(KEYS).find((k) => els[KEYS[k]] === el) || null);
  function setPick(k) {
    pick = k;
    els.lbName.textContent = k ? NAMES[k] + (myLayout()[k] && myLayout()[k].hide ? ' (HIDDEN)' : '') : 'TAP A BUTTON, DRAG IT';
    if (G.layout) G.layout();
  }
  function editDown(e) {
    const act = e.target.closest && e.target.closest('[data-act]');
    if (act) return editAct(act.dataset.act);
    const el = e.target.closest && e.target.closest('.tbtn, #dpad'), k = keyOf(el);
    if (!k) return setPick(null);
    const r = el.getBoundingClientRect();
    drag = { id: e.pointerId, k, ox: e.clientX - (r.left + r.width / 2), oy: e.clientY - (r.top + r.height / 2) };
    setPick(k);
  }
  function editMove(e) {
    if (!drag || drag.id !== e.pointerId) return;
    const o = (myLayout()[drag.k] = myLayout()[drag.k] || {});
    o.x = +G.clamp((e.clientX - drag.ox) / lay.vw, 0.02, 0.98).toFixed(4); o.y = +G.clamp((e.clientY - drag.oy) / lay.vh, 0.02, 0.98).toFixed(4);
    if (G.layout) G.layout();

  function editUp(e) { if (drag && drag.id === e.pointerId) { drag = null; G.save.write(); } }
  function editAct(a) {
    const L = myLayout(), o = pick && (L[pick] = L[pick] || {});
    if (a === 'done') { I.editLayout(false); if (I.onLayoutDone) I.onLayoutDone(); return; }
    if (a === 'reset') { G.opts().touchLayout[lay.orient] = {}; G.toast('BUTTONS BACK WHERE THEY STARTED', 90); }
    else if (!o) { G.toast('TAP A BUTTON FIRST', 60); return; }
    else if (a === 'bigger' || a === 'smaller') o.s = +G.clamp((o.s || 1) + (a === 'bigger' ? 0.1 : -0.1), 0.6, 1.8).toFixed(2);
    else if (a === 'hide') { if (pick === 'pad') { G.toast('THE D-PAD STAYS (YOU NEED IT)', 60); return; } o.hide = !o.hide; }

    if (els.lbName) setPick(null);
  };
  function initTouch() {
    els.layer = document.getElementById('touch');
    els.base = document.getElementById('stickBase'); els.knob = document.getElementById('stickKnob');
    els.fire = document.getElementById('btnFire'); els.skill = document.getElementById('btnSkill');
    els.item = document.getElementById('btnItem'); els.pause = document.getElementById('btnPause');
    els.wpn = document.getElementById('btnWpn'); els.itm = document.getElementById('btnItm'); els.select = document.getElementById('btnSelect');
    els.dpad = document.getElementById('dpad');
    els.lbName = document.getElementById('lbName');
    els.bezel = document.getElementById('bezel'); els.led = document.getElementById('led'); els.brand = document.getElementById('brand'); els.grille = document.getElementById('grille');
    els.dup = document.getElementById('dUp'); els.ddown = document.getElementById('dDown'); els.dleft = document.getElementById('dLeft'); els.dright = document.getElementById('dRight');
    els.layer.addEventListener('pointerdown', onDown, { passive: false });
    els.layer.addEventListener('pointermove', onMove, { passive: false });
    els.layer.addEventListener('pointerup', onUp);
    els.layer.addEventListener('pointercancel', onUp);
    els.layer.addEventListener('contextmenu', (e) => e.preventDefault());
    // No zooming the page: iOS ignores the viewport's user-scalable=no, so stop pinches (two fingers going down) and
    // double-tap zoom (a second touch ending within 350 ms) here. The game reads pointer events, so it doesn't mind.
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('gesturechange', (e) => e.preventDefault());
    document.addEventListener('dblclick', (e) => e.preventDefault());
    // The surest way on iOS (and inside the Claude app's frame): a touch on the controls layer, which covers the whole
    // screen in touch mode, cancels the browser's own handling from the start (no zoom, scroll, callout or
    // double-tap). Pointer events, which the game uses, still come through.
    for (const ev of ['touchstart', 'touchmove', 'touchend']) els.layer.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });

    let lastEnd = 0;
    document.addEventListener('touchend', (e) => { if (e.timeStamp - lastEnd < 350) e.preventDefault(); lastEnd = e.timeStamp; }, { passive: false });

  }
  initTouch();

  // Mouse clicks on the game screen work in menus (desktop)
  addEventListener('pointerdown', (e) => {
    if (e.pointerType !== 'mouse' || I.forceTouch) return;

        if (Math.hypot(r.ax, r.ay) > Math.hypot(n.ax, n.ay)) { n.ax = r.ax; n.ay = r.ay; }

  // Switch the touch controls between menu mode (D-pad, OK, BACK) and play mode (joystick, FIRE, SKILL...)
  I.menuMode = false;

    if (I.menuMode === on) return;

      left: anyDown(['ArrowLeft', 'KeyA']) || D('dleft'), right: anyDown(['ArrowRight', 'KeyD']) || D('dright'),
      confirm: anyDown(['Enter', 'Space', 'KeyZ', 'KeyJ']) || !!T.hit.fire,

      start: anyDown(['Escape', 'KeyP']) || !!(T.btn.pause || T.hit.pause),

  // Each device becomes one player's controller source: the WASD half of the keyboard (with the mouse), the arrow
  // half, a gamepad, or the touch controls.
  const padWas = [];

    kb1: { name: 'KEYBOARD: WASD', src: { keys: 'p1', mouse: true } },

    I.hits = Object.create(null);
    T.hit = {};
    I.taps.length = 0;
  };
})();

      skin: '#c98b5e', hair: '#2a1a10', shirt: '#38f0a0', pants: '#202030', shoes: '#ff5ab0',
      extra(r, dir) { if (dir === 'right') r(4, 1, 7, 1, '#ff5ab0'); else r(3, 1, 8, 1, '#ff5ab0'); },
    },
    robe: {
      skin: '#f2c29a', hair: '#8a6a40', shirt: '#4a70c8', pants: '#4a70c8', shoes: '#c8a070',
      extra(r, dir) { if (dir === 'right') r(5, 11, 5, 1, '#2a4a90'); else r(3, 11, 8, 1, '#2a4a90'); },
    },
    // Phone zombies (teens) and the faster sprinter
    teen1: { skin: '#a8c49a', hair: '#2a2030', shirt: '#5a6a78', pants: '#2a3048', shoes: '#d8d8e0', holdPhone: true, extra: teenExtra },
    teen2: { skin: '#a8c49a', hair: '#6a3a20', shirt: '#7a2a3a', pants: '#202028', shoes: '#3a3a48', holdPhone: true, extra: teenExtra },
    teen3: { skin: '#a8c49a', hair: '#d8b040', shirt: '#2e2e3e', pants: '#4a5a78', shoes: '#ff5ab0', holdPhone: true, extra: teenExtra },
    sprinter: {
      skin: '#a8c49a', hair: '#1a1020', shirt: '#e03048', pants: '#2a2a38', shoes: '#ffd23a', holdPhone: true,
      extra(r, dir, f, C) { teenExtra(r, dir, f, C); if (dir === 'down') { r(2, 4, 1, 2, '#ffffff'); r(11, 4, 1, 2, '#ffffff'); } },
    },
  };
  G.NEIGHBOR_LOOKS = ['dad', 'grandma', 'kid', 'jogger', 'robe'];

  function colors(L) {
    return {
      skin: L.skin, skinD: G.shade(L.skin, -0.18), hair: L.hair, hairL: G.shade(L.hair, 0.2),
      shirt: L.shirt, shirtD: G.shade(L.shirt, -0.3), pants: L.pants, pantsD: G.shade(L.pants, -0.3),
      shoes: L.shoes, shoesD: G.shade(L.shoes, -0.3), eye: L.eye || '#1a1020',
    };
  }
  // f: 0 = stand, 1 = step A, 2 = step B
  function front(r, C, f, L, back) {
    const lL = f === 1 ? 1 : 0, rL = f === 2 ? 1 : 0;
    r(4, 13, 3, 4 - lL, C.pants); r(4, 17 - lL, 3, 1, C.shoes);
    r(7, 13, 3, 4 - rL, C.pants); r(7, 13, 1, 4 - rL, C.pantsD); r(7, 17 - rL, 3, 1, C.shoes);
    if (L.holdPhone) { // arms bent, hands together holding the phone
      r(2, 8, 1, 2, C.shirtD); r(11, 8, 1, 2, C.shirtD);
      if (!back) { r(3, 10, 2, 1, C.shirtD); r(9, 10, 2, 1, C.shirtD); }
    } else {
      const la = f === 1 ? -1 : f === 2 ? 1 : 0, ra = -la;
      r(2, 8 + la, 1, 3, C.shirtD); r(2, 11 + la, 1, 1, C.skin);
      r(11, 8 + ra, 1, 3, C.shirtD); r(11, 11 + ra, 1, 1, C.skinD);
    }
    r(3, 7, 8, 5, C.shirt); r(10, 7, 1, 5, C.shirtD); r(3, 12, 8, 1, C.shirtD);
    if (back) {
      r(4, 0, 6, 1, C.hair); r(3, 1, 8, 5, C.hair); r(4, 6, 6, 1, C.hair); r(4, 1, 2, 1, C.hairL);
      if (L.hairStyle === 'long') r(3, 6, 8, 3, C.hair);
    } else {
      r(6, 7, 2, 1, C.skinD);
      r(4, 2, 6, 4, C.skin); r(5, 6, 4, 1, C.skin); r(9, 3, 1, 3, C.skinD);
      r(4, 0, 6, 1, C.hair); r(3, 1, 8, 1, C.hair); r(3, 2, 1, 3, C.hair); r(10, 2, 1, 3, C.hair);
      r(4, 2, 2, 1, C.hair); r(5, 1, 2, 1, C.hairL);
      r(5, 4, 1, 1, C.eye); r(8, 4, 1, 1, C.eye);
      if (L.hairStyle === 'long') { r(3, 5, 1, 3, C.hair); r(10, 5, 1, 3, C.hair); }
      if (L.holdPhone) { r(5, 10, 1, 1, C.skin); r(8, 10, 1, 1, C.skin); r(6, 9, 2, 3, '#1a1a28'); r(6, 9, 2, 2, GLOW); }
    }
  }
  function side(r, C, f, L) {
    if (f === 0) { r(6, 13, 3, 4, C.pants); r(6, 13, 1, 4, C.pantsD); r(6, 17, 4, 1, C.shoes); }
    else {
      const a = f === 1;
      r(4, 13, 2, 4, a ? C.pantsD : C.pants); r(3, 17, 3, 1, a ? C.shoesD : C.shoes);
      r(8, 13, 2, 4, a ? C.pants : C.pantsD); r(8, 17, 3, 1, a ? C.shoes : C.shoesD);
      r(5, 13, 4, 1, C.pants);
    }
    r(5, 7, 5, 5, C.shirt); r(5, 7, 1, 5, C.shirtD); r(5, 12, 5, 1, C.shirtD);
    if (L.holdPhone) { r(7, 8, 2, 2, C.shirtD); r(8, 10, 2, 1, C.shirtD); r(10, 10, 1, 1, C.skin); r(10, 8, 2, 2, '#1a1a28'); r(11, 8, 1, 2, GLOW); }
    else if (f === 0) { r(7, 8, 2, 3, C.shirtD); r(7, 11, 2, 1, C.skin); }
    else if (f === 1) { r(8, 8, 2, 3, C.shirtD); r(9, 11, 2, 1, C.skin); }
    else { r(5, 8, 2, 3, C.shirtD); r(4, 11, 2, 1, C.skin); }
    r(7, 2, 4, 4, C.skin); r(6, 5, 1, 1, C.skin); r(6, 6, 4, 1, C.skin); r(11, 4, 1, 1, C.skin);
    r(5, 0, 5, 1, C.hair); r(4, 1, 7, 1, C.hair); r(4, 2, 4, 1, C.hair); r(4, 3, 3, 2, C.hair); r(4, 5, 2, 1, C.hair);
    r(6, 1, 2, 1, C.hairL);
    r(6, 4, 1, 1, C.skinD); r(9, 4, 1, 1, C.eye);
    if (L.hairStyle === 'long') r(4, 5, 2, 3, C.hair);
  }
  function drawHuman(x, L, dir, f) {
    const C = colors(L);
    const r = (a, b, w, h, c) => { x.fillStyle = c; x.fillRect(a, b + OY, w, h); };
    if (dir === 'right') side(r, C, f, L); else front(r, C, f, L, dir === 'up');
    if (L.extra) L.extra(r, dir, f, C);
  }
  // Returns { down:[3], up:[3], right:[3], left:[3] } outlined canvases
  G.buildHuman = (L) => {
    const out = {};
    for (const dir of ['down', 'up', 'right']) {
      out[dir] = [0, 1, 2].map((f) => {
        const c = G.makeCanvas(14, 22);
        drawHuman(c.getContext('2d'), L, dir, f);
        return G.outline(c);
      });
    }
    out.left = out.right.map(G.flipH);
    return out;
  };
})();
</script>

      for (let i = 0; i < 5; i++) r(9 + (i >> 1), 5 - i, 1, 1, '#2a2a38'); r(10, 0, 2, 1, '#2a2a38');

    foil(r) { // Ted's foil stars: two crinkly silver throwing stars
      const star = (x, y) => { r(x + 1, y, 1, 4, '#c8c8d8'); r(x, y + 1, 4, 1, '#c8c8d8'); r(x, y, 1, 1, '#8a8aa0'); r(x + 3, y + 3, 1, 1, '#8a8aa0'); r(x + 3, y, 1, 1, '#ffffff'); r(x, y + 3, 1, 1, '#ffffff'); r(x + 1, y + 1, 2, 2, '#ffffff'); };

      r(2, 1, 4, 1, '#3a3048'); r(2, 1, 1, 3, '#3a3048'); r(5, 1, 1, 3, '#3a3048');
      r(2, 9, 1, 2, '#3a3048'); r(5, 9, 1, 2, '#3a3048');
    },
    rockets(r) {
      r(5, 1, 3, 6, '#ff3a5a'); r(6, 0, 1, 1, '#ffd23a'); r(5, 1, 3, 1, '#ffd23a'); r(5, 4, 3, 1, '#ffffff');
      r(6, 7, 1, 5, '#b07a48'); r(2, 2, 2, 4, '#3ad0ff'); r(2, 1, 2, 1, '#ffffff'); r(3, 6, 1, 5, '#b07a48');
      r(9, 8, 1, 1, '#ffd23a'); r(10, 6, 1, 1, '#ffd23a');
    },
    pie(r) {
      r(1, 3, 10, 2, '#f8f0e0'); r(1, 5, 10, 1, '#e8b060');
      r(2, 6, 8, 1, '#d0405a'); r(3, 7, 6, 1, '#d0405a'); r(4, 8, 4, 1, '#d0405a'); r(5, 9, 2, 1, '#e8b060');
      r(3, 6, 1, 1, '#ff8aa0'); r(6, 7, 1, 1, '#ff8aa0'); r(5, 2, 2, 1, '#ff3a5a');
    },
    coffee(r) {
      r(2, 3, 7, 8, '#f0f0f8'); r(2, 3, 7, 1, '#5a3018'); r(3, 4, 5, 1, '#8a5030');
      r(9, 5, 2, 1, '#f0f0f8'); r(10, 6, 1, 2, '#f0f0f8'); r(9, 8, 2, 1, '#f0f0f8');

      r(4, 0, 1, 2, '#c8d0e0'); r(6, 1, 1, 1, '#c8d0e0');

      r(3, 3, 6, 8, '#38c070'); r(5, 1, 2, 2, '#38c070'); r(5, 0, 2, 1, '#ff3a5a');

    hkey(r) { // a plain brass house key: opens any one locked house door
      r(1, 3, 5, 5, '#e0c060'); r(2, 4, 3, 3, '#1a1028'); r(1, 3, 5, 1, '#fff0a0');      // the bow, with its hole
      r(6, 5, 5, 2, '#e0c060'); r(6, 5, 5, 1, '#fff0a0'); r(9, 7, 1, 2, '#c0a040'); r(7, 7, 1, 1, '#c0a040'); // shaft, teeth
    },
    // Zelda-compass equivalent: reveals secrets and packages on the radar
    bat(r) { // a wooden baseball bat, diagonal
      for (let i = 0; i < 9; i++) { const w = i < 3 ? 1 : 2; r(1 + i, 10 - i, w, w, i < 3 ? '#3a2a20' : '#c8a070'); }

      for (let y = 8; y < 12; y += 2) r(5, y, 2, 1, '#8a8aa0');

      r(3, 3, 2, 1, '#ffffff'); r(5, 4, 2, 4, '#8a8aa0'); r(4, 5, 4, 1, '#8a8aa0');

  const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  function heart(kind) {
    return sprite(7, 6, (r) => {
      HEART.forEach((row, y) => [...row].forEach((ch, k) => {
        if (ch !== '#') return;
        const full = kind === 'full' || (kind === 'half' && k <= 3);
        r(k, y, 1, 1, full ? '#ff3a5a' : '#3a2238');
      }));
      if (kind !== 'empty') r(1, 1, 1, 1, '#ffb0c0');
    });
  }

  G.buildArt = () => {
    const A = G.art;
    A.crew = {};
    A.people = {};
    for (const k in G.LOOKS) (G.CREW[k] ? A.crew : A.people)[k] = G.buildHuman(G.LOOKS[k]);
    A.dummy = sprite(14, 22, dummy);
    A.stump = sprite(14, 22, stump);
    A.upBox = sprite(12, 12, upBox);
    A.pkg = sprite(14, 12, pkgClosed);
    A.pkgOpen = sprite(14, 12, pkgOpen);
    // Keycards, one per color (G.CARD_COLORS, render.js): a card with a magnetic stripe and a chip
    for (const [col, [c, l]] of Object.entries(G.CARD_COLORS)) {
      ICONS['card_' + col] = (r) => {
        r(1, 3, 10, 7, c); r(1, 3, 10, 1, l); r(1, 5, 10, 1, '#1a1028');
        r(2, 7, 2, 2, '#ffd23a'); r(6, 7, 4, 1, '#ffffff'); r(6, 8, 3, 1, l);
      };
    }
    ICONS.key = ICONS.card_red; // the old name: a (red) keycard
    A.icons = {};
    for (const k in ICONS) A.icons[k] = sprite(12, 12, ICONS[k]);
    A.heart = { full: heart('full'), half: heart('half'), empty: heart('empty') };
  };
})();
</script>
<script>
/* AFK APOCALYPSE — robot enemies' art (PLAN.md: delivery drones, robot dogs, robot mops). Drawn with r() rects, then
   G.outline()'d, like everything else. Each look is { down, up, right, left: [3 frames] }, the same shape as a person's
   (G.buildHuman), so the enemy code treats robots like any other look; G.drawBot draws them (robots don't climb out
   of the ground like the teens: they beam in, and a drone flies down from the sky and back up when it leaves).
   Also: the wet trail a robot mop leaves (G.drawWet). */
(function () {
  'use strict';
  const G = window.G;

  // One frame: draw(r, f, dir) on a w x h canvas, then outlined (so the sprite is w+2 x h+2)
  const frame = (w, h, draw, f, dir) => {
    const c = G.makeCanvas(w, h), x = c.getContext('2d');
    draw((a, b, ww, hh, col) => { x.fillStyle = col; x.fillRect(a, b, ww, hh); }, f, dir);
    return G.outline(c);
  };
  const look = (w, h, draw) => {
    const out = {};
    for (const dir of ['down', 'up', 'right']) out[dir] = [0, 1, 2].map((f) => frame(w, h, draw, f, dir));
    out.left = out.right.map(G.flipH);
    return out;
  };

  // Delivery drone (18 x 12): four rotors on a cross frame, a white shell with an orange delivery stripe, a red camera
  // eye, and the parcel it's about to drop slung underneath (pkg = false: it's dropped it and is off to reload).
  // Frames spin the rotors. Seen from above, so every direction is the same body; the eye shows which way it faces.
  const drone = (pkg) => (r, f, dir) => {
    r(2, 3, 14, 1, '#5a5a6a');                                                                  // the arms
    for (const x of [0, 12]) {                                                                  // rotors, spinning
      if (f === 0) r(x, 1, 6, 1, '#d8d8e8');
      else if (f === 1) { r(x + 1, 0, 1, 1, '#d8d8e8'); r(x + 2, 1, 2, 1, '#9a9aac'); r(x + 4, 2, 1, 1, '#d8d8e8'); }
      else { r(x + 4, 0, 1, 1, '#d8d8e8'); r(x + 2, 1, 2, 1, '#9a9aac'); r(x + 1, 2, 1, 1, '#d8d8e8'); }
      r(x + 2, 2, 2, 2, '#3a3a48');                                                            // motor
    }
    r(5, 3, 8, 5, '#d8d8e0'); r(5, 3, 8, 1, '#ffffff'); r(5, 6, 8, 1, '#ff8a2a'); r(5, 7, 8, 1, '#8a8a9a'); // shell, stripe
    const ex = dir === 'right' ? 10 : dir === 'up' ? 8 : 8;
    if (dir !== 'up') { r(ex, 4, 2, 2, '#ff3a5a'); r(ex, 4, 1, 1, '#ffb0b8'); }                 // camera eye (not seen from behind)
    else r(7, 4, 4, 1, '#5a5a6a');                                                              // its back: a vent
    if (pkg) {
      r(7, 8, 1, 1, '#3a3a48'); r(10, 8, 1, 1, '#3a3a48');                                     // straps
      r(6, 9, 6, 3, '#c8945a'); r(6, 9, 6, 1, '#e0b07a'); r(8, 9, 2, 3, '#e8d8a8');            // the parcel, taped
    }
  };

  // Robot dog (16 x 12): a steel quadruped with a red visor and an antenna tail. Side view for left/right (legs
  // scissor as it trots), head-on for down, rump for up.
  const dog = (r, f, dir) => {
    const steel = '#b8bcc8', lit = '#e8ecf4', dark = '#6a6e7a', leg = '#4a4e5a', foot = '#2a2a38';
    if (dir === 'right') {
      r(1, 1, 1, 4, dark); r(1, 0, 1, 1, '#ff3a5a');                                          // antenna tail
      r(2, 4, 10, 4, steel); r(2, 4, 10, 1, lit); r(2, 7, 10, 1, dark);                        // body
      r(5, 5, 4, 1, '#ff8a2a');                                                                // a stripe
      r(11, 1, 4, 4, steel); r(11, 1, 4, 1, lit); r(14, 3, 2, 2, '#8a8e9a'); r(11, 0, 2, 1, leg); // head, snout, ear
      r(13, 2, 2, 1, '#ff3a5a');                                                               // visor
      const k = f === 1 ? 1 : f === 2 ? -1 : 0;                                                 // legs scissor
      for (const [x, s] of [[3, k], [5, -k], [9, k], [11, -k]]) { r(x + s, 8, 1, 3, leg); r(x + s, 11, 1, 1, foot); }
    } else if (dir === 'down') {
      r(3, 5, 10, 4, steel); r(3, 8, 10, 1, dark);                                             // body behind the head
      r(5, 1, 6, 5, steel); r(5, 1, 6, 1, lit); r(4, 0, 1, 2, leg); r(11, 0, 1, 2, leg);         // head, ears
      r(6, 3, 4, 1, '#ff3a5a'); r(7, 5, 2, 1, '#8a8e9a');                                       // visor, snout
      const up = [f === 1 ? 1 : 0, f === 2 ? 1 : 0];
      for (const [x, i] of [[4, 0], [6, 1], [9, 0], [11, 1]]) { r(x, 9, 1, 2 - up[i], leg); r(x, 11 - up[i], 1, 1, foot); }
    } else { // up: its back, the antenna tail on top
      r(3, 3, 10, 6, steel); r(3, 3, 10, 1, lit); r(3, 8, 10, 1, dark); r(6, 4, 4, 1, '#ff8a2a');
      r(7, 0, 1, 3, dark); r(7, 0, 1, 1, '#ff3a5a');
      r(5, 1, 6, 2, steel);                                                                    // the head beyond it
      const up = [f === 1 ? 1 : 0, f === 2 ? 1 : 0];
      for (const [x, i] of [[4, 0], [6, 1], [9, 0], [11, 1]]) { r(x, 9, 1, 2 - up[i], leg); r(x, 11 - up[i], 1, 1, foot); }
    }
  };

  // Robot mop (16 x 14): a round floor cleaner with a blue wet pad, a mop handle sticking up out of its back, little
  // brushes spinning at the front and a light strip for a face (green while it's sweeping, red once it's coming for
  // you: angry = true).
  const mop = (angry) => (r0, f, dir) => {
    const r = (x, y, w, h, c) => r0(x, y + 4, w, h, c); // the body sits 4 px down, under the handle
    const hx = dir === 'right' ? 4 : 7;                                                     // the handle, at its back
    r0(hx, 0, 1, 6, '#c8945a'); r0(hx, 0, 1, 1, '#ff8a2a'); r0(hx + 1, 1, 1, 4, '#8a5a30');
    r(2, 1, 12, 6, '#e8e8f0'); r(1, 2, 14, 4, '#e8e8f0'); r(3, 1, 10, 1, '#ffffff');         // the shell
    r(1, 5, 14, 2, '#5a6a9a'); r(2, 7, 12, 1, '#3a4a7a');                                     // its skirt
    r(3, 8, 10, 2, '#6aaee0'); r(4, 9, 8, 1, '#3a7ab0');                                      // the wet pad underneath
    if (dir !== 'up') r(dir === 'right' ? 9 : 6, 3, 4, 1, angry ? '#ff3a5a' : '#38f0a0');    // its face
    const bx = dir === 'up' ? [] : dir === 'right' ? [13] : [0, 13];                           // brushes at the front
    for (const x of bx) {
      if (f === 0) r(x, 7, 3, 1, '#ffd23a');
      else if (f === 1) r(x + 1, 6, 1, 3, '#ffd23a');
      else { r(x, 6, 1, 1, '#ffd23a'); r(x + 2, 8, 1, 1, '#ffd23a'); }
    }
  };

  const base = G.buildArt;
  G.buildArt = () => {
    base();
    const A = G.art;
    A.bots = {
      drone: look(18, 12, drone(true)), droneEmpty: look(18, 12, drone(false)),
      robodog: look(16, 12, dog),
      mopbot: look(16, 14, mop(false)), mopbotAngry: look(16, 14, mop(true)),
    };
    for (const k of ['drone', 'robodog', 'mopbot']) A.people[k] = A.bots[k]; // so a look name finds them like a person's
    A.people.clone = A.crew.pixel; // a deepfake's look until it picks whose copy it is (G.drawClone draws that one)
  };

  // Drawing a robot (Enemy.draw hands robots over to this). sx, sy: its feet on screen.
  //   rise: it beams in, a scanline at a time from the top, with cyan sparkles; sink: it beams back out.
  //   A drone flies: it hangs e.z px up (bobbing), its shadow on the ground; it comes down from the sky when it
  //   arrives and goes back up when it leaves.
  const SINK = 36;
  G.drawBot = (e, ctx, sx, sy) => {
    const A = G.art.bots, f = e.moving || e.flying ? [1, 0, 2, 0][(e.anim >> e.animShift) & 3] : 0;
    const set = e.type === 'drone' ? (e.hasPkg ? A.drone : A.droneEmpty) : e.type === 'mopbot' ? (e.angry ? A.mopbotAngry : A.mopbot) : A[e.look] || A.robodog;
    const spr = (set[e.dir] || set.down)[f], img = e.flash ? G.tinted(spr, '#ffffff') : spr;
    const w = spr.width, h = spr.height;
    if (e.flying) {
      const arrive = e.rise > 0 ? e.rise / e.riseMax : e.sink > 0 ? 1 - e.sink / SINK : 0; // 1 = up in the sky
      const z = Math.round((e.z || 0) + arrive * 80);
      G.drawShadow(ctx, sx, sy, z > 40 ? 3 : 5);
      if (e.tumbleT > 0) { // blown away: tumbling end over end
        const ph = (G.tick >> 2) & 3;
        ctx.save(); ctx.translate(sx, sy - (h >> 1) - z); ctx.scale(ph & 1 ? -1 : 1, ph & 2 ? -1 : 1);
        ctx.drawImage(img, -(w >> 1), -(h >> 1)); ctx.restore();
        return;
      }
      ctx.drawImage(img, sx - (w >> 1), sy - h - z);
      const P = e.type === 'drone' && e.hasPkg && G.PARCELS[e.pkgKind];
      if (P && !e.flash) { // the box slung under it, in its color (G.PARCELS: red bursts, blue ticks, green holds an enemy)
        const px = sx - (w >> 1) + 7, py = sy - h - z + 10;
        ctx.fillStyle = P.body; ctx.fillRect(px, py, 6, 3); ctx.fillStyle = P.light; ctx.fillRect(px, py, 6, 1);
        ctx.fillStyle = P.tape; ctx.fillRect(px + 2, py, 2, 3);
      }
      if (e.drawDrop) e.drawDrop(ctx, sx, sy - z); // (the drop behavior's wind-up)
      return;
    }
    const k = e.rise > 0 ? 1 - e.rise / e.riseMax : e.sink > 0 ? e.sink / SINK : 1; // how much of it is here
    G.drawShadow(ctx, sx, sy, 6);
    const shake = e.windT > 0 ? ((G.tick >> 1) & 1) * 2 - 1 : 0, lean = e.lungeT > 0 ? -2 : 0; // trembling before a pounce, low during it
    if (k >= 1) { ctx.drawImage(img, sx - (w >> 1) + shake, sy - h + 1 + lean - Math.round(e.z || 0)); return; }
    const shown = Math.round(h * k); // beaming in: the rows from the top that have arrived, a bright line at the edge
    if (shown > 0) ctx.drawImage(img, 0, 0, w, shown, sx - (w >> 1), sy - h + 1, w, shown);
    ctx.fillStyle = (G.tick >> 1) & 1 ? '#7ff0ff' : '#ffffff';
    ctx.fillRect(sx - (w >> 1) + 1, sy - h + 1 + shown, w - 2, 1);
    ctx.fillStyle = '#3ad0ff';
    for (let i = 0; i < 3; i++) ctx.fillRect(sx - 8 + ((G.tick * 5 + i * 7) % 16), sy - 2 - ((G.tick * 3 + i * 11) % (h + 6)), 1, 1);
  };

  // A deepfake clone: the copied crew member's own sprite, glitching. Magenta and cyan ghosts split either side, a
  // slice of it slips sideways now and then, and a dark scanline runs down it, so it never passes for the real one.
  // Rising: it glitches in, flickering. sx, sy: its feet on screen.
  G.drawClone = (e, ctx, sx, sy) => {
    const set = G.art.crew[e.crew] || G.art.crew.pixel, f = e.moving ? [1, 0, 2, 0][(e.anim >> e.animShift) & 3] : 0;
    const spr = (set[e.dir] || set.down)[f], x = sx - 8, y = sy - 22, t = G.tick + e.anim * 7;
    const k = e.rise > 0 ? 1 - e.rise / e.riseMax : e.sink > 0 ? e.sink / 36 : 1; // how much of it is here
    if (k < 1 && (t >> 1) % 3 === 0) return; // flickering in or out
    G.drawShadow(ctx, sx, sy, 5);
    const split = e.aimT > 0 ? 2 : 1;
    ctx.globalAlpha = 0.55 * k;
    ctx.drawImage(G.tinted(spr, '#ff3ab0'), x - split, y);
    ctx.drawImage(G.tinted(spr, '#3ad0ff'), x + split, y);
    ctx.globalAlpha = 0.9 * k;
    ctx.drawImage(e.flash ? G.tinted(spr, '#ffffff') : spr, x, y);
    ctx.globalAlpha = 1;
    if ((t % 47) < 5) { // a slice slips sideways
      const sy0 = 4 + ((t * 13) % 14), dx = (t & 1) ? 2 : -2;
      ctx.drawImage(spr, 0, sy0, 16, 3, x + dx, y + sy0, 16, 3);
    }
    ctx.fillStyle = 'rgba(20,12,40,.35)'; ctx.fillRect(x + 1, y + ((t >> 2) % 22), 14, 1); // a scanline running down it
    cloneEyes(e, ctx, sx, sy, k);
  };
  // Bright red eyes (where the sprite's eyes are: two from the front, one from the side, none from behind) that leave
  // a fading red trail as it moves. The trail is looks only, kept on the enemy as world points (e._eyes, not sent
  // online: each screen draws its own), and breaks where it glitched across the floor.
  const EYES = { down: [[-2, -14], [1, -14]], right: [[2, -14]], left: [[-3, -14]], up: [] }, TRAIL = 14;
  function cloneEyes(e, ctx, sx, sy, k) {
    const now = G.tick, tr = e._eyes || (e._eyes = []), dx = sx - e.x, dy = sy - e.y; // world -> screen
    const pts = k > 0.3 ? EYES[e.dir] || [] : [];
    const last = tr[tr.length - 1];
    if (pts.length && (!last || last.dir !== e.dir || Math.abs(last.x - e.x) + Math.abs(last.y - e.y) >= 1)) tr.push({ x: e.x, y: e.y, dir: e.dir, t: now });
    while (tr.length && now - tr[0].t > TRAIL) tr.shift();
    for (let i = 1; i < tr.length; i++) { // the trail: each eye's path, fading with age
      const a = tr[i - 1], b = tr[i];
      if (a.dir !== b.dir || Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > 12) continue; // turned, or glitched across
      const fade = 1 - (now - b.t) / TRAIL, n = Math.max(1, Math.round(Math.hypot(b.x - a.x, b.y - a.y)));
      ctx.globalAlpha = Math.max(0, fade) * 0.75;
      ctx.fillStyle = '#ff2020';
      for (const [ox, oy] of EYES[b.dir] || []) for (let j = 0; j < n; j++) {
        const q = j / n;
        ctx.fillRect(Math.round(a.x + (b.x - a.x) * q + ox + dx), Math.round(a.y + (b.y - a.y) * q + oy + dy), 1, 1);
      }
    }
    ctx.globalAlpha = 1;
    for (const [ox, oy] of pts) { // the eyes: a red glow, a bright core
      const ex = sx + ox, ey = sy + oy;
      ctx.fillStyle = 'rgba(255,40,40,.45)'; ctx.fillRect(ex - 1, ey - 1, 3, 3);
      ctx.fillStyle = '#ff2a2a'; ctx.fillRect(ex, ey, 1, 1);
    }
  }

  // Wet floor (a robot mop's trail): a shiny puddle on every wet cell, fading as it dries. st.wet: cell -> ticks left.
  // Each cell's puddle is a few overlapping round blobs placed by its cell (so it's ragged, never a square, and the
  // same every frame), spilling a little past the cell so a trail reads as one wet streak.
  const BLOBS = new Map(); // cell -> [[x, y, w, h], ...] blob rects (built once per cell)
  const blobsOf = (i) => {
    let b = BLOBS.get(i);
    if (b) return b;
    b = [];
    for (let k = 0; k < 4; k++) {
      const cx = 3 + Math.floor(G.hash(i, k * 7 + 1) * 10), cy = 4 + Math.floor(G.hash(i, k * 7 + 2) * 9), rw = 3 + Math.floor(G.hash(i, k * 7 + 3) * 4), rh = 2 + Math.floor(G.hash(i, k * 7 + 4) * 2);
      b.push([cx - rw, cy - rh + 1, rw * 2, rh * 2 - 2], [cx - rw + 1, cy - rh, rw * 2 - 2, rh * 2]); // a rounded blob: two rects
    }
    BLOBS.set(i, b);
    return b;
  };
  G.drawWet = (ctx, st, cx, cy) => {
    if (!st.wet || !st.wet.size) return;
    const R = st.room;
    for (const [i, t] of st.wet) {
      const tx = i % R.w, ty = (i - tx) / R.w, x = tx * 16 - cx, y = ty * 16 - cy;
      if (x < -16 || y < -16 || x > G.W || y > G.H) continue;
      const k = Math.min(1, t / 90);
      ctx.globalAlpha = k * 0.42; ctx.fillStyle = '#2a6ab0';
      for (const [a, b, w, h] of blobsOf(i)) ctx.fillRect(x + a, y + b, w, h);
      ctx.globalAlpha = k * 0.85; ctx.fillStyle = '#bfe8ff'; // glints
      const [g0, g1] = blobsOf(i);
      ctx.fillRect(x + g0[0] + 2, y + g0[1] + 1, 2, 1); ctx.fillRect(x + g1[0] + g1[2] - 3, y + g1[1] + g1[3] - 2, 1, 1);
      if (((G.tick >> 3) + tx + ty) % 9 === 0) ctx.fillRect(x + 8, y + 7, 1, 1);
    }
    ctx.globalAlpha = 1;
  };
})();
</script>
<script>
/* AFK APOCALYPSE — room rendering: ground tiles baked into one canvas, upright sprites depth-sorted with entities
   (2.5D), house doors, roofs and leaf canopies on the top layer, peek windows, and the PDA minimap.
   Docs: docs/engine/rendering.md */
(function () {
  'use strict';
  const G = window.G;

  // ===== Tile themes =====
  // Each theme (in tiles-*.js) is an object with:
  //   label, palette [[ch, name]...], groups [[title, 'chars']...] (editor sections)
  //   border (out-of-bounds tile), ground (what markers and broken tiles become)
  //   solid, shots (blocks shots), breakable (rockets and soda bombs clear them), chop (the machete cuts them),
  //   patchy (the obvious breakables, for the NEEDS ROCKETS hint), secret (PDA shimmer),
  //   vent (crew with the vent gate can pass), rubble { ch: leftover tile }
  //   water, bounce, searchable, jumpBlock, road (street tiles, for the editors' layout checks)
  //   stamps { ch: [w, h] }       multi-tile pieces the editors place whole (a 2x1 trampoline)
  //   heights { ch: px, over: { ch: px } }  how tall solid things stand (the debug overlay's height view)
  //   tile(r, ch, tx, ty, room)       ground art for one cell, drawn with r(x, y, w, h, color)
  //   up { ch: { rise, draw, wide } } upright objects, depth-sorted with characters (see buildUpright); wide: px
  //                                   the sprite may spill past its tile on each side
  //   box(ch, tx, ty, room)           collision footprint inside the cell (null = whole cell)
  //   interior, roofLift, overTile, canopyTile   houses and the top layer
  //   post(x, room, x0, y0, x1, y1)  optional lighting pass;  mini(ch) PDA map color
  G.THEMES = {};

  // ===== Getting around (shared by the game and the editors' checks) =====
  // A cell a player can stand in: not solid for them, or holding only something small (a lamp pole, a tree trunk).
  // Pools are swimmable and house doors open; everything else solid (gates, breakable walls) blocks.
  // R: anything map-like with at(x, y), overAt(x, y), theme.
  G.walkableCell = (R, x, y) => {
    const T = R.theme, ch = R.at(x, y);
    if (R.overAt(x, y) === 'M') return false;
    if (ch === 'O') return !G.doorLocked(R, x, y); // a locked house door needs a key
    if (T.water && T.water.has(ch)) return true;
    if (!T.solid.has(ch)) return true;
    const b = T.box && T.box(ch, x, y, R);
    return !!b && G.smallObstacle(Array.isArray(b[0]) ? b : [b]);
  };
  // ===== Per-cell variants (the map's `kinds` { "x,y": value }, set in edit mode by clicking a cell again) =====
  // Keycard gates (D) and keycards (8) come in colors, each card opening only the gate of its color (DOOM-style);
  // a house door (O) can be locked (a plain key opens any one); a neighbor (N) has a kind (neighbors.js).
  G.CARD_COLORS = { red: ['#ff3a5a', '#ffc0c8'], blue: ['#3a8aff', '#c0e0ff'], yellow: ['#ffd23a', '#fff4c0'] }; // [color, light]
  G.CARDS = Object.keys(G.CARD_COLORS);

  G.cardColor = (R, x, y) => (G.CARD_COLORS[G.cellKind(R, x, y)] ? G.cellKind(R, x, y) : 'red'); // a gate's or keycard's color
  // Is the house door at (x, y) locked? Side-by-side door cells are one door: locked if any of them is marked
  G.doorLocked = (R, x, y) => {
    if (!R.kinds) return false;
    let a = x; while (R.at(a - 1, y) === 'O') a--;

    return false;
  };
  // Multi-tile pieces (theme.stamps { ch: [w, h] }: a 2x1 trampoline, a 2x2 big tree) are painted as blocks of the
  // same tile. The top-left cell of the block that (tx, ty) belongs to: runs of the tile split into pieces from their
  // start, so two pieces side by side still come apart correctly.
  G.pieceSize = (R, ch) => (R.theme.stamps && R.theme.stamps[ch]) || [1, 1];
  // Blocks (theme.blocks: a car) are one piece however big: every connected cell of the tile, anchored top-left
  const blockCells = (R, tx, ty) => {
    const ch = R.at(tx, ty), out = [], seen = new Set([ty * R.w + tx]), q = [[tx, ty]];
    while (q.length) {
      const [x, y] = q.pop(); out.push([x, y]);
      for (const [a, b] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) if (!seen.has(b * R.w + a) && R.at(a, b) === ch) { seen.add(b * R.w + a); q.push([a, b]); }
    }
    return out;
  };
  G.pieceAnchor = (R, tx, ty) => {
    const ch = R.at(tx, ty);
    if (R.theme.blocks && R.theme.blocks.has(ch)) { const c = blockCells(R, tx, ty); return [Math.min(...c.map((q) => q[0])), Math.min(...c.map((q) => q[1]))]; }
    const [w, h] = G.pieceSize(R, ch), is = (x, y) => R.at(x, y) === ch;

  // Every cell of the piece that (tx, ty) belongs to (just [[tx, ty]] for a plain tile)
  G.pieceCells = (R, tx, ty) => {
    if (R.theme.blocks && R.theme.blocks.has(R.at(tx, ty))) return blockCells(R, tx, ty);
    const ch = R.at(tx, ty), [w, h] = G.pieceSize(R, ch), [ax, ay] = G.pieceAnchor(R, tx, ty), out = [];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (R.at(ax + i, ay + j) === ch) out.push([ax + i, ay + j]);
    return out;
  };
  // Can a jump fly over cell (tx, ty)? A trampoline launch (high) clears tall hedges, hedge fill and leaf canopy, but
  // not houses, brick, gates, cars or big trees (theme.jumpBlock); the pogo (low) only clears half-height things
  // (theme.pogoBlock). Shared by the game (Room.blocksJump) and the editors' checks.
  G.jumpBlockedCell = (R, tx, ty, pogo = false) => {
    const o = R.overAt(tx, ty), T = R.theme;
    if (o === 'R' || (pogo && (o === 'M' || o === 'L'))) return true;
    const set = pogo ? T.pogoBlock || T.jumpBlock : T.jumpBlock;

    const hedgeUp = (r, tx, ty, room) => { drawHedge(r, blockParts(SHORTH, tx, ty, room), 8, HEDGE_LOOK.short, tx, ty); stepShadow(r, tx, ty, room); };

    };
    const hedgeTallUp = (r, tx, ty, room) => drawHedge(r, blockParts(FULLH, tx, ty, room), TALL, HEDGE_LOOK.normal, tx, ty); // maze hedge block
    // Brick hedge 'b': a hedge grown over a brick wall. Unbreakable, and it shows: brick peeks through the leaves.

    const brickHedgeVariant = (tx, ty, room) => {

      }
    };
    const secretUp = (r, tx, ty, room) => drawHedge(r, blockParts(FULLH, tx, ty, room), TALL, HEDGE_LOOK.secret, tx, ty);
    // Patchy hedge: a hedge with torn patches you can break (rockets, bombs, the machete). The tears are laid out in

    const PATCH_STEP = 11; // a candidate tear every 11 px along a run
    // Patchy hedge (breakable), the ZAMN way: the same green hedge as the maze around it, but torn through. Its

    const PATCHY_H = TALL - 4;
    const patchyUp = (r, tx, ty, room) => {
      const parts = blockParts(TALLH, tx, ty, room), q = parts[0], H = PATCHY_H, L = HEDGE_LOOK.normal;

    };

      { base: '#3a3e52', line: '#2c2f40', ridge: '#5e6680', ridge2: '#464c62', edge: '#1c1e2a' }, // slate

          case 'r': { // busted hedge floor: trampled dirt, leaf litter, broken twigs
            grass(r, tx, ty);
            for (let y = 0; y < 16; y += 2) for (let x = 0; x < 16; x += 2) { // blotchy trampled dirt, seamless across cells
              const k = 0.6 * G.hash((tx * 16 + x) >> 3, (ty * 16 + y) >> 3) + 0.4 * G.hash(tx * 16 + x, ty * 16 + y + 5);
              if (k > 0.45) r(x, y, 2, 2, k > 0.8 ? '#33402a' : '#2a3a24');
            }
            for (let i = 0; i < 8; i++) { const h = G.hash(tx * 5 + i, ty * 9 + i * 2); r(1 + Math.floor(h * 13), 1 + Math.floor(G.hash(i * 7, tx + ty) * 13), 2, 1, i < 5 ? ['#2e8a44', '#1f6a34', '#4fae5a'][i % 3] : '#6a4a28'); }
            return bustedEdges(r, tx, ty, room);
          }
          case 't': floorUnder(r, tx, ty, room); return shadow(r, 2, 12, 14, 4); // a tree's shadow, under its crown
          case 'Y': floorUnder(r, tx, ty, room); return bigTreeShadow(r, tx, ty, room);
          case 'l': floorUnder(r, tx, ty, room); return shadow(r, 5, 14, 6, 2);
          case 'm': floorUnder(r, tx, ty, room); return shadow(r, 5, 14, 6, 2);
          case 'g': floorUnder(r, tx, ty, room); return shadow(r, 2, 13, 12, 3);
          case 'a': case 's': case 'j': case '[': return floorUnder(r, tx, ty, room);
          case '%': floorUnder(r, tx, ty, room); return shadow(r, 1, 12, 15, 3);
          case '@': case '!': return floorUnder(r, tx, ty, room);
          case '*': floorUnder(r, tx, ty, room); return sportsGear(r, tx, ty);
          case 'c': { // a car cell: the ground the car is parked on (look past the car to either side), plus its shadow
            floorUnder(r, tx, ty, room);
            return room.at(tx, ty + 1) !== 'c' && shadow(r, 0, 12, 16, 4);
          }
          case 'w': case 'x': case 'v': case 'u': return grass(r, tx, ty);
          case 'p': return pool(r, tx, ty, room);
          default: return grass(r, tx, ty);
        }
      },
      // Streetlight and porch-light pools (stepped rings, SNES style)
      post(x, room, x0, y0, x1, y1) {
        x.save();
        x.beginPath(); x.rect(x0 * 16, y0 * 16, (x1 - x0 + 1) * 16, (y1 - y0 + 1) * 16); x.clip();
        x.globalCompositeOperation = 'lighter';
        for (let ty = 0; ty < room.h; ty++) for (let tx = 0; tx < room.w; tx++) {
          const ch = room.at(tx, ty);
          if ((ch !== 'l' && ch !== 'O') || (ch === 'l' && G.cellKind(room, tx, ty) === 'busted')) continue; // a busted lamp gives no light
          const cx = tx * 16 + (ch === 'l' ? 8 : 13), cy = ty * 16 + (ch === 'l' ? 12 : 18);
          const rings = ch === 'l' ? [46, 34, 22] : [22, 12];
          if (cx + 50 < x0 * 16 || cx - 50 > (x1 + 1) * 16 || cy + 40 < y0 * 16 || cy - 40 > (y1 + 1) * 16) continue;
          for (const rad of rings) {
            x.fillStyle = 'rgba(90,72,30,0.22)';
            x.beginPath(); x.ellipse(cx, cy, rad, rad * 0.62, 0, 0, Math.PI * 2); x.fill();
          }
        }
        x.restore();
      },
      mini(ch) {
        if (STREET.has(ch)) return '#3a3848';
        if (ch === ':') return '#6a6880';
        if ('RHKOWnyqkz'.includes(ch)) return '#7a4a62';
        if ('JSeb'.includes(ch)) return '#4caa58';  // tall hedges: the bright walls of the maze
        if (ch === 'h') return '#2f7c3c';           // short hedges, a step dimmer
        if (ch === 't') return '#1c3a26';
        if (ch === 'Y') return '#2e5a34';           // big trees: a block you go round
        if (ch === 'i' || ch === 'r') return '#1a3424';
        if (ch === 'p') return '#2a6aa8';
        if (ch === 'd') return '#5a3a3a';
        if (ch === '~') return '#4a3a1e';
        if (ch === '^') return '#7a4a62';
        if (ch === '@') return '#a87ab0';           // a zombie crowd
        if (ch === '!') return '#ff6a20';           // fire
        if ('wxvu'.includes(ch)) return '#b0503e';
        if (ch === 'f') return '#9a9ab0';
        if (ch === 'I' || ch === 'V') return '#7a4a28';
        if (ch === 'D') return '#ff3a5a';           // keycard gates stand out in red
        if (ch === 'G') return '#a8743e';
        if (ch === 'o') return '#3a70c0';
        if ('lmgc%'.includes(ch)) return '#8a8aa0';
        if ('asj['.includes(ch)) return '#7a4a62';
        return '#121c16';                            // grass: dark, so walls and paths read
      },
    };
  }
})();
</script>
<script>
/* AFK APOCALYPSE — weapons, items, loot and projectiles (ZAMN-style inventory).

   Pickup weapons carry limited ammo and any crew member can use them.

(function () {
  'use strict';
  const G = window.G;

  // held: how the weapon looks in the player's hands, pointing the way they aim (drawn by Player.drawAim).

    // June: tranquilizer darts. A teen hit goes to sleep where it stands (Zzz): it can't chase, swing or grab a

    tranq: {

      dmg: 1, sleep: 240, sleepMul: 2, cdBase: 16, tapCd: 8, speed: 4, range: 30, // tunable. sleep in ticks; sleepMul: damage a sleeping teen takes from anyone

      dmg: 0.4, rate: 5, range: 15, perk: 20, perkMax: 300, // tunable: damage per drop, fire delay, ticks a drop flies; speed-up ticks a drop gives a teammate, most it builds to

      fire(p, st, dx, dy, w, aimDist) {

        st.shots.push({ kind: 'can', x: p.x + dx * 5, y: p.y + dy * 3, vx: dx * sp, vy: dy * sp, z: 9, vz: 2.6, t: 0, dmg: this.dmg, r: this.radius });

    // Dinner plates: found in kitchen cabinets (search a kitchen counter or a cabinet). Thrown flat, they fly straight,

  // use(p, st) returns true when consumed, or a short reason string when it can't be used
  G.ITEMS = {

  // ===== Full-health perk (a prototype: James wants to try a few versions) =====

  // ===== Projectiles: update returns false when the shot is finished =====

  G.launchBall = (st, tx, ty, vx, vy, speed = 3.6) => {

    dart: {
      update(s, st) {

      draw(ctx, s, v) {
        ctx.fillStyle = s.life > 8 ? '#e8f8ff' : '#90c8e0';
        ctx.fillRect(Math.round(s.x - v.x), Math.round(s.y - v.y - 8 - (s.alt || 0)), 2, 1);
      },
    },
    // A basketball or soccer ball sent flying (a blower gust, a bat): bounces along, hits the first teen it reaches
    // hard, then pops, knocking back (and stinging) the teens round it. Pops on a wall, or when it runs out of steam.
    ball: {
      update(s, st) {
        s.t++; s.x += s.vx; s.y += s.vy; s.vx *= 0.99; s.vy *= 0.99;
        s.z = 2 + Math.abs(Math.sin(s.t / 5)) * 7;
        const W = G.WEAPONS.blower, pop = () => {
          st.burst(s.x, s.y - 4, 10, s.ball === 'basket' ? ['#e07030', '#3a1a10', '#ffffff'] : ['#f0f0f8', '#1a1a20', '#ffffff'], 1.6, 6, 18, true);
          for (const t of st.targets()) {
            const d = Math.hypot(t.x - s.x, t.y - s.y);
            if (d > 22) continue;
            t.hit(st, W.ballPop, s.x, s.y);
            if (t.kx !== undefined) { t.kx += ((t.x - s.x) / (d || 1)) * 3; t.ky += ((t.y - s.y) / (d || 1)) * 3; }
          }
          st.floater(s.x, s.y - 20, 'POP!', '#ffffff'); st.shake(3, 1); G.sfx.play('crack');
          return false;
        };
        if (st.room.blocksShot(s.x, s.y) || --s.life <= 0 || Math.hypot(s.vx, s.vy) < 0.8) return pop();
        const t = hitTarget(st, s.x, s.y, 8);
        if (t) { t.hit(st, s.dmg, s.x, s.y); return pop(); }
        return true;
      },
      draw(ctx, s, v) {
        groundShadow(ctx, s, v);
        const x = Math.round(s.x - v.x), y = Math.round(s.y - v.y - s.z), bb = s.ball === 'basket';
        ctx.fillStyle = '#140c1c'; ctx.fillRect(x - 3, y - 3, 6, 6);
        ctx.fillStyle = bb ? '#e07030' : '#f0f0f8'; ctx.fillRect(x - 2, y - 2, 4, 4);
        ctx.fillStyle = bb ? '#3a1a10' : '#1a1a20'; if ((s.t >> 2) & 1) ctx.fillRect(x - 2, y, 4, 1); else ctx.fillRect(x, y - 2, 1, 4);
      },
    },
    plate: {
      update(s, st) {
        s.t++; s.x += s.vx; s.y += s.vy;
        if (s.t > s.life) { s.z -= 1.2; s.vx *= 0.9; s.vy *= 0.9; } // out of steam: it drops
        const shatter = () => { st.burst(s.x, s.y, 10, ['#ffffff', '#e8e8f0', '#3a70c0'], 1.4, Math.max(1, s.z), 18, true); G.sfx.play('crack'); return false; };
        if (s.z <= 0 || st.room.blocksShot(s.x, s.y)) return shatter();
        const t = hitTarget(st, s.x, s.y, 7);
        if (t) { t.hit(st, s.dmg, s.x, s.y); return shatter(); }
        return true;
      },
      draw(ctx, s, v) { // a white plate with a blue rim, spinning flat
        groundShadow(ctx, s, v);
        const x = Math.round(s.x - v.x), y = Math.round(s.y - v.y - s.z), wide = (s.t >> 2) & 1;
        ctx.fillStyle = '#1a1a28'; ctx.fillRect(x - (wide ? 4 : 3), y - 2, wide ? 8 : 6, 4);
        ctx.fillStyle = '#3a70c0'; ctx.fillRect(x - (wide ? 3 : 2), y - 1, wide ? 6 : 4, 2);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x - (wide ? 2 : 1), y - 1, wide ? 4 : 2, 1);
      },
    },
    // Lou's skillet: out, then back to its owner (over walls on the way back, like it's been thrown high)
    skillet: {
      update(s, st) {
        s.t++;
        const o = s.owner;
        if (!s.back) {
          s.x += s.vx; s.y += s.vy;
          const wall = st.room.blocksShot(s.x, s.y);
          if (wall) { s.x -= s.vx; s.y -= s.vy; st.burst(s.x, s.y, 5, ['#ffffff', '#8a8aa0'], 1, 9, 10); G.sfx.play('clang'); }
          if (wall || s.t >= s.out) { s.back = true; s.hits.clear(); }
        } else {
          if (!o || o.dead) return false;
          const dx = o.x - s.x, dy = o.y - s.y, d = Math.hypot(dx, dy), sp = Math.min(d, 2 + Math.min(2.4, (s.t - s.out) * 0.12));
          if (d < 7) return false; // caught
          s.x += (dx / d) * sp; s.y += (dy / d) * sp;
        }
        if (s.t > 400) return false;
        for (const t of st.targets()) if (!s.hits.has(t) && Math.abs(s.x - t.x) < 8 && Math.abs(s.y - (t.y - 2)) < 8) { s.hits.add(t); t.hit(st, s.dmg, s.x, s.y); G.sfx.play('clang'); }
        return true;
      },
      draw(ctx, s, v) { // a spinning pan: round, dark, with its handle going round
        groundShadow(ctx, s, v);
        const x = Math.round(s.x - v.x), y = Math.round(s.y - v.y - 10), k = (s.t >> 2) & 3, hx = [4, 0, -4, 0][k], hy = [0, 3, 0, -3][k];
        ctx.fillStyle = '#140c1c'; ctx.fillRect(x - 4, y - 3, 8, 6); ctx.fillRect(x + hx - 1 - (hx < 0 ? 2 : 0), y + hy - 1 - (hy < 0 ? 2 : 0), hx ? 5 : 3, hy ? 5 : 3);
        ctx.fillStyle = '#6a4a2a'; ctx.fillRect(x + hx - (hx < 0 ? 2 : 0), y + hy - (hy < 0 ? 2 : 0), hx ? 3 : 1, hy ? 3 : 1);
        ctx.fillStyle = '#3a3a48'; ctx.fillRect(x - 3, y - 2, 6, 4);
        ctx.fillStyle = '#6a6a7a'; ctx.fillRect(x - 2, y - 2, 4, 1);
      },
    },
    // Root's EMP: an arc of radius r spreading out from where it was fired, zapping whoever the band passes over
    emp: {
      update(s, st) {
        s.r += 2.6;
        if (s.r > s.rMax) return false;
        for (const t of st.targets()) {
          if (s.hits.has(t)) continue;
          const dx = t.x - s.x, dy = t.y - 2 - s.y, d = Math.hypot(dx, dy);
          if (Math.abs(d - s.r) > 5 || Math.abs(angDiff(Math.atan2(dy, dx), s.a)) > s.spread) continue;
          let clear = true; // walls stop the wave
          for (let i = 1, n = Math.ceil(d / 4); i < n && clear; i++) if (st.room.blocksShot(s.x + (dx * i) / n, s.y + (dy * i) / n)) clear = false;
          if (!clear) continue;
          s.hits.add(t); t.hit(st, s.dmg, t.x, t.y - 4);
          if (t.stun && s.zap > 0) t.stun(st, s.zap, 'zap');
        }
        return true;
      },
      draw(ctx, s, v) {
        const n = Math.ceil(s.spread * s.r / 3), fade = s.r > s.rMax * 0.7;
        for (let i = 0; i <= n; i++) {
          const a = s.a - s.spread + (2 * s.spread * i) / Math.max(1, n), x = s.x + Math.cos(a) * s.r, y = s.y + Math.sin(a) * s.r * 0.8;
          ctx.fillStyle = i % 2 ? (fade ? '#1e8a5a' : '#38f0a0') : fade ? '#3a8a8a' : '#c8fff0';
          ctx.fillRect(Math.round(x - v.x), Math.round(y - v.y - 8 - (s.alt || 0)), 2, 1);
        }
      },
    },
    // Ted's foil stars: small, spinning, short range
    star: {
      update(s, st) {
        s.t++; s.x += s.vx; s.y += s.vy;
        if (--s.life <= 0) return false;
        if (st.room.blocksShot(s.x, s.y)) { st.burst(s.x - s.vx, s.y - s.vy, 3, ['#ffffff', '#c8c8d8'], 0.8, 9, 8); return false; }
        const t = hitTarget(st, s.x, s.y);
        if (t) { t.hit(st, s.dmg, s.x, s.y); return false; }
        return true;
      },
      draw(ctx, s, v) {
        groundShadow(ctx, s, v);
        const x = Math.round(s.x - v.x), y = Math.round(s.y - v.y - 9 - (s.alt || 0)), k = (s.t >> 2) & 1;
        ctx.fillStyle = '#140c1c'; ctx.fillRect(x - 2, y - 2, 5, 5);
        ctx.fillStyle = '#c8c8d8';
        if (k) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); } else { ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x + 1, y - 1, 1, 1); ctx.fillRect(x - 1, y + 1, 1, 1); ctx.fillRect(x + 1, y + 1, 1, 1); }
        ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 1, 1);
      },
    },
    // Dot's coffee: drops in a short arc that splash where they land
    drop: {
      update(s, st) {
        s.x += s.vx; s.y += s.vy; s.z += s.vz; s.vz -= 0.18; s.vx *= 0.97; s.vy *= 0.97;
        if (--s.life <= 0 || s.z <= 0 || st.room.blocksShot(s.x, s.y)) { st.burst(s.x, s.y, 2, ['#8a5030', '#c89060'], 0.6, 1, 10, true); return false; }
        const t = hitTarget(st, s.x, s.y, 7);
        if (t) { t.hit(st, s.dmg, s.x, s.y); st.burst(s.x, s.y, 2, ['#ffffff', '#c89060'], 0.8, 9, 8); return false; }
        const mate = st.players.find((p) => p !== s.owner && !p.dead && Math.abs(s.x - p.x) < 7 && Math.abs(s.y - (p.y - 2)) < 7);
        if (mate) { // a teammate gets splashed: perked up (faster), never hurt
          const W = G.WEAPONS.splash, was = mate.buzz || 0;
          mate.buzz = Math.min(W.perkMax, was + W.perk);
          if (was <= 0) st.floater(mate.x, mate.y - 30, 'PERKED UP!', '#ffd23a');
          st.burst(s.x, s.y, 2, ['#ffd23a', '#c89060'], 0.8, 9, 8);
          return false;
        }
        return true;
      },
      draw(ctx, s, v) {
        const x = Math.round(s.x - v.x), y = Math.round(s.y - v.y - s.z);
        ctx.fillStyle = '#2a1008'; ctx.fillRect(x - 1, y - 1, 4, 4);
        ctx.fillStyle = '#7a4020'; ctx.fillRect(x, y, 2, 2);
        ctx.fillStyle = '#e0b080'; ctx.fillRect(x, y, 1, 1);
        if (s.life % 5 === 0) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(x, y - 3, 1, 1); } // steam
      },
    },
    rocket: {
      update(s, st) {
        s.t++;
        s.spd = Math.min(5.2, s.spd * 1.08 + 0.04);
        let best = null, bd = 1e9;
        for (const t of st.targets()) {
          const vx = t.x - s.x, vy = t.y - 2 - s.y, d = Math.hypot(vx, vy);
          const da = angDiff(Math.atan2(vy, vx), s.a);
          if (d < 150 && Math.abs(da) < 0.7 && d < bd) { bd = d; best = da; }
        }
        if (best !== null) s.a += G.clamp(best, -0.06, 0.06);
        s.a += Math.sin(s.t * 0.7) * 0.05;
        const ux = Math.cos(s.a), uy = Math.sin(s.a);
        s.x += ux * s.spd; s.y += uy * s.spd;
        st.burst(s.x - ux * 5, s.y - uy * 5, 1, ['#ffd23a', '#ff8a2a', '#ffffff'], 0.3, 9, 10);
        const wall = st.room.blocksShot(s.x, s.y);
        if (--s.life <= 0 || wall || hitTarget(st, s.x, s.y, 7)) {
          st.explode(s.x - (wall ? ux * s.spd : 0), s.y - (wall ? uy * s.spd : 0), s.r, s.dmg, { rocket: true });
          return false;
        }
        return true;
      },
      draw(ctx, s, v) {
        groundShadow(ctx, s, v);
        stick(ctx, s.x, s.y, Math.cos(s.a), Math.sin(s.a), ['#ffd23a', '#ff3a5a', '#ff3a5a', '#b07a48', '#b07a48'], 9 + (s.alt || 0), v);
      },
    },
  };
})();

        [...row].forEach((ch, x) => {

          if (ch === 'G') this.doors.push({ tx: x, ty: y, open: false, latch: true }); // latch gate: opens one way
