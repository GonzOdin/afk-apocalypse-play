      this.launchInto.clear();
      if (!this.jumper || !R.theme.bounce) return;
      const done = new Set(); // each trampoline's four launches (the same 3 tiles from the mat's middle a player gets)
      for (let y = 0; y < R.h; y++) for (let x = 0; x < R.w; x++) {
        if (!R.theme.bounce.has(R.at(x, y))) continue;
        const [ax, ay] = G.trampAnchor(R, x, y), key = ay * R.w + ax;
        if (done.has(key)) continue;
        done.add(key);
        const cx = ax * 16 + 16, cy = ay * 16 + G.TRAMP.feet, cells = G.pieceCells(R, x, y).map(([a, b]) => b * R.w + a);
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          let clear = true;
          for (let s = 4; s <= 48 && clear; s += 4) if (R.blocksJump(cx + dx * s, cy + dy * s - 2)) clear = false;
          const lx = Math.floor((cx + dx * 48) / 16), ly = Math.floor((cy + dy * 48 - 3) / 16);
          if (!clear || lx < 0 || ly < 0 || lx >= R.w || ly >= R.h || !this.open[ly * R.w + lx]) continue;
          const k = ly * R.w + lx;
          if (!this.launchInto.has(k)) this.launchInto.set(k, []);
          this.launchInto.get(k).push(...cells);
        }
      }
    }
    rebuild(players) {
      const R = this.room, W = R.w, d = this.dist, q = this.queue;
      d.fill(-1);
      let head = 0, tail = 0;
      for (const p of players) {
        if (p.dead) continue;
        const i = Math.floor((p.y - 3) / 16) * W + Math.floor(p.x / 16);
        if (i >= 0 && i < d.length && d[i] < 0) { d[i] = 0; q[tail++] = i; }
      }
      while (head < tail) {
        const i = q[head++], x = i % W, y = (i - x) / W, nd = d[i] + 1;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= R.h) continue;
          const j = ny * W + nx;
          if (d[j] >= 0 || !this.open[j]) continue;
          if (dx && dy && (!this.open[y * W + nx] || !this.open[ny * W + x])) continue;
          d[j] = nd; q[tail++] = j;
        }
        const launchers = this.jumper && this.launchInto.get(i); // jumpers: the trampolines that land you here
        if (launchers) for (const j of launchers) if (d[j] < 0) { d[j] = nd; q[tail++] = j; }
      }
    }
    // Is there any way from this point to a player? (its cell, or a neighbor, has a distance)
    reachable(px, py) {
      const R = this.room, W = R.w, x = Math.floor(px / 16), y = Math.floor(py / 16);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < W && ny < R.h && this.dist[ny * W + nx] >= 0) return true;
      }
      return false;
    }
    // The center of the neighboring cell that's one step closer to a player, or null (no path / already there)
    stepFrom(px, py) {
      const R = this.room, W = R.w, x = Math.floor(px / 16), y = Math.floor(py / 16), here = this.dist[y * W + x];
      let best = here >= 0 ? here : 32767, bx = -1, by = -1;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if ((!dx && !dy) || nx < 0 || ny < 0 || nx >= W || ny >= R.h) continue;
        const v = this.dist[ny * W + nx];
        if (v < 0 || v >= best) continue;
        if (dx && dy && (!this.open[y * W + nx] || !this.open[ny * W + x])) continue;
        best = v; bx = nx; by = ny;
      }
      return bx < 0 ? null : { x: bx * 16 + 8, y: by * 16 + 8 };
    }
  }
  G.FlowField = FlowField;

  // ===== Spawning (ZAMN-style: enemies keep rising from the ground near you) =====
  // One level-wide timer paces the spawns (so 18 spawn points don't mean 18x the enemies). When it runs out, a random
  // spawn point near a player (but not right on top of them) that hasn't been used lately sends the next enemy.
  // Level config (levels.js `enemies`), merged over these defaults:
  //   cap    most enemies alive at once          every  [min, max] ticks between spawns
  //   grace  quiet ticks at the start            near   [min, max] px from the nearest player
  //   types  { enemyType: weight }               rest   ticks a spawn point waits before it's used again
  //   safe   radius (px) of the safe zone around the player start: no spawns, no enemies, no chasing in it
  //   linger ticks an enemy can go without chasing anyone before it sinks back into the ground (keeps spawns fresh)
  //   neighborBuffer  px: no enemy rises this close to a neighbor who's still waiting (so you have a chance to reach them)
  // ===== Difficulty (an option: title screen and pause menu; the host's counts online) =====
  // Multiplies what tuning.js and each level set. speed: walk speed; sight: notice / give-up / feel ranges; cap and
  // every: how many at once and how often they rise; hunt: ticks a fresh riser comes for you whatever its give-up
  // range (null = the level's own); aggro: whether a fresh riser comes for you at all, or just looks around first.
  G.DIFFICULTY = {
    easy: { name: 'EASY', speed: 0.8, sight: 0.7, cap: 0.6, every: 1.4, hunt: 0, aggro: false, desc: 'SLOWER, LATE TO NOTICE YOU' },
    normal: { name: 'NORMAL', speed: 0.9, sight: 0.85, cap: 0.85, every: 1.15, hunt: 180, aggro: true, desc: 'THE WAY IT SHOULD FEEL' },
    hard: { name: 'HARD', speed: 1, sight: 1, cap: 1, every: 1, hunt: null, aggro: true, desc: 'RISERS HUNT YOU DOWN' },
  };
  G.DIFF_ORDER = Object.keys(G.DIFFICULTY);
  G.diff = () => G.DIFFICULTY[G.opts().diff] || G.DIFFICULTY.normal;
  G.ENEMY_DEFAULTS = { cap: 6, every: [80, 160], grace: 240, near: [56, 220], rest: 360, safe: 112, linger: 600, neighborBuffer: 80, types: { phoneTeen: 1 } };
  class Spawner {
    constructor(x, y) { this.x = x; this.y = y; this.rest = 0; }
  }
  G.Spawner = Spawner;
  function spawnTick(st, cfg) {
    for (const s of st.spawners) if (s.rest > 0) s.rest--;
    if (st.spawnT > 0) { st.spawnT--; return; }
    const D = G.diff();
    if (st.enemies.length >= (cfg.cap > 0 ? Math.max(1, Math.round(cfg.cap * D.cap)) : 0)) return; // (a cap of 0 stays 0)
    const ok = st.spawners.filter((s) => {
      if (s.rest > 0 || st.inSafeZone(s.x, s.y, 24)) return false; // never in (or right at the edge of) the safe zone
      if ((st.neighbors || []).some((n) => !n.gone && Math.hypot(n.x - s.x, n.y - s.y) < cfg.neighborBuffer)) return false; // give neighbors a fair chance
      let near = Infinity;
      for (const p of st.players) if (!p.dead) near = Math.min(near, Math.hypot(p.x - s.x, p.y - s.y));
      return near >= cfg.near[0] && near <= cfg.near[1];
    });
    if (!ok.length) return;
    const s = G.pick(ok);
    const e = new Enemy(G.weightedPick(cfg.types), s.x + G.rand(-4, 4), s.y + G.rand(-2, 2));
    if (!e.flying && st.room.boxHits(e.x, e.y, e.hw, e.hh, e)) { e.x = s.x; e.y = s.y; }
    e.aggro = D.aggro; // it rose because you're near: it comes for you (and gives up if you get far enough away); on EASY it looks around first
    const hunt = cfg.hunt === true ? 600 : cfg.hunt || 0, h = D.hunt === null ? hunt : Math.min(hunt, D.hunt);
    if (h && D.aggro) e.huntT = h; // hunt: for this long it keeps coming whatever its give-up range
    st.enemies.push(e);
    G.sfx.play(e.bot || e.glitch ? 'beep' : 'rise');
    s.rest = cfg.rest;
    st.spawnT = Math.round(G.randi(cfg.every[0], cfg.every[1]) * D.every);
  }

  // ===== Grip: enemies on you slow you down =====
  // Total drag on player p: every solid enemy close enough to swipe at you adds its drag, so the more of them have
  // you surrounded, the harder it is to move. 0 = free, 1 = held still (capped). Enemies without a swipe grab at
  // GRIP_REACH px.
  const GRIP_REACH = 16;
  G.gripOn = (st, p) => {
    let drag = 0;
    for (const e of st.enemies) {
      if (!e.grip || e.dead || e.rise > 0 || e.sink || e.stunT > 0) continue; // asleep: it lets go
      const reach = e.tune.swipe ? e.tune.swipe.reach : GRIP_REACH;
      if (Math.hypot(e.x - p.x, (e.y - p.y) * 1.6) < reach) drag += e.grip.drag;
    }
    return Math.min(1, drag);
  };

  // ===== Soft bodies =====
  // Enemies and players can't overlap. Bodies are ellipses (squashed top-down, since the view is at an angle).
  //  - An enemy walking into a player stops; it never shoves the player (a crowd can't pin you by walking).
  //  - A player walking into an enemy mostly stops and slides round it, nudging it aside a little (PLAYER_SHOVE).
  //  - A dashing player passes straight through. Enemies rising or sinking aren't solid yet.
  //  - Enemies block each other (split evenly), so they queue in narrow corridors instead of stacking.
  const BODY_R = 7, ENEMY_GAP = 8, SQUASH = 1.6, PLAYER_SHOVE = 0.2;
  const solidBody = (e) => !e.dead && e.rise <= 0 && !e.sink && !e.flying; // (drones fly over everyone)
  // How far a and b overlap along their separating direction: { nx, ny, d } (unit normal from b to a), or null
  const overlap = (a, b, r) => {
    const dx = a.x - b.x, dy = (a.y - b.y) * SQUASH, d = Math.hypot(dx, dy);
    if (d >= r) return null;
    return d > 0.01 ? { nx: dx / d, ny: dy / d / SQUASH, d: r - d } : { nx: 1, ny: 0, d: r };
  };
  function resolveBodies(st) {
    for (const p of st.players) {
      if (p.dead || p.dashT > 0 || p.jump) continue;
      for (const e of st.enemies) {
        if (!solidBody(e)) continue;
        const o = overlap(p, e, BODY_R); // normal points from the enemy to the player
        if (!o) continue;
        const into = -(p.pushX * o.nx + p.pushY * o.ny) > 0.2; // is the player pushing toward it?
        const pShare = into ? 1 - PLAYER_SHOVE : 0;
        if (pShare) G.moveEntity(st.room, p, o.nx * o.d * pShare, o.ny * o.d * pShare);
        G.moveEntity(st.room, e, -o.nx * o.d * (1 - pShare), -o.ny * o.d * (1 - pShare));
      }
    }
    for (let i = 0; i < st.enemies.length; i++) {
      const a = st.enemies[i];
      if (!solidBody(a)) continue;
      for (let j = i + 1; j < st.enemies.length; j++) {
        const b = st.enemies[j];
        if (!solidBody(b)) continue;
        const o = overlap(a, b, ENEMY_GAP);
        if (!o) continue;
        G.moveEntity(st.room, a, o.nx * o.d * 0.5, o.ny * o.d * 0.5);
        G.moveEntity(st.room, b, -o.nx * o.d * 0.5, -o.ny * o.d * 0.5);
      }
    }
  }

  // Runs all enemies for a stage: spawning, the flow field, updates, clean-up, soft bodies. The stage owns st.enemies.
  G.updateEnemies = (st, cfg) => {
    if (!st.flow) { st.flow = new FlowField(st.room); st.flowJump = new FlowField(st.room, true); }
    if (st.t % 15 === 0) { st.flow.rebuild(st.players); st.flowJump.rebuild(st.players); }
    spawnTick(st, cfg);
    for (const e of st.enemies) {
      if (G.Debug && G.Debug.drag && G.Debug.sel === e) continue; // held still while you drag its ring in the debug overlay
      e.update(st);
      // far from everyone for 5 seconds: quietly remove it (its spawner will send another when you come back)
      let near = Infinity;
      for (const p of st.players) if (!p.dead) near = Math.min(near, Math.hypot(p.x - e.x, p.y - e.y));
      e.farT = near > 420 ? e.farT + 1 : 0;
      if (e.farT > 300) e.dead = true;
      // not chasing anyone for cfg.linger ticks: sink back into the ground, so fresh ones can rise near the players
      e.calmT = e.aggro || e.noLinger || e.rise > 0 || e.sink > 0 ? 0 : e.calmT + 1;
      if (e.calmT > cfg.linger && !e.sink) { e.sink = SINK; if (st.onScreen(e.x, e.y)) G.sfx.play('rise'); }
    }
    for (const e of st.enemies) if (e.dead && e.bag && e.bag.length) { // a mop bot's loot comes back out, whether it was destroyed or left
      for (const kind of e.bag) st.pickups.push(new G.Pickup(kind, e.x + G.rand(-6, 6), e.y + G.rand(-3, 3), { pop: true }));
      e.bag.length = 0;
    }
    G.compact(st.enemies, (e) => !e.dead);
    resolveBodies(st);
    if (st.wet) for (const [i, t] of st.wet) if (t <= 1) st.wet.delete(i); else st.wet.set(i, t - 1); // wet floor dries
  };

  // Put one enemy of `type` near player p (debug panel and test room): a free spot 48-80 px away it can walk to,
  // aware of you from the start. Ignores the cap. Returns it, or null if there was no room.
  G.spawnEnemyNear = (st, type, p = st.players.find((q) => !q.dead)) => {
    if (!p || !G.ENEMY_TYPES[type]) return null;
    const flying = !!G.ARCHETYPES[G.ENEMY_TYPES[type].archetype].stats.flying, R = st.room;
    if (!st.flow) { st.flow = new FlowField(R); st.flowJump = new FlowField(R, true); }
    st.flow.rebuild(st.players); // (fresh, so "can it walk to you" is right even on a level's first ticks)
    for (let k = 0; k < 60; k++) {
      const a = G.rand(0, Math.PI * 2), d = G.rand(48, 80), x = p.x + Math.cos(a) * d, y = p.y + Math.sin(a) * d * 0.8;
      if (x < 16 || y < 16 || x > R.pw - 16 || y > R.ph - 16) continue;
      if (!flying && (R.boxHits(x, y, 4, 4) || (st.flow && !st.flow.reachable(x, y - 3)))) continue;
      const e = new Enemy(type, x, y);
      e.provoked = true;
      st.enemies.push(e);
      G.sfx.play(e.bot ? 'beep' : 'rise');
      return e;
    }
    return null;
  };
})();
</script>
<script>
/* AFK APOCALYPSE — the weapon practice range (title: WEAPON PRACTICE, map `range`, def G.PRACTICE in levels.js).
   You get every weapon and item and they never run out (G.practiceKit, topped up every tick); practice targets stand
   in the lanes; floor buttons ($ markers, G.SpawnButton) bring enemies up in the fenced arena for live practice.
   A button's kind is the map's `kinds` at its cell: an enemy type id, 'robot' (any robot), or 'clear'. */
(function () {
  'use strict';
  const G = window.G;

  // ===== Everything to try, never running out =====
  // Your own signature weapon stays first; then every pickup weapon, then the rest of the crew's signature weapons.
  const ORDER = () => {
    const W = G.WEAPONS, ids = Object.keys(W);
    return [...ids.filter((id) => !W[id].signature), ...ids.filter((id) => W[id].signature)];
  };
  const ITEMS = ['pie', 'coffee', 'bomb', 'pogo']; // (not the PDA: practice has no map to show)
  const itemMax = (id) => G.ITEMS[id].max || G.ITEM_STACK;
  G.practiceKit = (p, first) => {
    for (const id of ORDER()) {
      const d = G.WEAPONS[id];
      let w = p.weapons.find((k) => k.id === id);
      if (!w) { if (!first && d.signature) continue; w = { id, lv: 1, ammo: d.max }; p.weapons.push(w); } // (dropped weapons come back below)
      w.ammo = d.max;
    }
    for (const id of ITEMS) {
      const it = p.items.find((k) => k.id === id);
      if (it) it.n = itemMax(id); else p.items.push({ id, n: itemMax(id) });
    }
    if (p.lives < 3) p.lives = 3; // nobody runs out of lives here
  };

  // ===== Spawn buttons =====
  const BUTTON = {
    phoneTeen: { label: 'TEEN', col: '#e83040' },
    sprinter: { label: 'SPRINTER', col: '#ff8a2a' },
    robot: { label: 'ROBOT', col: '#3ad0ff' },
    clone: { label: 'CLONE', col: '#ff5ab0' },
    clear: { label: 'CLEAR', col: '#38f0a0' },
  };
  G.SPAWN_BUTTONS = BUTTON;
  const MOST = 12; // live enemies at once
  const isBot = (t) => !!G.ARCHETYPES[G.ENEMY_TYPES[t].archetype].stats.bot;
  class SpawnButton {
    constructor(x, y, kind) { this.x = x; this.y = y; this.kind = kind || 'phoneTeen'; this.down = false; this.flash = 0; }
    get look() { return BUTTON[this.kind] || { label: (G.ENEMY_TYPES[this.kind] || { name: '?' }).name, col: '#e83040' }; }
    on(p) { return !p.dead && !p.jump && !(p.z > 0) && Math.abs(p.x - this.x) < 8 && Math.abs(p.y - this.y) < 7; }
    update(st) {
      if (this.flash > 0) this.flash--;
      const down = st.players.some((p) => this.on(p));
      if (down && !this.down) this.press(st);
      this.down = down; // step off and on again for another
    }
    press(st) {
      this.flash = 12;
      G.sfx.play('blip');
      if (this.kind === 'clear') {
        for (const e of st.enemies) st.burst(e.x, e.y - 8, 10, ['#ffffff', '#c8c0e0', '#38f0a0'], 1.2, 10, 18);
        if (st.enemies.length) G.sfx.play('poof');
        st.floater(this.x, this.y - 24, st.enemies.length ? 'ALL CLEAR' : 'NOBODY HERE', '#38f0a0');
        st.enemies.length = 0;
        return;
      }
      if (st.enemies.length >= MOST) { G.sfx.play('deny'); st.floater(this.x, this.y - 24, 'THAT\'S PLENTY', '#ff3a5a'); return; }
      const types = Object.keys(G.ENEMY_TYPES);
      const type = this.kind === 'robot' ? G.pick(types.filter(isBot)) : G.ENEMY_TYPES[this.kind] ? this.kind : 'phoneTeen';
      const far = st.spawners.filter((s) => st.players.every((p) => Math.hypot(p.x - s.x, p.y - s.y) > 56));
      const s = G.pick(far.length ? far : st.spawners);
      const e = s ? new G.Enemy(type, s.x, s.y) : G.spawnEnemyNear(st, type);
      if (!e) { G.sfx.play('deny'); return; }
      if (s) { st.enemies.push(e); G.sfx.play(e.bot || e.glitch ? 'beep' : 'rise'); }
      e.provoked = true; e.aggro = true; e.huntT = 900; // it comes for you
      st.floater(this.x, this.y - 24, G.ENEMY_TYPES[type].name, this.look.col);
    }
    // A big arcade button set into the floor, its label over it (drawn flat, under everyone)
    drawFloor(ctx, v, label = true) {
      const sx = Math.round(this.x - v.x), sy = Math.round(this.y - v.y), L = this.look, d = this.down ? 1 : 0;
      ctx.fillStyle = '#140c1c'; ctx.fillRect(sx - 8, sy - 7, 16, 11);
      ctx.fillStyle = '#5a5a70'; ctx.fillRect(sx - 7, sy - 6, 14, 9);
      ctx.fillStyle = '#8a8aa0'; ctx.fillRect(sx - 7, sy - 6, 14, 1);
      ctx.fillStyle = '#34344a'; ctx.fillRect(sx - 7, sy + 2, 14, 1);
      const top = sy - 6 + d, col = this.flash > 0 && (this.flash >> 1) & 1 ? '#ffffff' : L.col;
      ctx.fillStyle = '#140c1c'; ctx.fillRect(sx - 5, top, 10, 7 - d); ctx.fillRect(sx - 4, top - 1, 8, 1);
      ctx.fillStyle = G.shade(L.col, -0.35); ctx.fillRect(sx - 4, top + 3, 8, 3 - d);
      ctx.fillStyle = col; ctx.fillRect(sx - 4, top, 8, 3); ctx.fillRect(sx - 3, top - 1 + 1, 6, 1);
      if (!d) { ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 3, top, 2, 1); } // shine
      if (label) G.text(L.label, sx, sy - 16, L.col, { align: 'center', shadow: '#140c1c', ctx });
    }
  }
  G.SpawnButton = SpawnButton;
})();
</script>
<script>
/* AFK APOCALYPSE — debug overlay for tuning enemies. Press \ (backslash) in a level, or open with ?debug.
 *
 *   yellow        notice range: come this close (inside the cone, for enemies that have one) and it chases you
 *   small ring    "feel" range: this close it notices you whichever way it's facing
 *   grey ring     give-up range: get this far away and it loses interest
 *   red line      who it's chasing
 *   label         what it's doing: RISE, PHONE, SWIPE, LUNGE, CHASE, HURRY (a fast chase), MOSEY 7S (seconds
 *                 until it sinks back into the ground if it doesn't spot anyone), SINK
 *   cyan +        enemy spawn points (Z markers); bright when one could spawn there right now
 *   green ring    the safe zone around the player start
 *   H (or the HEIGHTS button): the height view. Each solid tile gets a column of purple diamonds, one per half unit
 *                 (8 px) it stands (theme.heights; 6+ shows a +), over a bar: green = the pogo clears it, yellow = only
 *                 a trampoline launch clears it, red = no jump clears it
 *
 * Mouse (debug mode only, not while editing the map):
 *   click an enemy         select it: its archetype is the one being tuned; it's outlined and only its rings show
 *   drag its yellow ring   set the notice range          drag its grey ring   set the give-up range
 *   mouse wheel            vision cone wider / narrower (for enemies that have one)
 *   click empty ground     deselect
 *
 * Side panel (while debug is on), in tabs: SPAWN (this level's spawning and mix, plus buttons that put any enemy near
 * you), SIGHT, MOVE, FIGHT and TRICKS (every enemy kind's numbers), each with - / + buttons. Save writes them all to src/tuning.js through the dev server (refused if
 * tuning.js changed since this page loaded, like map saves). Rows come from the TABS table below: to make another
 * number tunable, put it in tuning.js and add a row.
 *
 * Keys (aren't used by gameplay, so tuning never fires, dashes or swaps):
 *   - / =    notice range -/+ 10 px
 *   9 / 0    give-up range -/+ 10 px
 *   7 / 8    vision cone narrower / wider (10 degrees per press; 360 = full circle)
 *   1, 2...  which enemy kind the keys change (in archetype order: 1 shambler = phone teen, 2 rusher = sprinter,
 *            3 flyer = delivery drone, 4 hound = robo dog, 5 mimic = deepfake, 6 sweeper = mop bot)
 */
(function () {
  'use strict';
  const G = window.G, I = G.input;

  const D = (G.Debug = { on: false, kind: 0, sel: null, drag: null, tab: 'SIGHT', heights: false });
  try { D.tab = localStorage.getItem('afk-apocalypse/debug-tab') || D.tab; } catch (e) { /* storage blocked */ }
  const kinds = () => Object.keys(G.ARCHETYPES);
  const tuneOf = (kind) => G.ENEMY_TUNING[kind];
  const targetOpts = (kind) => tuneOf(kind).sight;

  // ---- What's tunable, tab by tab. A row edits tuning[kind][g][k] (or tuning[kind][k] without g), in `step`s,
  // kept between min and max (numbers, or functions of the kind's tuning for limits that depend on each other).

      b.blur(); // so Space in the game never re-presses it
      if (b.id === 'dp-save') return save();
      if (b.id === 'dp-heights') { D.heights = !D.heights; return; }
      if (b.dataset.tab) { D.tab = b.dataset.tab; shownSig = null; try { localStorage.setItem('afk-apocalypse/debug-tab', D.tab); } catch (e) { /* fine */ } }
      if (b.dataset.kind) { D.kind = kinds().indexOf(b.dataset.kind); D.sel = null; adjust(b.dataset.kind, b.dataset.row, +b.dataset.dir); }
      if (b.dataset.spawn && G.state.def && G.state.def.enemies) adjustSpawn(G.state, b.dataset.spawn, +b.dataset.dir * +b.dataset.step);
      if (b.dataset.spawnnow && G.state instanceof G.Stage && !G.state.remote) { // put one near you (ignores the cap)
        const e = G.spawnEnemyNear(G.state, b.dataset.spawnnow);
        if (e) select(e); else G.toast('NO ROOM NEAR YOU', 60);
      }
    });
    savedSig = sig();
  }
  const row = (attrs, name, value) => '<div class="dp-row"><span>' + name + '</span><button ' + attrs + ' data-dir="-1">\u2212</button>' +
    '<b>' + value + '</b><button ' + attrs + ' data-dir="1">+</button></div>';
  function syncPanel(show, st) {
    if (!panel && show) buildPanel();
    if (!panel) return;
    if (document.body.classList.contains('debugging') !== show) { document.body.classList.toggle('debugging', show); G.layout(); }
    if (!show) return;
    const now = sig() + D.kind + D.tab + (st ? st.enemies.length : '');
    if (now === shownSig) return; // only touch the DOM when something changed
    shownSig = now;
    panel.querySelector('#dp-tabs').innerHTML = TAB_NAMES.map((t) => '<button data-tab="' + t + '"' + (t === D.tab ? ' class="on"' : '') + '>' + t + '</button>').join('');
    let html = '';
    if (D.tab === 'SPAWN') {
      const c = st && st.def.enemies ? { ...G.ENEMY_DEFAULTS, ...st.def.enemies } : null;
      html = (!c ? '<div class="help">This map has no enemy spawning.</div>' : '<div class="dp-kind"><h2>' + (st.def.name || 'THIS LEVEL') + '</h2>' +
        SPAWN_FIELDS.map(([f, name, step, fmt]) => row('data-spawn="' + f + '" data-step="' + step + '"', name, fmt(c, st))).join('') +
        '<h2>THE MIX</h2>' + mixRows().map(([f, name, step, fmt]) => row('data-spawn="' + f + '" data-step="' + step + '"', name, fmt(c, st))).join('') + '</div>') +
        '<div class="dp-kind"><h2>PUT ONE NEAR YOU</h2><div class="dp-spawn">' +
        Object.entries(G.ENEMY_TYPES).map(([id, T]) => '<button data-spawnnow="' + id + '">' + T.name + '</button>').join('') + '</div></div>';
    } else {
      html = kinds().map((k, i) => {
        const t = tuneOf(k), rows = TABS[D.tab].filter((r) => holder(t, r) && (r.cone || !r.optional || holder(t, r)[r.k] !== undefined));
        return '<div class="dp-kind' + (i === D.kind ? ' on' : '') + '"><h2>' + (i + 1) + ' ' + labelOf(k) + '</h2>' +
          (rows.length ? rows.map((r) => row('data-kind="' + k + '" data-row="' + rowId(r) + '"', r.label, r.show(r.cone ? holder(t, r).cone : holder(t, r)[r.k]))).join('') : '<div class="help">nothing to tune here</div>') + '</div>';
      }).join('');
    }
    panel.querySelector('#dp-body').innerHTML = html;
    panel.querySelector('#dp-dirty').textContent = sig() === savedSig ? '' : '\u25cf unsaved changes';
  }
  // tuning.js as text, from the live numbers: plain JS literals ({ a: 1, b: [2, 3] }), one entry per line
  const lit = (v) => Array.isArray(v) ? '[' + v.map(lit).join(', ') + ']'
    : v && typeof v === 'object' ? '{ ' + Object.entries(v).map(([k, x]) => k + ': ' + lit(x)).join(', ') + ' }' : typeof v === 'string' ? "'" + v + "'" : String(v);
  const table = (name, obj) => '  window.G.' + name + ' = {\n' + Object.entries(obj).map(([k, o]) => '    ' + k + ': ' + lit(o) + ',').join('\n') + '\n  };\n';
  const tuningFile = () => TUNING_HEAD + '(function () {\n' + table('ENEMY_TUNING', G.ENEMY_TUNING) + table('ENEMY_SPAWN', G.ENEMY_SPAWN) + '})();\n';
  let TUNING_HEAD = '/* AFK APOCALYPSE — enemy tuning */\n'; // replaced by the file's real header comment once it's fetched
  fetch('src/tuning.js').then((r) => r.text()).then((t) => { const end = t.indexOf('*/'); if (t.startsWith('/* AFK APOCALYPSE — enemy tuning') && end > 0) TUNING_HEAD = t.slice(0, end + 2) + '\n'; }).catch(() => {});
  async function save() {
    const msg = (t, cls) => { const m = panel.querySelector('#dp-msg'); m.textContent = t; m.className = cls; };
    try {
      const res = await fetch('__save-tuning' + (version ? '?base=' + version : ''), { method: 'POST', body: tuningFile() });
      if (res.status === 409) return msg('Not saved: tuning.js changed since this page loaded. Reload, then tune again.', 'bad');
      if (!res.ok) throw new Error(await res.text());
      version = await res.text(); savedSig = sig(); shownSig = null;
      msg('Saved to src/tuning.js.', 'ok');
    } catch (e) { msg(G.saveHelp(), 'bad'); }
  }

  // ===== Mouse: select an enemy, drag its rings =====
  const screen = document.getElementById('screen');
  const stage = () => (D.on && G.state instanceof G.Stage && !G.state.edit ? G.state : null);
  // Mouse position in world pixels (the same camera the stage draws with), or null when off the game screen
  const worldAt = (st, ev) => {
    const g = G.screenToGame(ev.clientX, ev.clientY);
    return g && { x: g.x + Math.round(st.cam.x), y: g.y + Math.round(st.cam.y) };
  };
  const ringAt = (e, m) => { // which of the selected enemy's rings the mouse is on: 'notice', 'giveUp' or null
    const o = e.brain.find(([n]) => n === 'target');
    if (!o) return null;
    const d = Math.hypot(m.x - e.x, m.y - (e.y - 6));
    if (Math.abs(d - (o[1].notice || 120)) <= 4) return 'notice';
    if (Math.abs(d - (o[1].giveUp || 190)) <= 4) return 'giveUp';
    return null;
  };
  const select = (e) => { D.sel = e; if (e) D.kind = kinds().indexOf(G.ENEMY_TYPES[e.type].archetype); };
  screen.addEventListener('mousedown', (ev) => {
    const st = stage(), m = st && worldAt(st, ev);
    if (!m) return;
    ev.preventDefault();
    if (D.sel && ringAt(D.sel, m)) { D.drag = ringAt(D.sel, m); return; }
    let best = null, bd = 14; // nearest enemy body within 14 px of the click
    for (const e of st.enemies) { const d = Math.hypot(e.x - m.x, e.y - 10 - m.y); if (d < bd) { bd = d; best = e; } }
    select(best);
  });
  window.addEventListener('mousemove', (ev) => {
    const st = stage(), m = st && worldAt(st, ev);
    if (!m) { if (!st) screen.style.cursor = ''; return; }
    const e = D.sel;
    if (D.drag && e) {
      const o = targetOpts(kinds()[D.kind]), r = Math.round(Math.hypot(m.x - e.x, m.y - (e.y - 6)));
      if (D.drag === 'notice') o.notice = G.clamp(r, 10, (o.giveUp || 190) - 10); // notice stays inside give-up
      else o.giveUp = G.clamp(r, (o.notice || 120) + 10, 400);
    }
    screen.style.cursor = D.drag || (e && ringAt(e, m)) ? 'ew-resize' : st.enemies.some((f) => Math.hypot(f.x - m.x, f.y - 10 - m.y) < 14) ? 'pointer' : '';
  });
  window.addEventListener('mouseup', () => { D.drag = null; });
  screen.addEventListener('wheel', (ev) => {
    const st = stage();
    if (!st || !D.sel) return;
    ev.preventDefault();
    if (!targetOpts(kinds()[D.kind]) || !targetOpts(kinds()[D.kind]).cone) return; // full-circle enemies have no cone to widen
    adjust(kinds()[D.kind], 'sight.cone', ev.deltaY < 0 ? 1 : -1);
  }, { passive: false });
})();
</script>

<script>
/* AFK APOCALYPSE — each crew member's skill (the Skill button: K or Shift, gamepad B, touch SKL).
   G.SKILLS[id] = { name, cd (ticks to recharge), use(p, st, mx, my, m) }. use returns true when the skill went off
   (the cooldown starts), or a short reason string when it can't be used right now (nothing is spent).
   crew.js names each crew member's skill by id (`skillId`). The HUD portrait fills back up as it recharges. */
(function () {
  'use strict';
  const G = window.G;

  // Every target (enemies, practice dummies) within r px of (x, y)
  const near = (st, x, y, r) => st.targets().filter((t) => Math.hypot(t.x - x, (t.y - y) * 1.2) < r);
  // A ring of particles for a burst skill
  const ring = (st, x, y, r, cols) => { for (let i = 0; i < 20; i++) { const a = (i / 20) * Math.PI * 2; st.burst(x + Math.cos(a) * r * 0.5, y + Math.sin(a) * r * 0.4, 1, cols, 1.2, 4, 18); } };
  // Shove a target away from (x, y)
  const shove = (t, x, y, k) => { if (t.kx === undefined) return; const dx = t.x - x, dy = t.y - y, d = Math.hypot(dx, dy) || 1; t.kx = (dx / d) * k; t.ky = (dy / d) * k; };

  G.SKILLS = {
    // Pixel: a short glitchy dash, invulnerable while dashing (it's how you break free of a crowd)
    frameSkip: {
      name: 'FRAME SKIP', cd: 75, // tunable
      use(p, st, mx, my, m) { p.dash(st, mx, my, m); return true; },
    },
    // Big Lou: a hop and a ground pound. Everyone close is hit, shoved back and left seeing stars; cracked walls
    // (theme.pound: cracked brick, cracked plaster) beside him smash. His gate.
    orderUp: {
      name: 'ORDER UP!', cd: 240, dmg: 2, r: 40, daze: 70, // tunable: damage, reach px, dazed ticks
      use(p, st) {
        if (p.jump || p.tramp) return 'ALREADY UP';
        p.startJump(st, 0, 0, 0, 14, { time: 24, pound: true });
        p.say('ORDER UP!', '#ffd23a');
        return true;
      },
      land(p, st) { // called when the hop lands
        const S = this;
        for (const t of near(st, p.x, p.y, S.r)) { t.hit(st, S.dmg, p.x, p.y); shove(t, p.x, p.y, 4); if (t.stun) t.stun(st, S.daze, 'dizzy'); }
        const T = st.room.theme;
        if (T.pound && st.breakWalls(p.x, p.y - 6, 18, T.pound)) p.say('SMASH!', '#ffd23a');
        st.shake(10, 3);
        ring(st, p.x, p.y, S.r, ['#ffd23a', '#ffffff', '#a89878']);
        G.sfx.play('boom');
      },
    },
    // June: unplug the teen in front of her (or the closest one, within reach): their phone goes dark and they're a
    // neighbor again, waiting to be beamed out. One the teens turned earlier counts as saved from being lost. She
    // heals a heart for it.
    unplug: {
      name: 'UNPLUG', cd: 600, reach: 36, heal: 2, // tunable: reach px, heal in half-hearts
      use(p, st) {
        let best = null, bd = this.reach;
        for (const e of st.enemies) {
          if (!e.hittable()) continue;
          const d = Math.hypot(e.x - p.x, e.y - p.y) - ((e.x - p.x) * p.fx + (e.y - p.y) * p.fy) * 0.3; // in front counts as closer
          if (d < bd) { bd = d; best = e; }
        }
        if (!best) return 'NO ONE TO UNPLUG';
        st.unplug(best);
        if (p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + this.heal); p.healFlash = 45; }
        G.sfx.play('heal');
        return true;
      },
    },
    // Root: a burst of interference. Every phone near Root fries (stunned), and the nearest locked house door within
    // reach unlocks and swings open: no key needed (smart locks). Keycard gates still want their card.
    override: {
      name: 'OVERRIDE', cd: 420, r: 64, zap: 120, door: 48, // tunable: zap reach px, stun ticks, door reach px
      use(p, st) {
        let n = 0;
        for (const t of near(st, p.x, p.y, this.r)) if (t.stun) { t.stun(st, this.zap, 'zap'); n++; }
        let door = null, dd = this.door;
        for (const d of st.room.hdoors || []) {
          if (d.open || !d.locked) continue;
          const [x, y] = d.cells[0], cx = x * 16 + d.cells.length * 8, cy = y * 16 + 8, dist = Math.hypot(cx - p.x, cy - p.y);
          if (dist < dd) { dd = dist; door = d; }
        }
        if (door) { door.locked = false; st.openHouseDoor(door, p); p.say('ACCESS GRANTED', '#38f0a0'); }
        else p.say(n ? 'OVERRIDE!' : 'NOTHING TO HACK', '#38f0a0');
        ring(st, p.x, p.y - 8, this.r, ['#38f0a0', '#7ff0ff', '#ffffff']);
        G.sfx.play('zap');
        return true;
      },
    },
    // Tinfoil Ted: he knew it. For a while every secret wall nearby is outlined (like the PDA does), and every teen
    // close by forgets what it was doing (dazed, seeing stars).
    iKnewIt: {
      name: 'I KNEW IT!', cd: 600, show: 600, r: 96, daze: 150, // tunable: secrets shown for (ticks), daze reach, daze ticks
      use(p, st) {
        p.revealT = this.show;
        for (const t of near(st, p.x, p.y, this.r)) if (t.stun) t.stun(st, this.daze, 'dizzy');
        p.say('I KNEW IT!', '#7ff0ff');
        ring(st, p.x, p.y - 8, 48, ['#c8c8d8', '#ffffff', '#7ff0ff']);
        G.sfx.play('secret');
        return true;
      },
    },
    // Dot: "86 it!" Everyone close gets told, hard: a hit, a big shove back and a moment to think about it. Puts out
    // any fire close by too (she can also just walk through it: fireproof is her gate).
    eightySix: {
      name: '86 IT!', cd: 360, dmg: 1, r: 48, daze: 90, // tunable
      use(p, st) {
        for (const t of near(st, p.x, p.y, this.r)) { t.hit(st, this.dmg, p.x, p.y); shove(t, p.x, p.y, 6); if (t.stun) t.stun(st, this.daze, 'dizzy'); }
        const T = st.room.theme, out = T.douse && st.breakWalls(p.x, p.y - 4, this.r, T.douse, true); // fires go out too
        p.say(out ? 'FIRE: 86ED!' : '86 IT!', '#ff5ab0');
        st.shake(5, 2);
        ring(st, p.x, p.y - 8, this.r, ['#ff5ab0', '#ffffff', '#ffd23a']);
        G.sfx.play('whoosh');
        return true;
      },
    },
  };

  // Tuning Lab rows for the skills
  const sec = (v) => (v / 60).toFixed(1) + 'S', S = G.SKILLS;
  G.TUNABLES.push(
    { group: 'SKILLS', label: 'FRAME SKIP RECHARGE', o: S.frameSkip, k: 'cd', min: 10, max: 600, step: 5, note: sec },
    { group: 'SKILLS', label: 'ORDER UP RECHARGE', o: S.orderUp, k: 'cd', min: 30, max: 1200, step: 30, note: sec },
    { group: 'SKILLS', label: 'ORDER UP DAMAGE', o: S.orderUp, k: 'dmg', min: 0, max: 20, step: 0.5 },
    { group: 'SKILLS', label: 'UNPLUG RECHARGE', o: S.unplug, k: 'cd', min: 30, max: 1800, step: 30, note: sec },
    { group: 'SKILLS', label: 'UNPLUG REACH', o: S.unplug, k: 'reach', min: 12, max: 96, step: 4, note: () => 'PX' },
    { group: 'SKILLS', label: 'OVERRIDE RECHARGE', o: S.override, k: 'cd', min: 30, max: 1800, step: 30, note: sec },
    { group: 'SKILLS', label: 'I KNEW IT RECHARGE', o: S.iKnewIt, k: 'cd', min: 30, max: 1800, step: 30, note: sec },
    { group: 'SKILLS', label: 'I KNEW IT SHOWS', o: S.iKnewIt, k: 'show', min: 60, max: 1800, step: 60, note: sec },
    { group: 'SKILLS', label: '86 IT RECHARGE', o: S.eightySix, k: 'cd', min: 30, max: 1200, step: 30, note: sec },
  );
  G.TUNABLES.forEach((t) => { if (!t.id) { t.id = t.group + '.' + t.label; t.def = t.o[t.k]; } });
  G.applyTuning();
})();
</script>
<script>
/* AFK APOCALYPSE — recruit screen: the visitor's POV from the diner entrance, looking straight in.
   Some patrons are recruitable crew; hover one and they stand up, get a spotlight, and their info shows.
   Pick them and they hop over the table toward you. Drawn front-on at 2x sprite scale. */
(function () {
  'use strict';
  const G = window.G, I = G.input;
  const S = 2, SW = 16 * S, SH = 24 * S; // sprite scale and drawn size
  const BOOTHS = [4, 88, 172];           // booth left edges
  const TABLE_Y = 138;

  // Recruitable spots. tier 0 = counter row, tier 1 = booths. rise = how far they move when they stand.
  const SPOTS = [
    { id: 'lou', tier: 0, x: 46, y: 30, rise: -8 },        // behind the counter, in the kitchen window
    { id: 'dot', tier: 0, x: 212, y: 50, rise: 6 },        // standing by the end of the counter
    { id: 'pixel', tier: 1, x: 12, y: 106, rise: -14 },
    { id: 'root', tier: 1, x: 44, y: 106, rise: -14 },
    { id: 'june', tier: 1, x: 96, y: 106, rise: -14 },
    { id: 'ted', tier: 1, x: 196, y: 106, rise: -14 },
  ];

  function layer(draw) {
    const c = G.makeCanvas(G.W, G.H), x = c.getContext('2d');
    draw((a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); }, x);
    return c;
  }
  // Back wall, kitchen window, night windows, floor, booth seat backs
  const buildBack = () => layer((r) => {
    r(0, 0, 256, 62, '#3a2848'); r(0, 0, 256, 2, '#2a1a38');
    r(0, 9, 256, 1, 'rgba(255,90,176,.3)'); r(0, 10, 256, 1, '#ff5ab0'); r(0, 11, 256, 1, 'rgba(255,90,176,.3)');
    // kitchen pass window with order tickets and a heat-lamp glow
    r(14, 14, 100, 46, '#c8d0e0'); r(16, 16, 96, 42, '#1a1420'); r(16, 16, 96, 4, '#5a5a6a');
    for (let i = 0; i < 6; i++) { r(22 + i * 15, 21, 9, 9, '#f0ece0'); r(23 + i * 15, 23, 6, 1, '#8a8070'); r(23 + i * 15, 25, 4, 1, '#8a8070'); }
    r(16, 34, 96, 24, 'rgba(255,140,40,.10)');
    // windows: night LA skyline and a palm tree
    r(122, 14, 130, 44, '#c8d0e0');
    ['#0e1028', '#141838', '#1c2048', '#262650'].forEach((c, i) => r(124, 16 + i * 10, 126, 10, c));
    for (let i = 0; i < 14; i++) {
      const bx = 124 + i * 9, bh = 8 + Math.floor(G.hash(i, 3) * 22);
      r(bx, 56 - bh, 8, bh, '#0a0c1c');
      for (let k = 0; k < 4; k++) if (G.hash(i, k + 9) > 0.55) r(bx + 1 + (k % 2) * 4, 58 - bh + Math.floor(k / 2) * 5 + 2, 1, 1, '#ffd870');
    }
    r(150, 26, 2, 30, '#06060e'); r(142, 24, 18, 2, '#06060e'); r(144, 22, 4, 2, '#06060e'); r(154, 22, 4, 2, '#06060e'); r(140, 26, 3, 2, '#06060e'); r(159, 26, 3, 2, '#06060e');
    r(164, 14, 2, 44, '#c8d0e0'); r(206, 14, 2, 44, '#c8d0e0');
    r(0, 60, 256, 2, '#e0e8f8');
    // floor in perspective: checker rows get taller toward you
    for (let y = 62, h = 3, row = 0; y < 178; y += h, h++, row++) {
      for (let i = 0; i < 16; i++) r(i * 16, y, 16, Math.min(h, 178 - y), (i + row) % 2 ? '#5c5470' : '#b4ab9c');
    }
    // booth seat backs (red vinyl, tufted)
    for (const bx of BOOTHS) {
      r(bx, 103, 78, 45, '#a01c30'); r(bx + 2, 105, 74, 41, '#c8283c'); r(bx + 2, 105, 74, 3, '#f0506a');
      for (let k = bx + 8; k < bx + 74; k += 8) r(k, 109, 1, 33, '#a01c30');
      r(bx, 103, 2, 45, '#c8d0e0'); r(bx + 76, 103, 2, 45, '#c8d0e0');
    }
  });
  // Counter front and stools (in front of Big Lou, behind Dot and the trucker)
  const buildCounter = () => layer((r) => {
    r(0, 62, 204, 3, '#e0e8f8'); r(0, 65, 204, 5, '#e8dcc8'); r(0, 70, 204, 20, '#c0303e');
    r(0, 73, 204, 1, '#e0e8f8'); r(0, 86, 204, 1, '#e0e8f8'); r(0, 90, 204, 4, '#601828'); r(204, 62, 2, 32, '#9098b0');
    for (const sx of [24, 64, 104, 144, 184]) {
      r(sx + 5, 95, 2, 6, '#c8d0e0'); r(sx + 2, 100, 8, 1, '#9098b0');
      r(sx, 92, 12, 3, '#d02840'); r(sx + 1, 91, 10, 1, '#ff6a80');
    }
  });
  // Booth tables with each patron's stuff on them (in front of the booth patrons)

    r(50, 126, 22, 13, '#8a8aa8'); r(51, 127, 20, 11, '#9a9ab8'); r(59, 130, 4, 3, '#38f0a0'); // Root's laptop (lid)
    r(108, 132, 6, 6, '#f0f0f8'); r(114, 133, 2, 3, '#f0f0f8'); r(109, 132, 4, 1, '#5a3018'); // June's coffee
    r(204, 134, 8, 4, '#d8d8e8'); r(206, 133, 3, 1, '#ffffff');                             // Ted's foil
    r(218, 133, 16, 6, '#e8dcc8'); r(220, 134, 10, 1, '#ff3a5a'); r(222, 136, 8, 1, '#ff3a5a'); r(225, 134, 1, 4, '#ff3a5a'); // red-string map

  class Recruit {
    // players: 1, or 2 for co-op (player 1 picks, then player 2; nobody can pick someone already picked)

    confirm() {

      G.sfx.play('confirm');
      this.picks.push(c.id);

      this.hop = { id: c.id, t: 0, x: c.x, y: c.y + c.rise };
    }
    // who's going: one crew id, or [player 1's, player 2's] in co-op
    get team() { return this.need > 1 ? this.picks.slice() : this.picks[0]; }
    update() {
      this.t++;
      for (const s of this.spots) { // stand up / sit back down, and glance around while idle
        const on = s === this.cur || this.picks.includes(s.id); // player 1's pick stays standing

      }

        if (this.hop.t > 62) { const L = G.LEVELS[0]; G.setState(L.briefing ? new G.states.Briefing(L, this.team) : new G.Stage(L, this.team)); } // the visitor's briefing first

        ctx.globalAlpha = 1;

      }
      ctx.drawImage(spr, s.x, y, SW, SH);
      if (this.picks.length && this.picks[0] === s.id && this.need > 1) G.text('P1', s.x + SW / 2, y - 2, '#ff5ab0', { align: 'center', shadow: '#140c1c' }); // player 1's pick
      if (this.taken.includes(s.id)) G.text('TAKEN', s.x + SW / 2, y - 2, '#ff3a5a', { align: 'center', shadow: '#140c1c' }); // online: someone else has them
    }

      const set = G.art.crew[s.id];

      return set[s.look][f];
    }
    draw(ctx) {
      ctx.drawImage(this.back, 0, 0);
      if (this.need > 1) { const k = Math.min(this.picks.length, 1); G.text('PLAYER ' + (k + 1) + ': PICK YOUR CREW', 128, 2, k ? '#3ad0ff' : '#ff5ab0', { align: 'center', shadow: '#140c1c' }); }

      G.text('24 HRS', 229, 30, flick ? '#20404a' : '#3ad0ff', { align: 'center' });

      const spot = (id) => this.spots.find((s) => s.id === id);
      // counter row: Big Lou behind the counter, then the counter, then Dot and a regular on a stool
      if (hopId !== 'lou') this.drawPerson(ctx, spot('lou'), this.frameFor(spot('lou')));
      ctx.drawImage(this.counter, 0, 0);
      G.text('100% VEGAN', 100, 76, '#7ff0a0', { align: 'center', shadow: '#4a0a1a' }); // painted on the counter
      ctx.drawImage(G.art.people.trucker.up[0], 136, 46, SW, SH); // regular, back to us, hunched over his pie
      if (hopId !== 'dot') this.drawPerson(ctx, spot('dot'), this.frameFor(spot('dot')));
      // booths: patrons, the newspaper guy, then the tables in front of them
      for (const id of ['pixel', 'root', 'june', 'ted']) if (hopId !== id) this.drawPerson(ctx, spot(id), this.frameFor(spot(id)));
      ctx.drawImage(G.art.people.newsguy.down[0], 128, 106, SW, SH);
      ctx.fillStyle = '#e8e0c8'; ctx.fillRect(130, 112, 28, 24); ctx.fillStyle = '#8a8070';
      for (let k = 0; k < 5; k++) ctx.fillRect(132 + (k % 2) * 13, 119 + Math.floor(k / 2) * 5, 11, 1);
      ctx.fillStyle = '#1a1020'; ctx.fillRect(132, 114, 24, 3); // headline
      ctx.drawImage(this.tables, 0, 0);

      if (this.hop) {
        const h = this.hop, k = Math.min(1, h.t / 50), sc = S + 3 * k * k, w = 16 * sc, hh = 24 * sc;
        const cx = G.lerp(h.x + SW / 2, 128, k), feet = G.lerp(h.y + SH, 250, k * k) - Math.sin(k * Math.PI) * 34;
        const spr = G.art.crew[h.id].down[h.t < 12 ? 0 : 1 + ((h.t >> 3) & 1)];
        ctx.drawImage(spr, Math.round(cx - w / 2), Math.round(feet - hh), Math.round(w), Math.round(hh));
        if (h.t > 50) { ctx.globalAlpha = Math.min(1, (h.t - 50) / 10); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1; }

      this.drawPanel(ctx);
    }
    drawPanel(ctx) {
      const def = G.CREW[this.cur.id], y = 178;
      if (!this.hop) {
        const taken = this.picks.includes(this.cur.id) || this.taken.includes(this.cur.id);
        const hint = taken ? (this.taken.includes(this.cur.id) ? 'TAKEN BY ANOTHER PLAYER' : 'TAKEN BY PLAYER 1') : !def.ready ? 'IN TRAINING' : I.source === 'touch' ? 'TAP AGAIN TO RECRUIT' : 'FIRE: RECRUIT   ESC: BACK';
        G.text(hint, 128, 166, taken || !def.ready ? ((this.t >> 4) & 1 ? '#ff3a5a' : '#a02040') : '#ffffff', { align: 'center', shadow: '#140c1c' });
      }
      G.box(4, y, 248, 44);
      G.text(def.name, 12, y + 5, '#ffd23a', { shadow: '#0e124a' });
      G.text('- ' + def.role, 12 + G.textWidth(def.name) + 6, y + 5, '#8a9ad8', { shadow: '#0e124a' });
      const line = (label, val, i) => {
        G.text(label, 12, y + 15 + i * 9, '#8a9ad8', { shadow: '#0e124a' });
        G.text(val, 54, y + 15 + i * 9, '#ffffff', { shadow: '#0e124a' });
      };
      line('WEAPON', def.weaponName, 0);
      line('SKILL', def.skill, 1);
      line('GATE', def.gateDesc, 2);
      Object.entries(def.stats).forEach(([k, v], i) => {
        const sy = y + 5 + i * 9;
        G.text(k, 194, sy, '#8a9ad8', { shadow: '#0e124a' });
        for (let p = 0; p < 5; p++) {
          ctx.fillStyle = '#08041a'; ctx.fillRect(214 + p * 7, sy, 6, 6);
          ctx.fillStyle = p < v ? (k === 'HP' ? '#ff3a5a' : '#38f0a0') : '#2a3060'; ctx.fillRect(215 + p * 7, sy + 1, 4, 4);
        }

  }

})();

<script>
/* AFK APOCALYPSE — map-editing kit for the in-game edit mode (editmode.js): palette, previews, stamps, checks, maps.js writer */
(function () {
  'use strict';

  K.MARKERS = [['A', 'DART BOX (+60 DARTS)'], ['F', 'BASEBALL BAT'], ['X', 'MACHETE'], ['&', 'LAWN MOWER (PUSH IT: MOWS TEENS TILL IT RUNS OUT OF GAS)'],
    ['P', 'PLAYER START'], ['E', 'EXIT (TIME DOOR)'], ['N', 'NEIGHBOR (CLICK ONE AGAIN TO CHANGE ITS KIND)'], ['Z', 'ZOMBIE SPAWN'], ['B', 'PACKAGE'], ['Q', 'PDA'],
    ['8', 'KEYCARD (CLICK ONE AGAIN: COLOR)'], ['C', 'KEY (OPENS ANY ONE LOCKED HOUSE DOOR)'], ['T', 'PRACTICE TARGET'], ['$', 'SPAWN BUTTON (STEP ON IT: AN ENEMY RISES AT A ZOMBIE SPAWN; CLICK ONE AGAIN: WHICH)'], ['U', 'DART UPGRADE'], ['1', 'SODA'], ['2', 'BLOWER'], ['3', 'ROCKETS'],
    ['4', 'PIE'], ['5', 'COFFEE'], ['6', 'SODA BOMB'], ['7', 'VEGGIE BURGER'], ['9', 'QUARTER (1UP)'], ['0', 'POGO STICK (5 JUMPS)'],
  ];

    const c = G.makeCanvas(16, 16), x = c.getContext('2d');

  }
  function makeExitIcon() {

    const A = G.art;

    return A.icons[ICON_OF[ch]];
  };
  // Palette preview for a tile: its ground art plus its upright sprite (lamppost, hedge, car...), rendered inside a
  // small patch of itself so auto-tiling looks right (fences join, hedges merge). Cars preview as a whole 3x2 sedan.
  // A preview of one tile (or a whole car, or a whole 2x2 piece) with whatever rises above it and spills past its sides
  K.tilePreview = (theme, ch) => {
    const car = ch === 'c', piece = (theme.stamps && theme.stamps[ch]) || null, W = 5, H = 5; // a piece (trampoline, big tree): [w, h]
    const isCh = (x, y) => (car ? x >= 1 && x <= 3 && y >= 2 && y <= 3 : piece ? x >= 1 && x <= piece[0] && y >= 1 && y <= piece[1] : x >= 1 && x <= 3 && y >= 1 && y <= 3);
    const fake = { theme, w: W, h: H, at: (x, y) => (isCh(x, y) ? ch : theme.ground), overAt: () => '.', hdoorAt: () => null };
    const up = theme.up && theme.up[ch], lift = up ? up.rise : 0, wd = up && up.wide ? up.wide : 0; // wd: spills past its tile
    const big = G.makeCanvas(W * 16 + 2 * wd, H * 16 + lift), bx = big.getContext('2d');

    if (up) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (isCh(x, y)) up.draw(paint(x * 16, lift + y * 16), x, y, fake);
    // crop: the whole car or piece, or the middle cell, plus whatever rises above it and spills to the sides
    // (row n is drawn at y = lift + 16n; starting the crop `lift` px higher, at y = 16n, keeps what rises above it)
    const [sx, sy, sw, sh] = car ? [wd + 16, 32, 48, 32 + lift] : piece ? [16, 16, piece[0] * 16 + 2 * wd, piece[1] * 16 + lift] : [32, 32, 16 + 2 * wd, 16 + lift];

  K.stampSize = (theme, ch) => (theme.stamps && theme.stamps[ch]) || (theme.place && theme.place[ch]) || null; // [w, h] placed with one click (theme.place: a car), or null for a plain tile
  // Every cell of the piece that (x, y) belongs to (a whole trampoline), or just [[x, y]] for a plain tile
  K.pieceCells = (R, x, y) => {
    return K.stampSize(R.theme, R.at(x, y)) ? G.pieceCells(R, x, y) : [[x, y]];

  // paints over goes whole (no quarter trampolines left behind). set(x, y, ch) returns the old char or null.
  // Returns the changes [{ x, y, from, to }] (for undo).
  K.paintAt = (R, set, x, y, ch) => {
    const out = [], put = (a, b, c) => { const from = set(a, b, c); if (from !== null) out.push({ x: a, y: b, from, to: c }); };
    const [w, h] = K.stampSize(R.theme, ch) || [1, 1], cells = [];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (x + i < R.w && y + j < R.h) cells.push([x + i, y + j]);
    for (const [a, b] of cells) { const piece = K.pieceCells(R, a, b); if (piece.length > 1) for (const [c, d] of piece) put(c, d, R.theme.ground); }
    for (const [a, b] of cells) put(a, b, ch);

  // A see-through preview of a stamp at cell (x, y), drawn into ctx at `scale` px per world px, world origin at
  // (ox, oy) on screen: the piece itself, plus an outline of its footprint
  const ghosts = new Map();

    ctx.globalAlpha = 0.55;

    const c = G.makeCanvas(16, 16), x = c.getContext('2d');
    x.fillStyle = '#2a1f44'; x.fillRect(2, 2, 12, 12);
    x.fillStyle = '#ff3a5a'; for (let i = 0; i < 10; i++) { x.fillRect(3 + i, 3 + i, 2, 2); x.fillRect(12 - i, 3 + i, 2, 2); }

  };

  K.MARKER_GROUPS = [['PEOPLE & PLACES', 'PENZBT$'], ['PICKUPS', 'QA8CU1234567890FX&']];
  const sections = (entries, groups) => {
    if (!groups) return [['TILES', entries]];

  };

  // onPick(ch) on click, onHover(label | null) while the mouse is over a button.
  K.buildPalette = (box, theme, onPick, onHover) => {
    box.innerHTML = '';
    const head = (t) => { const h = document.createElement('h2'); h.textContent = t; box.appendChild(h); const g = document.createElement('div'); g.className = 'grid'; box.appendChild(g); return g; };

    { what: 'breakable wall', is: (T, c) => !!((T.breakable && T.breakable.has(c)) || (T.bombable && T.bombable.has(c))), opens: (T, c) => c === 'D' }, // rockets and bombs open them all
  ];
  K.leakyLocks = (R, grid) => {
    const W = R.w, H = R.h, T = R.theme, N = W * H;
    const sy = grid.findIndex((r) => r.includes('P'));
    if (sy < 0) return [];
    const start = sy * W + grid[sy].indexOf('P'), foot = G.footReach(R, start % W, sy);
    const out = [], seen = new Set();
    for (const L of LOCKS) {
      const cells = [];
      for (let i = 0; i < N; i++) if (L.is(T, R.at(i % W, (i - (i % W)) / W))) cells.push(i);
      if (!cells.length) continue;
      const reach = new Uint8Array(N), q = [start];
      reach[start] = 1;
      while (q.length) {
        const i = q.pop(), x = i % W, y = (i - x) / W;
        const tramp = T.bounce && T.bounce.has(R.at(x, y)) ? trampLandings(R, x, y) : [];
        for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1], ...jumpLandings(R, x, y), ...tramp]) {
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          const j = ny * W + nx, c = R.at(nx, ny);
          if (reach[j]) continue;
          if (walkableCell(R, nx, ny) || L.opens(T, c) || (c === 'G' && !foot[i])) { reach[j] = 1; q.push(j); }

      }
      for (const i of cells) {
        if (seen.has(i)) continue;
        const x = i % W, y = (i - x) / W, c = R.at(x, y);
        const run = [i], stack = [i]; seen.add(i); // the whole run of this lock tile goes together
        while (stack.length) {
          const k = stack.pop(), kx = k % W, ky = (k - kx) / W;
          for (const [nx, ny] of [[kx + 1, ky], [kx - 1, ky], [kx, ky + 1], [kx, ky - 1]]) {
            const j = ny * W + nx;
            if (nx >= 0 && ny >= 0 && nx < W && ny < H && !seen.has(j) && R.at(nx, ny) === c) { seen.add(j); run.push(j); stack.push(j); }

        }

        for (const k of run) {
          const kx = k % W, ky = (k - kx) / W;
          for (const [nx, ny] of [[kx + 1, ky], [kx - 1, ky], [kx, ky + 1], [kx, ky - 1]]) {
            if (nx >= 0 && ny >= 0 && nx < W && ny < H && R.at(nx, ny) !== c && walkableCell(R, nx, ny)) sides.push(ny * W + nx);
          }

      }

    return out;
  };
  // Does the area past the map edge block a player? (the theme's border tile must be fully solid)
  K.borderClosed = (theme) => theme.solid.has(theme.border) && !(theme.box && theme.box(theme.border, 0, 0, { at: () => theme.border, overAt: () => '.', theme }));

  // ---- Layout: does the map flow like ZAMN (search, not roam)? ----
  // Numbers measured from ZAMN's maps; the reasons are in docs/design/level-rules.md (section 3, "Layout and flow").
  // A screen is 16x14 tiles (256x224).
  K.LAYOUT = {
    screens: [18, 32],  // level size in screens (ZAMN: 20 to 34)
    openSquare: 8,      // the biggest square of open ground (no hedge, wall, fence or pool; trees don't count) is at most this many tiles
    houses: 0.06,       // houses (roof cells) cover at most this share of the map (3-4 small houses)
    road: 0.04,         // street tiles cover at most this share of the map (a short stretch, not a highway)
    win: [16, 14],      // "something every screen": every screen-sized window you can walk in holds a point of interest
    spawnGap: 8,        // enemy spawn points stay at least this many tiles from every neighbor (a fair chance to reach them)
  };
  // R: the map as the game sees it; grid: the raw map (markers included).
  // Returns { screens, openSquare: { size, x, y }, houses, road, empty: [[x, y]...] (top-left of screens with nothing),
  //   crowded: [[x, y]...] (spawn points too close to a neighbor) }
  K.layout = (R, grid) => {
    const W = R.w, H = R.h, T = R.theme, L = K.LAYOUT;
    // open ground: anywhere you walk straight across. A tree or lamp in a lawn doesn't count (you just step round
    // it); hedges, walls, fences, cars, houses and pools do.
    const open = (x, y) => walkableCell(R, x, y) && !(T.water && T.water.has(R.at(x, y))) && R.overAt(x, y) === '.' && R.at(x, y) !== 'O';
    // biggest open square (classic dynamic programming: side of the square ending at each cell)
    const side = new Uint16Array(W * H), best = { size: 0, x: 0, y: 0 };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!open(x, y)) continue;
      const s = x && y ? 1 + Math.min(side[(y - 1) * W + x], side[y * W + x - 1], side[(y - 1) * W + x - 1]) : 1;
      side[y * W + x] = s;
      if (s > best.size) Object.assign(best, { size: s, x: x - s + 1, y: y - s + 1 });
    }
    let roof = 0, road = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (R.overAt(x, y) === 'R') roof++;
      if (T.road && T.road.has(R.at(x, y))) road++;
    }
    // points of interest: markers (people, pickups, spawns, the exit), searchables, trampolines, pools, doors,
    // gates and breakable walls (secrets are interesting too)
    const interest = (x, y) => {
      const c = grid[y][x], t = R.at(x, y);
      return (K.MARK.has(c) && c !== 'P') || t === 'O' || t === 'D' || t === 'G' || [T.searchable, T.bounce, T.water, T.breakable].some((s) => s && s.has(t));
    };
    const [ww, wh] = L.win, empty = [];
    for (let y0 = 0; y0 + wh <= H; y0 += wh / 2) for (let x0 = 0; x0 + ww <= W; x0 += ww / 2) {
      let walk = 0, any = false;
      for (let y = y0; y < y0 + wh && !any; y++) for (let x = x0; x < x0 + ww; x++) {
        if (interest(x, y)) { any = true; break; }
        if (walkableCell(R, x, y)) walk++;
      }
      if (!any && walk > ww * wh / 2) empty.push([x0, y0]); // mostly walkable and nothing in it
    }
    const cells = (c) => grid.flatMap((row, y) => row.map((ch, x) => (ch === c ? [x, y] : null)).filter(Boolean));
    // neighbors the teens can't get to (swimming in a pool, inside a house: teens can't open doors) don't count
    const safe = ([x, y]) => (T.water && T.water.has(R.at(x, y))) || (T.interior && T.interior.has(R.at(x, y)));
    const people = cells('N').filter((c) => !safe(c)), crowded = cells('Z').filter(([x, y]) => people.some(([a, b]) => Math.hypot(a - x, b - y) < L.spawnGap));
    return { screens: (W * 16 / G.W) * (H * 16 / G.H), openSquare: best, houses: roof / (W * H), road: road / (W * H), empty, crowded };
  };

  // The whole src/maps.js file, from G.MAPS
  K.mapsFile = () => {
    const out = ['/* AFK APOCALYPSE — map layouts. Edit them in edit mode (press ` while playing); Save there rewrites this file (via tools/devserver.js).',
      ' * Tile legends live with each theme in tiles-*.js; marker legend is in levels.js. */', '(function () {', '  window.G.MAPS = {'];
    for (const [id, m] of Object.entries(G.MAPS)) {
      out.push('    ' + JSON.stringify(id) + ': {', '      name: ' + JSON.stringify(m.name) + ', theme: ' + JSON.stringify(m.theme) + ',', '      rows: [');
      for (const r of m.rows) out.push('        ' + JSON.stringify(r) + ',');
      out.push('      ],');
      if (m.over) { out.push('      over: ['); for (const r of m.over) out.push('        ' + JSON.stringify(r) + ','); out.push('      ],'); }
      const kinds = Object.keys(m.kinds || {}).filter((k) => { const [x, y] = k.split(',').map(Number); return m.rows[y] && 'N8DOcgl$'.includes(m.rows[y][x]); }) // only cells that still have a variant
        .sort((a, b) => { const [ax, ay] = a.split(',').map(Number), [bx, by] = b.split(',').map(Number); return ay - by || ax - bx; });
      if (kinds.length) out.push('      kinds: { ' + kinds.map((k) => JSON.stringify(k) + ': ' + JSON.stringify(m.kinds[k])).join(', ') + ' },');
      const T = G.THEMES[m.theme], floors = Object.keys(m.floors || {}).filter((k) => { const [x, y] = k.split(',').map(Number); return m.rows[y] && T.objects && T.objects.has(m.rows[y][x]); })
        .sort((a, b) => { const [ax, ay] = a.split(',').map(Number), [bx, by] = b.split(',').map(Number); return ay - by || ax - bx; });
      if (floors.length) out.push('      floors: { ' + floors.map((k) => JSON.stringify(k) + ': ' + JSON.stringify(m.floors[k])).join(', ') + ' },'); // only cells that still hold an object
      out.push('    },');
    }
    out.push('  };', '})();', '');
    return out.join('\n');
  };
  // Save every map into src/maps.js through the dev server. Throws if the dev server isn't running.
  // The maps.js version this page loaded, so Save never overwrites newer changes made elsewhere
  K.version = null;
  fetch('__maps-version').then((r) => (r.ok ? r.text() : null)).then((v) => { K.version = v; }).catch(() => {});
  K.save = async () => {
    const res = await fetch('__save-maps' + (K.version ? '?base=' + K.version : ''), { method: 'POST', body: K.mapsFile() });
    if (res.status === 409) throw new Error('stale');
    if (!res.ok) throw new Error(await res.text());
    K.version = await res.text();
  };
  K.STALE_HELP = 'Not saved: maps.js changed since this page loaded (another tab or an update). Reload the page, then redo your edit.';
  Object.defineProperty(K, 'SAVE_HELP', { get: G.saveHelp }); // why a save failed, worded for where this page is open
})();
</script>
<script>
/* AFK APOCALYPSE — in-game edit mode. Press ` (backtick) while playing to freeze the game and edit the map live:
   WASD/arrows fly a ghost cursor (through walls), -/+ zoom out/in, click/drag paints the tile or marker picked in the
   right-hand panel, right-click copies, Ctrl/Cmd+Z undoes. Press ` again to keep playing from that spot.
   Edits change the running level immediately (a neighbor you place is really there) and update G.MAPS for Save/Restart. */
(function () {
  'use strict';
  const G = window.G, I = G.input, K = G.EditKit;
  const ZOOMS = [1, 0.5, 0.25];
  let panel = null;

  // ===== Applying an edit to the running stage =====
  const rawAt = (st) => (x, y) => (x < 0 || y < 0 || x >= st.room.w || y >= st.room.h ? st.room.theme.border : st.raw[y][x]);
  // Markers for things the stage runs today (pickups, targets, neighbors, enemy spawn points) go live as you place them.
  // Package, start and exit markers are stored in the map and drawn as icons; they come alive as those features land.
  const LIVE = (ch) => ch === 'T' || ch === 'Z' || ch === 'N' || ch === '$' || !!G.PICKUP_CHARS[ch];
  function removeAt(st, x, y) {
    const keep = (e) => e.tile !== x + ',' + y;
    st.pickups = st.pickups.filter(keep); st.dummies = st.dummies.filter(keep); st.spawners = st.spawners.filter(keep); st.neighbors = st.neighbors.filter(keep); st.buttons = st.buttons.filter(keep);
  }
  function spawnAt(st, x, y, ch) {
    if (!LIVE(ch)) return;
    const px = x * 16 + 8, py = y * 16 + 12;
    const e = ch === '$' ? new G.SpawnButton(px, py, (st.def.kinds || {})[x + ',' + y]) : ch === 'T' ? new G.Dummy(px, py) : ch === 'Z' ? new G.Spawner(px, py) : ch === 'N' ? G.makeNeighbor(st.room, x, y, st.def.kinds)
      : new G.Pickup(G.PICKUP_CHARS[ch], px, py, { respawn: st.test, color: G.cardColor(st.room, x, y) });
    e.tile = x + ',' + y;
    (ch === '$' ? st.buttons : ch === 'T' ? st.dummies : ch === 'Z' ? st.spawners : ch === 'N' ? st.neighbors : st.pickups).push(e);
  }
  // Set one cell (tile char or marker) and keep the live level in sync. Returns the old char, or null if unchanged.
  // The map's `floors` { "x,y": floor tile }: the floor each object was put down on (shared with the running room)
  const floorsOf = (st) => { const m = G.MAPS[st.def.id]; m.floors = m.floors || {}; st.def.floors = m.floors; st.room.floors = m.floors; return m.floors; };
  const isObj = (st, c) => !!(st.room.theme.objects && st.room.theme.objects.has(c));
  const isFloor = (st, c) => !!(st.room.theme.floors && st.room.theme.floors.has(c));
  function applyCell(st, x, y, ch) {
    if (x < 0 || y < 0 || x >= st.room.w || y >= st.room.h) return null;
    const from = st.raw[y][x], F = floorsOf(st), key = x + ',' + y;
    if (isObj(st, from) && ch === st.room.theme.ground && F[key]) ch = F[key]; // deleting an object leaves the floor it stood on
    if (from === ch) return null;
    if (isObj(st, ch) && !isObj(st, from)) { if (isFloor(st, from)) F[key] = from; } // an object goes down: remember its floor
    else if (!isObj(st, ch)) delete F[key];
    st.raw[y][x] = ch;
    if (K.MARK.has(from)) removeAt(st, x, y);
    st.room.setTile(x, y, K.MARK.has(ch) ? K.underlay(st.room.theme, rawAt(st), x, y) : ch);
    if (K.MARK.has(ch)) spawnAt(st, x, y, ch);
    if (from === 'D' || from === 'G') st.room.doors = st.room.doors.filter((d) => !(d.tx === x && d.ty === y));
    if (ch === 'D') st.room.doors.push({ tx: x, ty: y, open: false, color: G.cardColor(st.room, x, y) });
    if (ch === 'G') st.room.doors.push({ tx: x, ty: y, open: false, latch: true });
    const start = st.room.spawns.find((s) => s.ch === 'P'); // walls moved: which side latch gates open from

  }
  // Top layer (roofs 'R', leaf canopy 'L', '.' empty). Returns the old char, or null if unchanged.
  function applyTop(st, x, y, ch) {
    const R = st.room;

    if (!R.over) R.over = Array.from({ length: R.h }, () => Array(R.w).fill('.'));
    const from = R.over[y][x];
    if (from === ch) return null;
    R.over[y][x] = ch;
    G.buildRoofs(R);
    for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (xx >= 0 && yy >= 0 && xx < R.w && yy < R.h) G.rebuildUpright(R, xx, yy); // hedges join up with the fill

  }
  // Push the edited layout back into G.MAPS, so Restart and Save use it
  function commit(st) {
    const rows = st.raw.map((r) => r.join(''));
    G.MAPS[st.def.id].rows = rows;
    st.def.map = rows;
    if (st.room.over) { const over = st.room.over.map((r) => r.join('')); G.MAPS[st.def.id].over = over; st.def.over = over; }
    if (panel) panel.querySelector('#ep-checks').innerHTML = K.checks(st.raw, st.def.id, st.room);
  }

  // ===== Side panel (DOM) =====
  function msg(t, cls = '') { const m = panel.querySelector('#ep-msg'); m.textContent = t; m.className = cls; }
  function buildPanel(st) {
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'editpanel';
      panel.innerHTML = `
        <div id="ep-info"><div id="ep-picked"></div><div id="ep-hover"></div></div>
        <h1>EDIT MODE</h1><div id="ep-map" class="help"></div>
        <div class="row">
          <button data-act="play">\` Play</button>
          <button data-act="save" class="primary">Save</button>
          <button data-act="restart">Restart</button>
        </div>
        <div id="ep-msg"></div><div id="ep-dirty"></div>
        <div id="ep-car" style="display:none"><h2>THIS CAR</h2><div id="ep-car-rows"></div></div>
        <h2>CHECKS</h2><div id="ep-checks"></div>
        <h2>LAYER</h2>
        <div class="row"><button data-layer="ground">Ground</button><button data-layer="top">Top (roofs, leaf canopy)</button></div>
        <div id="ep-ground"></div>
        <div id="ep-topbox" style="display:none">
          <h2>TOP LAYER</h2><div class="grid" id="ep-top"></div>
          <div class="help">Roofs fade when you walk inside. Leaf canopy looks like hedge but you walk under it (a hidden path).</div>
        </div>
        <h2>CONTROLS</h2>
        <div class="help">
          WASD / arrows: fly around (through walls)<br>
          - / + : zoom out / in<br>
          Click or drag: place · Right-click: copy<br>
          Delete / Backspace: pick the Delete tool<br>
          Ctrl/Cmd+Z: undo · Shift+Ctrl/Cmd+Z: redo<br>
          \` : back to playing, right where you are
        </div>`;
      document.body.appendChild(panel);
      K.wireChecks(panel.querySelector('#ep-checks'));
      panel.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        b.blur(); // so Space/Enter in the game never re-press a panel button
        const s = G.state;
        if (b.dataset.layer) { setLayer(s, b.dataset.layer); return; }
        if (b.dataset.carprop) { changeCar(s, b.dataset.carprop, +b.dataset.dir); return; }
        if (b.dataset.act === 'play') EM.exit(s);
        else if (b.dataset.act === 'save') save(s);
        else if (b.dataset.act === 'restart') { EM.exit(s); G.setState(new G.Stage(s.def, s.crewId)); }
      });
    }
    const theme = st.room.theme;
    if (panel.dataset.theme !== st.def.theme) { // palettes depend on the tileset
      K.buildPalette(panel.querySelector('#ep-ground'), theme, (c) => pick(G.state, c), hoverText);
      const top = panel.querySelector('#ep-top'); top.innerHTML = '';
      for (const [ch, label] of TOP_PALETTE) K.paletteButton(ch, label, topIcon(theme, ch), top, (c) => pickTop(G.state, c), hoverText);
      panel.dataset.theme = st.def.theme;
    }
    panel.querySelector('#ep-map').textContent = (G.MAPS[st.def.id] || {}).name + ' · ' + theme.label;
    panel.querySelector('#ep-checks').innerHTML = K.checks(st.raw, st.def.id, st.room);
    pick(st, st.edit.tool);
    setLayer(st, st.edit.layer || 'ground');
  }
  // What the mouse is over: a palette button (its name) or a map cell (what's there, both layers)
  function hoverText(t) { if (panel) panel.querySelector('#ep-hover').textContent = t ? 'HOVER: ' + t : ''; }
  function hoverCell(st, c) {
    if (!c) return hoverText(null);
    const top = st.room.overAt(c.x, c.y), tl = TOP_PALETTE.find((t) => t[0] === top);
    hoverText(c.x + ',' + c.y + '  ' + labelAt(st, c.x, c.y) + (top !== '.' && tl ? '  ·  TOP: ' + tl[1] : ''));
  }
  const TOP_PALETTE = [['.', 'DELETE (TOP LAYER)'], ['R', 'ROOF'], ['L', 'LEAF CANOPY (WALK UNDER, GAPS = SECRET)'], ['M', 'SOLID HEDGE FILL (BLOCKS)']];
  function topIcon(theme, ch) {
    const c = G.makeCanvas(16, 16), x = c.getContext('2d');
    const r = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    if (ch === '.') return K.deleteIcon();
    if (ch === 'R') return K.tilePreview(theme, 'R');
    else if (theme.canopyTile) { const b = G.makeCanvas(16, 32); theme.canopyTile((a, y, w, h, col) => { const bx = b.getContext('2d'); bx.fillStyle = col; bx.fillRect(a, y, w, h); }, 0, 0, null, ch === 'M'); x.drawImage(b, 0, 0, 16, 32, 0, 0, 16, 16); }

  }
  function setLayer(st, layer) {
    if (!st || !st.edit) return;
    st.edit.layer = layer;
    panel.querySelectorAll('[data-layer]').forEach((b) => b.classList.toggle('primary', b.dataset.layer === layer));
    panel.querySelector('#ep-ground').style.display = layer === 'ground' ? '' : 'none';
    panel.querySelector('#ep-topbox').style.display = layer === 'top' ? '' : 'none';
    if (layer === 'top') pickTop(st, st.edit.topTool || 'L');
    else pick(st, st.edit.tool);
  }
  function pickTop(st, ch) {
    if (!st || !st.edit) return;
    st.edit.topTool = ch;
    panel.querySelectorAll('#ep-top .pal').forEach((b) => b.classList.toggle('on', b.dataset.ch === ch));
    panel.querySelector('#ep-picked').textContent = 'TOP LAYER: ' + (TOP_PALETTE.find((t) => t[0] === ch) || [ch, ch])[1];
  }
  function pick(st, ch) {
    if (!st || !st.edit) return; // palette clicked while not editing
    if (ch !== st.edit.tool) showCar(st, null); // the car panel belongs to the car brush
    st.edit.tool = ch;
    panel.querySelectorAll('#ep-ground .pal').forEach((b) => b.classList.toggle('on', b.dataset.ch === ch));
    panel.querySelector('#ep-picked').textContent = 'PLACING: ' + K.labelOf(st.room.theme, ch) + '  (' + ch + ')';
  }
  function setDirty(on) { EM.dirty = on; if (panel) panel.querySelector('#ep-dirty').textContent = on ? '● unsaved changes' : ''; }
  async function save(st) {
    try { await K.save(); setDirty(false); msg('Saved to src/maps.js — commit it to keep it on GitHub.', 'ok'); }
    catch (e) { msg(e.message === 'stale' ? K.STALE_HELP : K.SAVE_HELP, 'bad'); }
  }

  // ===== Mouse painting =====
  function worldCell(st, e) {
    const g = G.screenToGame(e.clientX, e.clientY);
    if (!g) return null;
    const z = st.edit.zoom, x = Math.floor((st.edit.cx + g.x / z) / 16), y = Math.floor((st.edit.cy + g.y / z) / 16);
    return x >= 0 && y >= 0 && x < st.room.w && y < st.room.h ? { x, y } : null;
  }
  function paint(st, c) {
    const E = st.edit;
    if (!c || !E.stroke) return;
    const top = E.layer === 'top', to = top ? E.topTool : K.resolve(st.room.theme, E.tool);
    if (!top && to === 'c' && st.raw[c.y][c.x] === 'c') { // the car brush on a car: select it (its panel opens)
      if (E.cycled) return;
      E.cycled = true;
      showCar(st, G.pieceAnchor(st.room, c.x, c.y));
      return;
