<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay diagnostic v2</title>
<style>
body { font-family: ui-monospace, Menlo, monospace; background: #111; color: #eee; padding: 16px; max-width: 600px; margin: auto; }
#myid { font-size: 24px; color: #ffd23a; word-break: break-all; }
#status { font-size: 20px; margin: 8px 0; }
#status.ok { color: #38f0a0; } #status.bad { color: #ff5ab0; } #status.warn { color: #ffd23a; }
input { font-size: 20px; width: 12em; padding: 6px; }
button { font-size: 20px; padding: 8px 18px; margin: 6px 6px 0 0; }
#log { white-space: pre-wrap; background: #000; padding: 10px; min-height: 200px; margin-top: 12px; font-size: 13px; }
.good { color: #38f0a0; } .bad { color: #ff5ab0; }
</style>
</head>
<body>
<h2>RELAY DIAGNOSTIC v2</h2>
<div>Keep this page <b>in the foreground</b> on both devices the whole time.</div>
<div>1. Wait for CONNECTED on both. 2. Ping each way.</div>
<p>MY ID: <span id="myid">...</span></p>
<div id="status" class="warn">CONNECTING...</div>
<p><input id="target" placeholder="other device id" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="ping">PING</button><button id="re" style="display:none">RECONNECT</button></p>
<div id="log"></div>
<script>
const logEl = document.getElementById('log'), statusEl = document.getElementById('status');
const log = (m, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = new Date().toLocaleTimeString() + ' ' + m; logEl.appendChild(d); };
const setStatus = (t, cls) => { statusEl.textContent = t; statusEl.className = cls; };
const rnd = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map(v => 'abcdefghijkmnpqrstuvwxyz23456789'[v % 32]).join('');
let me = '', ws = null, hb = 0, pingTimer = 0;
function connect() {
  me = 'afkdiag-' + rnd(6);
  document.getElementById('myid').textContent = me;
  document.getElementById('re').style.display = 'none';
  setStatus('CONNECTING...', 'warn');
  // same server, same URL shape, same envelope AND same 5s heartbeat the game uses
  ws = new WebSocket('wss://0.peerjs.com/peerjs?key=peerjs&id=' + me + '&token=' + rnd(10) + '&version=1.5.4');
  ws.onopen = () => { log('socket open'); hb = setInterval(() => { if (ws.readyState === 1) ws.send('{"type":"HEARTBEAT"}'); }, 5000); };
  ws.onmessage = (e) => {
    let d; try { d = JSON.parse(e.data); } catch (_) { return; }
    if (d.type === 'OPEN') { setStatus('CONNECTED', 'ok'); log('registered as ' + me, 'good'); return; }
    if (d.type === 'ID-TAKEN') { log('ID-TAKEN (weird)', 'bad'); return; }
    if (d.type === 'ERROR') { log('SERVER ERROR: ' + JSON.stringify(d), 'bad'); return; }
    if (!d.payload) return;
    if (d.payload.k === 'diag-ping') {
      log('ping from ' + d.src + ' -> pong');
      ws.send(JSON.stringify({ type: 'OFFER', dst: d.src, payload: { k: 'diag-pong', t: d.payload.t } }));
    } else if (d.payload.k === 'diag-pong') {
      clearTimeout(pingTimer);
      log('PONG (' + (Date.now() - d.payload.t) + 'ms) - RELAY WORKS', 'good');
    }
  };
  ws.onerror = () => log('socket error', 'bad');
  ws.onclose = () => {
    clearInterval(hb); clearTimeout(pingTimer);
    setStatus('CONNECTION LOST', 'bad');
    log('SOCKET CLOSED - this device can no longer be reached', 'bad');
    document.getElementById('re').style.display = '';
  };
}
document.getElementById('ping').onclick = () => {
  const to = document.getElementById('target').value.trim();
  if (!to || !ws || ws.readyState !== 1) { log('enter the other id first', 'bad'); return; }
  ws.send(JSON.stringify({ type: 'OFFER', dst: to, payload: { k: 'diag-ping', t: Date.now() } }));
  log('ping sent to ' + to);
  clearTimeout(pingTimer);
  pingTimer = setTimeout(() => log('NO REPLY AFTER 10s', 'bad'), 10000);
};
document.getElementById('re').onclick = () => { logEl.innerHTML = ''; connect(); };
connect();
</script>
</body>
</html>
