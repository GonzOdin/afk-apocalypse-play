# After `fly launch` (it generates most of this), make sure the service looks like:
# app = "afk-apocalypse-signal"
# primary_region = "sea"   # pick one near you
#
# [http_service]
#   internal_port = 9000
#   force_https = true
#   auto_stop_machines = "off"   # keep it awake: a sleeping lobby misses joins
#   auto_start_machines = true
#   min_machines_running = 1
#   [http_service.concurrency]
#     type = "connections"
#     hard_limit = 500
#     soft_limit = 400

app = "afk-apocalypse-play"
primary_region = "ams"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8_080
min_machines_running = 0
processes = [ "app" ]

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 256
